": 1, "pc": "1.3", "topic": "Choices", "stem": "Which phrasing best assists a non-technical customer to select a preferred option?", "feedback": "Criterion 1.3 requires effective communication about available choices. The range statement asks for clear, concise language suited to the audience — the trade-off has to be stated in terms the customer can weigh.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.3 of this unit."], "kind": "mc", "options": ["\"I can get you working again in ten minutes but you would lose this morning's edits, or keep everything and wait until after lunch. Which suits you?\"", "\"Do you want the recovery point objective from last night's snapshot, or a point-in-time restore from the archive tier on the secondary site, which has the longer turnaround?\"", "\"I would recommend the snapshot. Shall I go ahead?\"", "\"Either way there will be some data loss, so it does not matter much which you pick.\""], "answer": 0}, {"id": "5e30f0fb46", "unit": "BSBCOR0103D", "element": 2, "pc": "2.1", "topic": "Prompt service", "stem": "What makes service \"prompt\" in the sense of criterion 2.1?", "feedback": "Criterion 2.1 measures promptness against organisational and legislative requirements, not against a general sense of speed. That is what makes it assessable.", "hints": ["Prompt against what? The criterion names the benchmark.", "Re-read performance criterion 2.1 of this unit."], "kind": "mc", "options": ["It meets the identified need within the timeframe set by organisational and legislative requirements", "It is delivered faster than the customer expected", "It is delivered as soon as the technician becomes free, which on a busy day may still be several hours after the call", "It is delivered on the same day the request was made"], "answer": 0}, {"id": "3de153f699", "unit": "BSBCOR0103D", "element": 2, "pc": "2.1", "topic": "Prompt service", "stem": "Meeting the response time in a service level agreement satisfies criterion 2.1 even if the customer's need was not actually met.", "feedback": "Criterion 2.1 requires prompt service that meets identified needs. Answering the phone quickly and then not resolving the need fails the criterion.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "6fd3671100", "unit": "BSBCOR0103D", "element": 2, "pc": "2.2", "topic": "Rapport", "stem": "Criterion 2.2 requires rapport to be established and maintained in order to:", "feedback": "The criterion states the purpose explicitly: rapport exists to ensure completion of quality service delivery. It is a working relationship, not a sales technique.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.2 of this unit."], "kind": "mc", "options": ["Ensure completion of quality service delivery", "Increase the likelihood of repeat purchases", "Make complaints less likely to be escalated", "Reduce the time each service call takes"], "answer": 0}, {"id": "b406f59b8d", "unit": "BSBCOR0103D", "element": 2, "pc": "2.2", "topic": "Rapport", "stem": "A job will take three days longer than promised. What best maintains rapport?", "feedback": "Maintaining rapport under criterion 2.2 means the relationship survives bad news. Silence does more damage than the delay.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.2 of this unit."], "kind": "mc", "options": ["Tell the customer as soon as you know, explain why, and give a new date", "Wait until the original date, then explain the delay", "Work extra hours quietly and try to recover the original date", "Tell the customer only if they ask for an update"], "answer": 0}, {"id": "079f4292ef", "unit": "BSBCOR0103D", "element": 2, "pc": "2.3", "topic": "Complaints", "stem": "Criterion 2.3 requires customer complaints to be handled:", "feedback": "The exact wording of criterion 2.3 is \"sensitively and courteously ... in accordance with organisational and legislative requirements\".", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.3 of this unit."], "kind": "mc", "options": ["Sensitively and courteously, in accordance with organisational and legislative requirements", "Quickly, so the complaint does not escalate", "In writing, so there is a record of what was agreed", "By a supervisor, since handling complaints falls outside the service technician's own role and authority"], "answer": 0}, {"id": "635b388a7c", "unit": "BSBCOR0103D", "element": 2, "pc": "2.3", "topic": "Complaints", "stem": "Which THREE of these are listed in the range statement as customer complaints?", "feedback": "The range statement lists administrative errors, customer satisfaction with service quality, damaged or undelivered goods, delivery errors, late delivery, service errors and warehouse or store room errors.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.3 of this unit."], "kind": "ms", "options": ["Administrative errors such as incorrect invoices or prices", "Damaged goods or goods not delivered", "Product not delivered on time", "A competitor offering a lower price", "A staff member arriving late for work"], "answers": [0, 1, 2]}, {"id": "d83e14b869", "unit": "BSBCOR0103D", "element": 2, "pc": "2.3", "topic": "Complaints", "stem": "A customer is angry and says the service desk \"never fixes anything properly\". What is the first thing to do?", "feedback": "Handling a complaint sensitively under criterion 2.3 starts with listening. A generalised complaint has to be turned into specifics before anything can be fixed — and defending the record first closes that down.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.3 of this unit."], "kind": "mc", "options": ["Let them finish, acknowledge the frustration, and ask for the specifics of what went wrong", "Correct the exaggeration, since the record shows most tickets are resolved", "Apologise and offer a replacement immediately", "Refer the complaint straight to your supervisor"], "answer": 0}, {"id": "bc09b01436", "unit": "BSBCOR0103D", "element": 2, "pc": "2.3", "topic": "Complaints", "stem": "A complaint about service quality is still a complaint even when no goods were involved.", "feedback": "The range statement explicitly lists \"customer satisfaction with service quality\" as a form of complaint.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "e6dbb95226", "unit": "BSBCOR0103D", "element": 2, "pc": "2.4", "topic": "Specific needs", "stem": "Which of these is listed in the range statement under the specific needs of customers?", "feedback": "The range statement lists age, beliefs/values, culture, disability, gender, language and religious/spiritual observances as specific needs.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.4 of this unit."], "kind": "mc", "options": ["Religious/spiritual observances", "Technical skill level", "Preferred contact method", "Length of time as a customer"], "answer": 0}, {"id": "60e0245545", "unit": "BSBCOR0103D", "element": 2, "pc": "2.4", "topic": "Specific needs", "stem": "A customer who is deaf raises a ticket about a fault that normally needs a phone call to diagnose. What does criterion 2.4 require?", "feedback": "Criterion 2.4 requires assistance to be provided or the customer responded to according to their specific needs. The point is that the channel adapts to the customer.", "hints": ["Which option keeps the customer, rather than a third party, in control of their own service call?", "Re-read performance criterion 2.4 of this unit."], "kind": "mc", "options": ["Provide assistance in a form that works for the customer, such as chat, email or an on-site visit", "Ask a colleague of the customer to relay the call", "Send a technician to site in every case, to be safe", "Handle the ticket by email only, and note on the record that a diagnostic call was not possible in this case"], "answer": 0}, {"id": "6be5c9c736", "unit": "BSBCOR0103D", "element": 2, "pc": "2.4", "topic": "Specific needs", "stem": "Match each specific need from the range statement to a reasonable adjustment on an IT service desk.", "feedback": "Criterion 2.4 is about responding to the customer in front of you. Each of these adjustments costs little and changes whether the service is actually usable.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 2.4."], "kind": "match", "left": ["Language", "Disability", "Religious/spiritual observances", "Culture"], "right": ["Arrange an interpreter, or provide the steps in the customer's first language", "Offer chat or email where a phone call is not usable", "Avoid scheduling the outage window during a known observance", "Do not press for eye contact where it would be inappropriate"], "answer": [0, 1, 2, 3]}, {"id": "1cac2f97f8", "unit": "BSBCOR0103D", "element": 2, "pc": "2.5", "topic": "Promotion", "stem": "Which of these is listed in the range statement as an opportunity to promote and enhance services and products?", "feedback": "The range statement lists extending time lines, packaging procedures, procedures for delivery of goods, returns policy, system for recording complaints, and updating the customer service charter.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.5 of this unit."], "kind": "mc", "options": ["Updating the customer service charter", "Offering a discount for early payment", "Advertising on social media", "Running a customer loyalty scheme"], "answer": 0}, {"id": "c820e486c5", "unit": "BSBCOR0103D", "element": 2, "pc": "2.5", "topic": "Promotion", "stem": "While fixing a user's laptop you notice the department is still on an unsupported operating system. Under criterion 2.5, the right move is to:", "feedback": "Criterion 2.5 is about identifying and using available opportunities to enhance services. Recognising the opportunity is the competency; acting outside your authority is not.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.5 of this unit."], "kind": "mc", "options": ["Note the risk and raise the upgrade as an available option through the proper channel", "Upgrade it while you are there, since removing an unsupported system plainly improves the service", "Say nothing — it was not what you were called for", "Tell the user their department is out of compliance"], "answer": 0}, {"id": "0a75f6ca07", "unit": "BSBCOR0103D", "element": 2, "pc": "2.1", "topic": "Prompt service", "stem": "", "feedback": "The wording matters in assessment: prompt, identified, legislative. \"Identified\" ties the delivery back to Element 1.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Criterion 2.1 requires "}, {"gap": 0}, {"t": " service that meets "}, {"gap": 1}, {"t": " needs in accordance with organisational and "}, {"gap": 2}, {"t": " requirements."}], "pool": ["prompt", "identified", "legislative", "courteous", "urgent", "anticipated", "contractual"], "answer": [0, 1, 2]}, {"id": "2ec4c87d64", "unit": "BSBCOR0103D", "element": 2, "pc": "2.3", "topic": "Complaints", "stem": "", "feedback": "Recording the complaint is what turns it into evidence for Element 3 — the range statement names \"system for recording complaints\" as an improvement opportunity in its own right.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "A complaint arrives. Drag the steps into order: "}, {"gap": 0}, {"t": " the complaint without interrupting, "}, {"gap": 1}, {"t": " the customer's position, "}, {"gap": 2}, {"t": " the complaint in the register, "}, {"gap": 3}, {"t": " on what will happen and by when."}], "pool": ["listen to", "acknowledge", "record", "agree", "dismiss", "escalate", "invoice"], "answer": [0, 1, 2, 3]}, {"id": "6f079cce29", "unit": "BSBCOR0103D", "element": 2, "pc": "2.4", "topic": "Specific needs", "stem": "", "feedback": "Age, beliefs/values, culture, disability, gender, language and religious/spiritual observances are all named. Responding to them is a performance criterion, not an optional kindness.", "hints": ["Each gap is marked separately — a wrong one does not cost you the others."], "kind": "cloze", "parts": [{"t": "Criterion 2.4 requires you to respond to customers with specific needs according to organisational and legislative requirements. The range statement lists seven such needs, including "}, {"gap": {"type": "mc", "options": ["culture", "seniority", "location", "job title"], "answers": [0], "accept": ["culture"], "wild": false}}, {"t": " and "}, {"gap": {"type": "mc", "options": ["disability", "device type", "shift pattern", "department"], "answers": [0], "accept": ["disability"], "wild": false}}, {"t": ". Adjusting how a service is delivered for these reasons is "}, {"gap": {"type": "mc", "options": ["required by the criterion", "a courtesy but not assessable", "only necessary if the customer asks", "at the technician's discretion"], "answers": [0], "accept": ["required by the criterion"], "wild": false}}, {"t": "."}]}, {"id": "d117bdd6c3", "unit": "BSBCOR0103D", "element": 2, "pc": "2.5", "topic": "Promotion", "stem": "The published standard for this unit prints a stray second criterion numbered 2.5 under Element 1, whose wording duplicates criterion 2.1 rather than the real 2.5. When mapping assessment evidence, you should:", "feedback": "This is a real defect in the published NCTVET standard for this unit — a mis-numbered duplicate, not an alternative wording. A documented query is the correct response; silently picking one reading leaves the assessment mapping unauditable.", "hints": ["This one is about your obligations as an assessor, not about customer service.", "Re-read performance criterion 2.5 of this unit."], "kind": "mc", "options": ["Record the discrepancy and confirm with the awarding body which wording is authoritative", "Use whichever version is easier to assess", "Ignore the duplicate, since the wording of the two versions is broadly similar and the intent of the criterion is clear", "Assess both versions as separate criteria"], "answer": 0}, {"id": "22a338e77e", "unit": "BSBCOR0103D", "element": 3, "pc": "3.1", "topic": "Satisfaction", "stem": "Criterion 3.1 requires customer satisfaction to be reviewed using:", "feedback": "The criterion names verifiable evidence specifically, and the range statement lists what counts: satisfaction questionnaires, audit documentation and reports, quality assurance data, returned goods, lapsed customers, service calls and complaints.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.1 of this unit."], "kind": "mc", "options": ["Verifiable evidence", "The technician's judgement of how calls went", "The number of tickets closed within target", "The absence of complaints"], "answer": 0}, {"id": "ff02b0c3ef", "unit": "BSBCOR0103D", "element": 3, "pc": "3.1", "topic": "Satisfaction", "stem": "Which THREE of these does the range statement list as verifiable evidence?", "feedback": "Verifiable evidence in this unit is customer satisfaction questionnaires, audit documentation and reports, quality assurance data, returned goods, lapsed customers, service calls and complaints.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.1 of this unit."], "kind": "ms", "options": ["Customer satisfaction questionnaires", "Quality assurance data", "Lapsed customers", "Staff appraisal records", "Supplier price lists"], "answers": [0, 1, 2]}, {"id": "62a1ac9b28", "unit": "BSBCOR0103D", "element": 3, "pc": "3.1", "topic": "Satisfaction", "stem": "Why does the range statement treat lapsed customers as verifiable evidence of satisfaction?", "feedback": "Most dissatisfied customers never complain; they leave. A lapse rate is measurable in a way that goodwill is not.", "hints": ["What does a customer who is unhappy usually do instead of complaining?", "Re-read performance criterion 3.1 of this unit."], "kind": "mc", "options": ["Customers who stop coming back are recorded data about dissatisfaction that never arrived as a complaint", "They are the customers most likely to respond to a satisfaction questionnaire, since they have already formed a view", "They indicate that pricing is uncompetitive", "They must be contacted before the account can be closed"], "answer": 0}, {"id": "0ab198f78f", "unit": "BSBCOR0103D", "element": 3, "pc": "3.1", "topic": "Satisfaction", "stem": "\"No complaints this month\" is acceptable verifiable evidence of customer satisfaction.", "feedback": "Absence of complaint is not evidence of satisfaction. Criterion 3.1 requires satisfaction to be reviewed using the verifiable evidence named in the range statement.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "b4e2030bfb", "unit": "BSBCOR0103D", "element": 3, "pc": "3.2", "topic": "Quality", "stem": "Criterion 3.2 requires opportunities to enhance quality to be identified and:", "feedback": "Identifying an improvement is only half of criterion 3.2 — it must then be pursued, and pursued within the organisation's own rules.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.2 of this unit."], "kind": "mc", "options": ["Pursued within organisational and legislative requirements", "Reported to the customer who raised them", "Implemented as soon as they are found", "Ranked in order of the cost of implementing each one of them"], "answer": 0}, {"id": "4808a18487", "unit": "BSBCOR0103D", "element": 3, "pc": "3.3", "topic": "Procedures", "stem": "Criterion 3.3 requires the procedural aspects of service delivery to be monitored for:", "feedback": "A procedure can be followed perfectly and still be the wrong procedure. Criterion 3.3 asks both whether it works and whether it suits the customer.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.3 of this unit."], "kind": "mc", "options": ["Effectiveness and suitability to customer requirements", "Compliance and cost", "Speed and accuracy", "Consistency of delivery and completeness of documentation"], "answer": 0}, {"id": "d8797b4a39", "unit": "BSBCOR0103D", "element": 3, "pc": "3.3", "topic": "Procedures", "stem": "Every password reset requires a signed form delivered in person. Tickets are closed within target, but users have started sharing passwords to avoid the process. Under criterion 3.3, this shows the procedure is:", "feedback": "This is exactly what criterion 3.3 exists to catch. A procedure that customers route around is not suitable, whatever the ticket statistics say — and the workaround is a security failure caused by the design.", "hints": ["The ticket numbers look fine. Something else has gone wrong.", "Re-read performance criterion 3.3 of this unit."], "kind": "mc", "options": ["Effective on paper but not suitable to customer requirements, so it should be reviewed", "Working correctly, since the target is being met", "A security problem rather than a service problem", "Adequate, because the customers have found a workaround that keeps them working at no extra cost"], "answer": 0}, {"id": "5aa1da6e00", "unit": "BSBCOR0103D", "element": 3, "pc": "3.4", "topic": "Feedback", "stem": "Criterion 3.4 requires customer feedback to be:", "feedback": "Two words carry the criterion: \"regularly\" and \"used\". Feedback that is collected and filed satisfies neither.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.4 of this unit."], "kind": "mc", "options": ["Regularly sought and used to improve the provision of products and services", "Collected at the close of every service call and stored against the ticket record", "Recorded and retained for audit", "Passed to management for action"], "answer": 0}, {"id": "d11d232faf", "unit": "BSBCOR0103D", "element": 3, "pc": "3.4", "topic": "Feedback", "stem": "Criterion 3.4 is met by sending an annual satisfaction survey and filing the results.", "feedback": "The criterion requires feedback to be sought regularly AND used to improve provision. Filing is not using.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "9720280676", "unit": "BSBCOR0103D", "element": 3, "pc": "3.5", "topic": "Reports", "stem": "Criterion 3.5 requires reports to be clear, detailed and to contain:", "feedback": "Criterion 3.5 asks for recommendations, and for them to be focused on what is critical. A report that describes without recommending does not meet it.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.5 of this unit."], "kind": "mc", "options": ["Recommendations focused on critical aspects of service delivery", "A full log of every service call in the period", "A summary of the technician's workload", "A comparison against the previous reporting period"], "answer": 0}, {"id": "8337feee10", "unit": "BSBCOR0103D", "element": 3, "pc": "3.5", "topic": "Reports", "stem": "Which of these best meets criterion 3.5?", "feedback": "Clear, detailed and carrying a recommendation focused on something critical. The others are counts, vagueness, and raw data with the thinking left to the reader.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.5 of this unit."], "kind": "mc", "options": ["\"Reopen rate on password resets is 22%. Recommend self-service reset, which removes the manual step where the error occurs.\"", "\"We closed 412 tickets this month, up from 388.\"", "\"Service delivery was satisfactory overall this period, with some minor issues the team is aware of and already working on.\"", "\"Ticket volumes and reopen rates for each category are attached.\""], "answer": 0}, {"id": "188e9060e2", "unit": "BSBCOR0103D", "element": 3, "pc": "3.1", "topic": "Satisfaction", "stem": "Match each source of verifiable evidence to what it reveals.", "feedback": "Each source shows something the others cannot. Criterion 3.1 says evidence, plural — one source on its own gives a partial picture.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 3.1."], "kind": "match", "left": ["Returned goods", "Service calls", "Audit documentation and reports", "Customer satisfaction questionnaires"], "right": ["A product is not meeting expectations", "How often and why customers need to contact you", "Whether procedures were actually followed", "What customers say about the service when asked directly"], "answer": [0, 1, 2, 3]}, {"id": "ac69bd2e7d", "unit": "BSBCOR0103D", "element": 3, "pc": "3.5", "topic": "Reports", "stem": "", "feedback": "Clear, detailed, recommendations, critical — the four words that make this criterion assessable.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "A report under criterion 3.5 must be "}, {"gap": 0}, {"t": " and "}, {"gap": 1}, {"t": ", and must contain "}, {"gap": 2}, {"t": " focused on the "}, {"gap": 3}, {"t": " aspects of service delivery."}], "pool": ["clear", "detailed", "recommendations", "critical", "brief", "confidential", "statistics", "routine"], "answer": [0, 1, 2, 3]}, {"id": "52f3b88590", "unit": "BSBCOR0103D", "element": 3, "pc": "3.2", "topic": "Quality", "stem": "", "feedback": "Review, identify, pursue, report. Criteria 3.1, 3.2 and 3.5 in sequence — and the report feeds the next review.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "Element 3 runs as a loop. First "}, {"gap": 0}, {"t": " satisfaction using verifiable evidence, then "}, {"gap": 1}, {"t": " opportunities to enhance quality, then "}, {"gap": 2}, {"t": " them within organisational requirements, and "}, {"gap": 3}, {"t": " on what you found with recommendations."}], "pool": ["review", "identify", "pursue", "report", "ignore", "delegate", "archive"], "answer": [0, 1, 2, 3]}, {"id": "d60d0a70aa", "unit": "BSBCOR0103D", "element": 3, "pc": "3.2", "topic": "Quality", "stem": "An improvement that would breach the organisation's purchasing policy should still be implemented if it clearly improves service.", "feedback": "Criterion 3.2 requires opportunities to be pursued WITHIN organisational and legislative requirements. The right response is to recommend the change to the policy.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "ec398d9976", "unit": "BSBCOR0103D", "element": 3, "pc": "3.4", "topic": "Feedback", "stem": "", "feedback": "Criterion 3.4: regularly seek customer feedback AND use it to improve the provision of products and services.", "hints": ["Each gap is marked separately — a wrong one does not cost you the others."], "kind": "cloze", "parts": [{"t": "Feedback is sought at the close of each ticket, and the results go into a monthly report. To satisfy criterion 3.4 the organisation must also show that the feedback was "}, {"gap": {"type": "mc", "options": ["used to improve provision of products and services", "stored securely for audit", "acknowledged to each customer", "reported to senior management"], "answers": [0], "accept": ["used to improve provision of products and services"], "wild": false}}, {"t": ". The word \"regularly\" in the criterion means the seeking of feedback must be "}, {"gap": {"type": "mc", "options": ["routine and ongoing", "annual", "after every complaint", "at the manager's discretion"], "answers": [0], "accept": ["routine and ongoing"], "wild": false}}, {"t": "."}]}, {"id": "f273617f79", "unit": "BSBCOR0103D", "element": 3, "pc": "3.3", "topic": "Procedures", "stem": "Which activity belongs to Element 3 rather than Element 2?", "feedback": "Element 2 delivers the service. Element 3 stands back and monitors whether the delivery, and the procedures behind it, are working.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.3 of this unit."], "kind": "mc", "options": ["Reviewing whether the escalation procedure is still suitable for customers", "Handling an angry customer courteously", "Providing assistance to a customer whose specific needs relate to a disability", "Establishing rapport at the start of a service call"], "answer": 0}, {"id": "aa5a063c58", "unit": "BSBCOR0103D", "element": 3, "pc": "3.5", "topic": "Reports", "stem": "Aggregating six months of service calls shows 40% concern one legacy application. What does this represent under Element 3?", "feedback": "Service calls are named in the range statement as verifiable evidence. Aggregated, they become the basis for a recommendation under criterion 3.5.", "hints": ["Which element are you in once you are looking at six months of data rather than one call?", "Re-read performance criterion 3.5 of this unit."], "kind": "mc", "options": ["Verifiable evidence supporting a recommendation focused on a critical aspect of service delivery", "A complaint that must be handled sensitively and courteously", "A limitation in addressing customer needs that must be referred to a designated individual for assistance", "An opportunity to promote and enhance services to customers"], "answer": 0}]}, {"code": "BSBCOR0113B", "title": "Maintain workplace safety", "questions": [{"id": "5480397ac1", "unit": "BSBCOR0113B", "element": 1, "pc": "1.1", "topic": "Safety info", "stem": "Criterion 1.1 requires explanations of OHS legislation and codes of practice given to the workgroup to be monitored. Monitored for what?", "feedback": "The criterion has two tests: the explanation must suit the individual, and it must match organisational requirements. A register proves attendance, not understanding.", "hints": ["Your role here is monitoring the explanation, not giving it.", "Re-read performance criterion 1.1 of this unit."], "kind": "mc", "options": ["That they meet individual needs and accord with organisational requirements", "That they are delivered by a qualified safety officer", "That every member of the workgroup signs an attendance record", "That they are repeated at least once each year"], "answer": 0}, {"id": "54b89b7e7f", "unit": "BSBCOR0113B", "element": 1, "pc": "1.1", "topic": "Individual needs", "stem": "Which THREE does the range statement list under \"individual needs\"?", "feedback": "Individual needs may relate to literacy, communication skills, gender, cultural background, people with disabilities, part-time, contract or casual workers, level of experience and existing knowledge.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.1 of this unit."], "kind": "ms", "options": ["Literacy", "Cultural background", "Level of experience", "Job title", "Pay grade"], "answers": [0, 1, 2]}, {"id": "330fcd0c15", "unit": "BSBCOR0113B", "element": 1, "pc": "1.1", "topic": "Individual needs", "stem": "A safety briefing is delivered as a dense written handout to a team that includes two people with low literacy and three whose first language is not English. Under criterion 1.1 this is:", "feedback": "Criterion 1.1 requires explanations to meet individual needs. Equal distribution is not equal access.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.1 of this unit."], "kind": "mc", "options": ["Inadequate, because the explanation does not meet individual needs", "Adequate, because the information was made available to everyone", "Adequate, provided the handout is accurate and current", "Inadequate only if someone is later injured"], "answer": 0}, {"id": "62b8888599", "unit": "BSBCOR0113B", "element": 1, "pc": "1.2", "topic": "Safety info", "stem": "Criterion 1.2 requires the quality of information on OHS policies, procedures and programs to be monitored so that they remain:", "feedback": "Two conditions, both testable: current, and reachable by the people who need them. A correct procedure locked in a manager's drawer fails.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.2 of this unit."], "kind": "mc", "options": ["Up-to-date and readily accessible to the workgroup", "Confidential and held by designated personnel", "Approved by the health and safety committee", "Consistent with the practice of comparable organisations"], "answer": 0}, {"id": "7f53e46399", "unit": "BSBCOR0113B", "element": 1, "pc": "1.2", "topic": "Safety info", "stem": "Criterion 1.2 is satisfied once improvements to OHS information have been identified.", "feedback": "The criterion requires improvements to be identified AND implemented. Identification alone leaves the information exactly as it was.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "f09d2f8686", "unit": "BSBCOR0113B", "element": 1, "pc": "1.3", "topic": "Hazard info", "stem": "Criterion 1.3 requires the workgroup's understanding of hazard information to be assessed:", "feedback": "Regularly, by feedback and questioning, and suited to the individual. A one-off written test suits neither the frequency nor the individual.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.3 of this unit."], "kind": "mc", "options": ["Regularly, through feedback and questioning suited to individual needs", "Annually, through a written test", "At induction, and again whenever a new hazard is introduced", "By the health and safety representative during inspections"], "answer": 0}, {"id": "79f807ae5f", "unit": "BSBCOR0113B", "element": 1, "pc": "1.2", "topic": "Safety info", "stem": "", "feedback": "Explanations, quality, understanding — criteria 1.1, 1.2 and 1.3 in turn. All three are about information reaching people, not about paperwork.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Under Element 1 you monitor three things: the "}, {"gap": 0}, {"t": " given to the workgroup, the "}, {"gap": 1}, {"t": " of information on policies and procedures, and the workgroup's "}, {"gap": 2}, {"t": " of hazard and risk information."}], "pool": ["explanations", "quality", "understanding", "records", "quantity", "attendance", "compliance"], "answer": [0, 1, 2]}, {"id": "674c99b04b", "unit": "BSBCOR0113B", "element": 1, "pc": "1.3", "topic": "Hazard info", "stem": "Outcomes of risk assessment and risk control procedures are information the workgroup must be given, not just records for management.", "feedback": "Criterion 1.3 covers information about identified hazards and the outcomes of risk assessment and risk control procedures, and requires the workgroup's understanding of it to be assessed.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "d10f54268b", "unit": "BSBCOR0113B", "element": 2, "pc": "2.1", "topic": "Participation", "stem": "Criterion 2.1 requires the importance of effective participative arrangements to be promoted, and all members of the workgroup to be:", "feedback": "The criterion is about everyone being able to contribute, not about everyone attending. Representation is one arrangement among several.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.1 of this unit."], "kind": "mc", "options": ["Encouraged to contribute in accordance with organisational policy and procedures", "Represented by an elected health and safety representative", "Present at every health and safety committee meeting", "Trained in hazard identification and risk assessment before they are permitted to contribute"], "answer": 0}, {"id": "f65737200e", "unit": "BSBCOR0113B", "element": 2, "pc": "2.1", "topic": "Participation", "stem": "Which TWO does the range statement list as participative arrangements?", "feedback": "Participative arrangements may include formal and informal meetings that include OHS, OHS committees, other committees such as consultative, planning and purchasing, health and safety representatives, and employee suggestions, requests, reports and concerns.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.1 of this unit."], "kind": "ms", "options": ["Health and safety representatives", "Suggestions, requests, reports and concerns put forward by employees to management", "Annual performance appraisals", "Disciplinary hearings for safety breaches"], "answers": [0, 1]}, {"id": "229755079b", "unit": "BSBCOR0113B", "element": 2, "pc": "2.2", "topic": "Consultation", "stem": "Consultative procedures are monitored under criterion 2.2 to ensure the workgroup participates in the management of workplace hazards in accordance with:", "feedback": "Criterion 2.2 points specifically at legislative requirements — consultation is a legal duty, not an internal preference.", "hints": ["Note which criteria say \"organisational\" and which say \"legislative\". They are not interchangeable.", "Re-read performance criterion 2.2 of this unit."], "kind": "mc", "options": ["Legislative requirements", "Organisational policy", "The health and safety committee's terms of reference", "Industry best practice"], "answer": 0}, {"id": "e2170c07dc", "unit": "BSBCOR0113B", "element": 2, "pc": "2.3", "topic": "Issue resolution", "stem": "An issue is raised through consultation that you cannot resolve. Criterion 2.3 requires it to be:", "feedback": "Criterion 2.3 gives two acceptable endings for a raised issue: resolved, or referred through the workplace issue resolution procedure. Parking it is neither.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.3 of this unit."], "kind": "mc", "options": ["Referred for resolution in accordance with workplace procedures for issue resolution", "Recorded in the OHS records and reviewed at the next scheduled meeting of the workgroup", "Escalated directly to the regulator", "Held until the health and safety committee next sits"], "answer": 0}, {"id": "2f24b666ee", "unit": "BSBCOR0113B", "element": 2, "pc": "2.4", "topic": "Outcomes", "stem": "Once an OHS issue has been referred for resolution, your responsibility for it ends.", "feedback": "Criterion 2.4 requires the outcomes of consultation to be monitored and progressed. Referring an issue starts a process you still have to follow.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "bc66cacb06", "unit": "BSBCOR0113B", "element": 2, "pc": "2.4", "topic": "Outcomes", "stem": "Criterion 2.4 requires the outcomes of consultation over OHS issues to be:", "feedback": "Monitored and progressed. Consultation that produces agreed actions nobody follows up is the most common way this element fails in practice.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.4 of this unit."], "kind": "mc", "options": ["Monitored and progressed in accordance with organisational policy and procedures", "Published to the whole organisation", "Reported to the regulator within the statutory period set out in the legislation and codes", "Reviewed by an external auditor"], "answer": 0}, {"id": "5996720234", "unit": "BSBCOR0113B", "element": 2, "pc": "2.1", "topic": "Participation", "stem": "Match each participative arrangement from the range statement to what it is best suited to.", "feedback": "The range statement lists all of these. Different arrangements catch different things, which is why the criterion asks for arrangements in the plural.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 2.1."], "kind": "match", "left": ["OHS committee", "Health and safety representative", "Purchasing committee", "Informal team meeting"], "right": ["Considering organisation-wide safety policy", "Carrying an individual worker's concern forward on their behalf", "Checking safety implications before equipment is bought", "Raising a hazard noticed during this week's work"], "answer": [0, 1, 2, 3]}, {"id": "3b2d973c3c", "unit": "BSBCOR0113B", "element": 2, "pc": "2.3", "topic": "Issue resolution", "stem": "", "feedback": "Raised, monitored, resolved or referred, progressed — criteria 2.1 to 2.4 in sequence.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "Trace an issue through Element 2. A concern is "}, {"gap": 0}, {"t": " through a participative arrangement; the consultative procedure is "}, {"gap": 1}, {"t": " to confirm the workgroup took part; the issue is "}, {"gap": 2}, {"t": " or referred under the issue resolution procedure; and the outcome is "}, {"gap": 3}, {"t": "."}], "pool": ["raised", "monitored", "resolved", "progressed", "dismissed", "archived", "delegated"], "answer": [0, 1, 2, 3]}, {"id": "1253d42332", "unit": "BSBCOR0113B", "element": 3, "pc": "3.1", "topic": "Hazard ID", "stem": "Criterion 3.1 requires procedures for identifying existing and potential hazards to be:", "feedback": "Element 3 is a step back from doing: you are judging whether the hazard-identification procedure actually finds hazards.", "hints": ["Element 3 reviews procedures. It does not run them.", "Re-read performance criterion 3.1 of this unit."], "kind": "mc", "options": ["Monitored and evaluated for effectiveness", "Carried out at least once each quarter", "Documented and signed by designated personnel", "Reviewed by the health and safety committee"], "answer": 0}, {"id": "507160caf6", "unit": "BSBCOR0113B", "element": 3, "pc": "3.1", "topic": "Hazard ID", "stem": "Which THREE activities does the range statement name as ways hazards may be identified?", "feedback": "The range statement lists audits, workplace inspections, housekeeping, checking work area and equipment before and during work, job and work system assessment, reviews of OHS records, maintenance of plant and equipment, purchasing of supplies and equipment, and identifying employee concerns.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.1 of this unit."], "kind": "ms", "options": ["Workplace inspections", "Housekeeping", "Purchasing of supplies and equipment, for example review of material safety data sheets", "Payroll reconciliation", "Customer satisfaction surveys"], "answers": [0, 1, 2]}, {"id": "e0eb19dcc9", "unit": "BSBCOR0113B", "element": 3, "pc": "3.1", "topic": "Hazard ID", "stem": "A server room has been inspected monthly for two years and no hazard has ever been recorded. Under criterion 3.1 the right interpretation is:", "feedback": "A hazard identification procedure that never identifies anything is more likely to be failing than to be describing a perfect room. Criterion 3.1 asks you to evaluate it for effectiveness.", "hints": ["Two years of clean inspections. Is that good news, or is the instrument broken?", "Re-read performance criterion 3.1 of this unit."], "kind": "mc", "options": ["The procedure's effectiveness is in doubt and should be evaluated", "The room is safe and the inspection frequency could be reduced", "The inspections should continue unchanged", "The records should be reported as evidence of good performance"], "answer": 0}, {"id": "a898ea70b8", "unit": "BSBCOR0113B", "element": 3, "pc": "3.2", "topic": "Improvements", "stem": "Criterion 3.2 requires improvements to hazard identification to be:", "feedback": "Note the verb. Criteria 3.2 and 3.3 ask you to recommend; implementing may be outside your scope of responsibility.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.2 of this unit."], "kind": "mc", "options": ["Identified and recommended where necessary", "Identified and implemented where necessary", "Reported to the regulator where necessary", "Trialled before being recommended"], "answer": 0}, {"id": "3dc3a1b005", "unit": "BSBCOR0113B", "element": 3, "pc": "3.3", "topic": "Improvements", "stem": "Under Element 3 you recommend enhancements to risk assessment and risk control procedures; you are not required to implement them yourself.", "feedback": "Criterion 3.3 says recommendations are made for risk assessment and risk control procedures to be enhanced where necessary.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "0d6074d3e2", "unit": "BSBCOR0113B", "element": 3, "pc": "3.1", "topic": "Hazard ID", "stem": "", "feedback": "Existing AND potential. A procedure that only catches hazards after they have caused harm does not satisfy criterion 3.1.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Element 3 covers procedures for identifying "}, {"gap": 0}, {"t": " and "}, {"gap": 1}, {"t": " hazards in the work area, and requires them to be monitored and evaluated for "}, {"gap": 2}, {"t": "."}], "pool": ["existing", "potential", "effectiveness", "reported", "historical", "severity", "compliance"], "answer": [0, 1, 2]}, {"id": "7c746bf9fb", "unit": "BSBCOR0113B", "element": 3, "pc": "3.2", "topic": "Improvements", "stem": "Which finding would most clearly justify a recommendation under criterion 3.2?", "feedback": "Criterion 3.2 is about improving hazard IDENTIFICATION. Incidents arising from hazards the checklist cannot see is direct evidence that the identification procedure has a gap.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.2 of this unit."], "kind": "mc", "options": ["Three of the last four incidents involved hazards the inspection checklist does not cover", "Inspections are sometimes completed late", "Staff find the inspection form tedious to complete", "The inspection is signed off by the supervisor rather than by the health and safety representative"], "answer": 0}, {"id": "d5b31eaeef", "unit": "BSBCOR0113B", "element": 4, "pc": "4.3", "topic": "Hierarchy", "stem": "Which is the correct order of the hierarchy of control given in the range statement?", "feedback": "The range statement lists the hierarchy in this order under \"controlling risks\". It runs from removing the hazard to protecting the person from it — most reliable first, least reliable last.", "hints": ["It runs from removing the hazard entirely to protecting the person from a hazard that is still there.", "Re-read performance criterion 4.3 of this unit."], "kind": "mc", "options": ["Elimination, substitution, engineering controls, administrative controls, personal protective equipment", "Personal protective equipment, administrative controls, engineering controls, substitution, elimination", "Elimination, engineering controls, substitution, personal protective equipment, administrative controls", "Substitution, elimination, administrative controls, engineering controls, personal protective equipment"], "answer": 0}, {"id": "72e3dc766a", "unit": "BSBCOR0113B", "element": 4, "pc": "4.3", "topic": "Hierarchy", "stem": "", "feedback": "Elimination removes the hazard; PPE leaves it in place and relies on a person wearing something correctly every time.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "Order the hierarchy of control from most to least effective: "}, {"gap": 0}, {"t": ", "}, {"gap": 1}, {"t": ", "}, {"gap": 2}, {"t": " controls, "}, {"gap": 3}, {"t": " controls, "}, {"gap": 4}, {"t": "."}], "pool": ["elimination", "substitution", "engineering", "administrative", "personal protective equipment", "supervision", "insurance"], "answer": [0, 1, 2, 3, 4]}, {"id": "85da426735", "unit": "BSBCOR0113B", "element": 4, "pc": "4.3", "topic": "Hierarchy", "stem": "A server room has trailing power leads across the walkway. Match each proposed fix to its level in the hierarchy of control.", "feedback": "The same hazard, five levels of answer. Criterion 4.3 requires inadequacies in existing controls to be identified in accordance with this hierarchy — which means a sign is not an acceptable answer when re-routing is possible.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 4.3."], "kind": "match", "left": ["Re-route the circuits so no lead crosses the walkway", "Swap the mains extension leads for low-voltage network cable that powers the same devices", "Install fixed floor ducting over the run", "Post a sign and brief staff to step over the leads", "Issue high-visibility footwear"], "right": ["Elimination", "Substitution", "Engineering control", "Administrative control", "Personal protective equipment"], "answer": [0, 1, 2, 3, 4]}, {"id": "bdabdb8e76", "unit": "BSBCOR0113B", "element": 4, "pc": "4.1", "topic": "Control review", "stem": "Criterion 4.1 requires two things to be monitored in accordance with workplace procedures:", "feedback": "Both halves matter. A sound procedure nobody follows controls nothing, and perfect adherence to a weak procedure is not safety either.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 4.1 of this unit."], "kind": "mc", "options": ["The work procedures that control risks, and the workgroup's adherence to them", "The hazards present, and the injuries recorded", "The risk assessments carried out, and the resources allocated by management to act on them", "The training delivered, and the records kept"], "answer": 0}, {"id": "5de5899f8f", "unit": "BSBCOR0113B", "element": 4, "pc": "4.2", "topic": "Reporting", "stem": "Criterion 4.2 requires the results of monitoring existing risk control measures to be analysed and recommendations for any action:", "feedback": "Analysed, then reported — regularly, and through the workplace's own procedures.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 4.2 of this unit."], "kind": "mc", "options": ["Reported regularly in accordance with workplace procedures", "Implemented immediately by the person monitoring", "Held until the annual OHS review", "Submitted to the regulator with the incident statistics"], "answer": 0}, {"id": "f692dc8d9a", "unit": "BSBCOR0113B", "element": 4, "pc": "4.3", "topic": "Inadequacies", "stem": "You find that a risk is controlled only by a laminated warning sign, although the hazard could be engineered out. Criterion 4.3 requires you to:", "feedback": "The control exists, so a tick-box audit would pass it. Criterion 4.3 asks you to judge it against the hierarchy — an administrative control where an engineering control is available is an inadequacy.", "hints": ["There IS a control in place. The question is whether it is the right level of control.", "Re-read performance criterion 4.3 of this unit."], "kind": "mc", "options": ["Identify this as an inadequacy against the hierarchy of control and report it to designated personnel", "Replace the sign with a clearer one", "Record that a control measure is in place, since a warning sign is a control and the work area therefore has one", "Arrange the engineering work yourself"], "answer": 0}, {"id": "407e9ab974", "unit": "BSBCOR0113B", "element": 4, "pc": "4.4", "topic": "Resources", "stem": "Criterion 4.4 adds a second kind of inadequacy that must be identified and reported:", "feedback": "Criterion 4.3 covers the control measures; 4.4 covers the money, time, people and equipment needed to put them in place. A control that is approved but unfunded is a reportable inadequacy.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 4.4 of this unit."], "kind": "mc", "options": ["Inadequacies in resource allocation for implementing risk control measures", "Inadequacies in the safety training that has been provided to members of the workgroup", "Inadequacies in the OHS records", "Inadequacies in the consultative procedures"], "answer": 0}, {"id": "a80ebb1162", "unit": "BSBCOR0113B", "element": 4, "pc": "4.4", "topic": "Resources", "stem": "A risk control that has been approved but never funded should be reported under this unit.", "feedback": "Criterion 4.4 requires inadequacies in resource allocation for the implementation of risk control measures to be identified and reported to designated personnel.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "0339f5e144", "unit": "BSBCOR0113B", "element": 4, "pc": "4.3", "topic": "Hierarchy", "stem": "", "feedback": "PPE sits at the bottom of the hierarchy because it protects one person, only while worn correctly, and leaves the hazard untouched.", "hints": ["Each gap is marked separately — a wrong one does not cost you the others."], "kind": "cloze", "parts": [{"t": "A technician is exposed to dust while servicing equipment. Issuing a dust mask is a control at the level of "}, {"gap": {"type": "mc", "options": ["personal protective equipment", "engineering control", "substitution", "elimination"], "answers": [0], "accept": ["personal protective equipment"], "wild": false}}, {"t": ", which the hierarchy treats as the "}, {"gap": {"type": "mc", "options": ["least", "most"], "answers": [0], "accept": ["least"], "wild": false}}, {"t": " reliable option. Fitting local extraction at the workbench would instead be an "}, {"gap": {"type": "mc", "options": ["engineering control", "administrative control", "elimination of the hazard", "acceptable form of PPE"], "answers": [0], "accept": ["engineering control"], "wild": false}}, {"t": "."}]}, {"id": "4d52dc9c18", "unit": "BSBCOR0113B", "element": 5, "pc": "5.1", "topic": "Hazardous events", "stem": "Criterion 5.1 requires workplace procedures for dealing with hazardous events to be monitored whenever necessary to ensure that control action is:", "feedback": "Effective and timely. In an emergency a correct response that arrives too late is a failed response.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 5.1 of this unit."], "kind": "mc", "options": ["Effective and timely", "Documented and auditable", "Proportionate and affordable", "Consistent with the hierarchy of control"], "answer": 0}, {"id": "37c15bc5eb", "unit": "BSBCOR0113B", "element": 5, "pc": "5.1", "topic": "Hazardous events", "stem": "Which THREE does the range statement list as hazardous events?", "feedback": "Hazardous events may include incidents and near misses, fires and explosions, emergencies such as chemical spills, bomb scares, violent incidents such as armed robberies, workplace violence including bullying, and natural disasters or events.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 5.1 of this unit."], "kind": "ms", "options": ["Incidents and near misses", "Bomb scares", "Workplace violence, including bullying", "Industrial action", "Equipment reaching end of life"], "answers": [0, 1, 2]}, {"id": "fabd778e21", "unit": "BSBCOR0113B", "element": 5, "pc": "5.1", "topic": "Near misses", "stem": "A UPS battery vents but nobody is in the room and no damage results. Under this unit this is:", "feedback": "The range statement names \"incidents and near misses\" together. A near miss is the same event with better luck, and it is the cheapest warning you will ever get.", "hints": ["Nothing was damaged. Does that put it outside the definition?", "Re-read performance criterion 5.1 of this unit."], "kind": "mc", "options": ["A near miss, which the range statement treats as a hazardous event", "Not a hazardous event, since there was no injury or damage", "An equipment fault, to be handled under maintenance procedures", "A hazard, but not an event"], "answer": 0}, {"id": "196f883e11", "unit": "BSBCOR0113B", "element": 5, "pc": "5.2", "topic": "Investigation", "stem": "Criterion 5.2 requires hazardous events to be investigated:", "feedback": "Cause, not blame. An investigation that stops at who made the mistake leaves the conditions that allowed it fully intact.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 5.2 of this unit."], "kind": "mc", "options": ["To identify their cause, in accordance with investigation procedures", "To establish who was responsible", "To determine whether a report to the regulator is required", "To assess the cost of the damage"], "answer": 0}, {"id": "525f4a1071", "unit": "BSBCOR0113B", "element": 5, "pc": "5.3", "topic": "Control action", "stem": "Criterion 5.3 requires control measures preventing recurrence to be implemented based on the hierarchy of control if within your scope of responsibilities and competencies, or otherwise:", "feedback": "The criterion sets the boundary explicitly: act within your competence, refer beyond it. Acting outside your scope is not diligence.", "hints": ["Think about what the criterion actually asks you to  others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "After a hazardous event, criterion 5.2 requires an investigation to identify its "}, {"gap": 0}, {"t": ". Criterion 5.3 then requires control measures to prevent "}, {"gap": 1}, {"t": " to be implemented based on the "}, {"gap": 2}, {"t": ", if within your scope of responsibilities and competencies."}], "pool": ["cause", "recurrence", "hierarchy of control", "cost", "liability", "reporting procedure", "residual risk"], "answer": [0, 1, 2]}, {"id": "50421f109e", "unit": "BSBCOR0113B", "element": 6, "pc": "6.1", "topic": "Training", "stem": "Criterion 6.1 requires training records and skills audits to be regularly monitored so that:", "feedback": "The records are a means, not an end. You read them to find the training that is missing.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 6.1 of this unit."], "kind": "mc", "options": ["Ongoing workplace safety training needs are identified and addressed", "Every worker completes the required number of training hours each year", "Training certificates remain valid", "The training budget is fully spent"], "answer": 0}, {"id": "a6ba937e5c", "unit": "BSBCOR0113B", "element": 6, "pc": "6.2", "topic": "Training", "stem": "Criterion 6.2 requires the effectiveness of on-the-job and off-the-job training programs to be evaluated:", "feedback": "Note the words \"in consultation\" and \"negotiated\". Element 2's participative principle runs through the training element as well.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 6.2 of this unit."], "kind": "mc", "options": ["In consultation with relevant parties, with continuous improvements negotiated and implemented as necessary", "By testing participants at the end of each program and comparing the pass rate against that of the previous intake of learners", "By the training provider, and reported to management", "Annually, as part of the OHS management review"], "answer": 0}, {"id": "ab342602eb", "unit": "BSBCOR0113B", "element": 6, "pc": "6.1", "topic": "Training", "stem": "Which THREE does the range statement list as workplace safety training?", "feedback": "Workplace safety training may include induction training, management systems/policy, specific hazard training, specific task or equipment training, emergency and evacuation training, and training as part of broader programs such as equipment operation.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 6.1 of this unit."], "kind": "ms", "options": ["Induction training", "Specific hazard training", "Emergency and evacuation training", "Customer service training", "Supervisory skills training"], "answers": [0, 1, 2]}, {"id": "6be2349bea", "unit": "BSBCOR0113B", "element": 6, "pc": "6.2", "topic": "Training", "stem": "Under criterion 6.2, off-the-job training programs fall outside the monitoring required by this unit.", "feedback": "The criterion names both on-the-job and off-the-job training programs explicitly.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "4978b3db21", "unit": "BSBCOR0113B", "element": 6, "pc": "6.1", "topic": "Training", "stem": "A skills audit shows four technicians have never been trained on the new rack lifting equipment installed six months ago. Under criterion 6.1 this is:", "feedback": "This is precisely what regular monitoring of training records and skills audits is for. Identifying the gap is half the criterion; addressing it is the other half.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 6.1 of this unit."], "kind": s and inspection reports, health surveillance and environmental monitoring records, records of instruction and training, manufacturers' and suppliers' information including material safety data sheets and dangerous goods storage lists, hazardous substances registers, maintenance and testing reports, workers compensation and rehabilitation records, and first aid/medical post records.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 7.1 of this unit."], "kind": "ms", "options": ["Hazardous substances registers", "Maintenance and testing reports", "First aid/medical post records", "Payroll records", "Performance appraisal records"], "answers": [0, 1, 2]}, {"id": "f6d89d98a4", "unit": "BSBCOR0113B", "element": 7, "pc": "7.1", "topic": "Records", "stem": "The range statement lists complying with privacy and confidentiality requirements among the things OHS records may involve.", "feedback": "\"Complying with privacy and confidentiality requirements\" is the first entry under OHS records. The duty itself comes from the legislation; the range statement is where this unit points you at it.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "9458127ffe", "unit": "BSBCOR0113B", "element": 7, "pc": "7.2", "topic": "Records", "stem": "", "feedback": "This is Element 7 working as intended: individually trivial records, aggregated, locate a hazard nobody reported.", "hints": ["Each gap is marked separately — a wrong one does not cost you the others."], "kind": "cloze", "parts": [{"t": "Six months of first aid records for one floor show eleven minor hand injuries, all in the same store room. Used as "}, {"gap": {"type": "mc", "options": ["aggregate information", "an incident report", "a training record", "a compliance return"], "answers": [0], "accept": ["aggregate information"], "wild": false}}, {"t": ", this identifies a "}, {"gap": {"type": "mc", "options": ["hazard", "breach", "claim", "near miss"], "answers": [0], "accept": ["hazard"], "wild": false}}, {"t": " in the work area, which criterion 7.2 requires you to act on within your scope of "}, {"gap": {"type": "sa", "options": ["responsibilities", "responsibility", "responsibilit*"], "answers": [0, 1, 2], "accept": ["responsibilities", "responsibility", "responsibilit"], "wild": true}}, {"t": " and competencies."}]}]}, {"code": "BSBFLM0053B", "title": "Support operational plan", "questions": [{"id": "ab01e1127a", "unit": "BSBFLM0053B", "element": 1, "pc": "1.1", "topic": "Resources", "stem": "Criterion 1.1 requires details of resource requirements to be:", "feedback": "Three verbs, in order: collect, record, report. A requirement held in someone's head has not been recorded, and a recorded one nobody was told about has not been reported.", "hints": ["Count the verbs in the criterion.", "Re-read performance criterion 1.1 of this unit."], "kind": "mc", "options": ["Collected, recorded and reported to relevant personnel", "Collected, costed and approved by management", "Identified, prioritised and purchased", "Estimated, budgeted and reviewed annually"], "answer": 0}, {"id": "be330bba00", "unit": "BSBFLM0053B", "element": 1, "pc": "1.1", "topic": "Relevant personnel", "stem": "Which THREE does the range statement list as relevant personnel?", "feedback": "Relevant personnel may include managers, supervisors, other employees, colleagues and specialist resource managers, OHS committees and other people with specialist responsibilities, and unions/employee groups.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.1 of this unit."], "kind": "ms", "options": ["Supervisors", "Colleagues and specialist resource managers", "Unions/employee groups", "External auditors", "Customers"], "answers": [0, 1, 2]}, {"id": "f870008f6f", "unit": "BSBFLM0053B", "element": 1, "pc": "1.2", "topic": "Operational plan", "stem": "What does the range statement say an operational plan may include?", "feedback": "An operational plan turns the business plan into what a department will actually do this period. Criterion 1.2 requires your support of it to contribute to the organisation's performance and business plan.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.2 of this unit."], "kind": "mc", "options": ["Tactical plans developed by the department or section to detail product and service performance, and organisational plans", "The annual budget, the capital expenditure schedule and the purchasing thresholds that apply to each department", "The strategic plan and the risk register", "Job descriptions and individual performance plans"], "answer": 0}, {"id": "e32f8809f8", "unit": "BSBFLM0053B", "element": 1, "pc": "1.3", "topic": "KPIs", "stem": "The range statement defines key performance indicators as measures for monitoring or evaluating the efficiency or effectiveness of a system, which may be used to:", "feedback": "Accountability and improvement. A KPI used mainly to reward or punish individuals tends to stop measuring the system.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.3 of this unit."], "kind": "mc", "options": ["Demonstrate accountability and identify areas for improvement", "Set individual pay and bonuses", "Compare the organisation against its competitors", "Justify the resources requested in the operational plan"], "answer": 0}, {"id": "2dfbff3561", "unit": "BSBFLM0053B", "element": 1, "pc": "1.3", "topic": "KPIs", "stem": "Which is the better KPI for a network support team under criterion 1.3?", "feedback": "It measures effectiveness against a target the team can influence and that the customer actually cares about. Tickets : 0}, {"id": "565b4b9709", "unit": "BSBFLM0053B", "element": 1, "pc": "1.4", "topic": "Contingency", "stem": "Which TWO of these are contingency planning options named in the range statement?", "feedback": "Succession planning covers the loss of a person; rental or hire purchase covers being unable to buy outright. Both are named in the range statement.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.4 of this unit."], "kind": "ms", "options": ["Succession planning", "Rental or hire purchase of required equipment", "Increasing the number of KPIs monitored", "Holding more frequent team meetings"], "answers": [0, 1]}, {"id": "8c65ce56a4", "unit": "BSBFLM0053B", "element": 1, "pc": "1.4", "topic": "Contingency", "stem": "The one technician who can configure the core switches is due to leave. Which contingency option from the range statement addresses this directly?", "feedback": "Succession planning is the named response to key-person risk. In a small IT team it is usually the largest single point of failure in the operational plan.", "hints": ["The resource at risk here is a person, not equipment or money.", "Re-read performance criterion 1.4 of this unit."], "kind": "mc", "options": ["Succession planning", "Diversification of outcomes", "Recycling and re-use", "Seeking further funding"], "answer": 0}, {"id": "2cf5fc10a6", "unit": "BSBFLM0053B", "element": 1, "pc": "1.5", "topic": "Proposals", "stem": "Criterion 1.5 requires the development and presentation of proposals for resource requirements to be:", "feedback": "The verb across this whole unit is \"support\". At this level you contribute to the plan and assist with proposals; you do not own them.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.5 of this unit."], "kind": "mc", "options": ["Supported as required", "Led by the supervisor", "Approved before presentation", "Documented in the operational plan"], "answer": 0}, {"id": "32d41acc30", "unit": "BSBFLM0053B", "element": 1, "pc": "1.5", "topic": "Proposals", "stem": "At this level you are expected to write and approve the resource proposal yourself.", "feedback": "Criterion 1.5 requires the development and presentation of proposals to be SUPPORTED as required. The unit is called Support operational plan for a reason.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "9492feeef4", "unit": "BSBFLM0053B", "element": 1, "pc": "1.1", "topic": "Resources", "stem": "Which of these does the range statement list under resource requirements?", "feedback": "Resource requirements may include supply of resources, stock requirements and requisitions, and purchasing or ordering of goods.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.1 of this unit."], "kind": "mc", "options": ["Stock requirements and requisitions", "Training needs analysis", "Staff rosters", "Key performance indicators agreed for the team"], "answer": 0}, {"id": "c19e221e88", "unit": "BSBFLM0053B", "element": 1, "pc": "1.1", "topic": "Resources", "stem": "", "feedback": "Collected, recorded, reported. Three separate acts, all assessable.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Criterion 1.1 requires details of resource requirements to be "}, {"gap": 0}, {"t": ", "}, {"gap": 1}, {"t": " and "}, {"gap": 2}, {"t": " to relevant personnel."}], "pool": ["collected", "recorded", "reported", "approved", "costed", "purchased", "forecast"], "answer": [0, 1, 2]}, {"id": "5a53254593", "unit": "BSBFLM0053B", "element": 1, "pc": "1.4", "topic": "Contingency", "stem": "Match
