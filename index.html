riterion 4.1 requires restore procedures to be determined and:", "feedback": "Tested. An untested restore procedure is a belief, not a capability — and the day you find out is the worst possible day.", "hints": ["Which verb turns an assumption into evidence?", "Re-read performance criterion 4.1 of this unit."], "kind": "mc", "options": ["Tested, according to organisational guidelines", "Documented, according to organisational guidelines", "Approved, according to organisational guidelines", "Scheduled, according to organisational guidelines"], "answer": 0}, {"id": "eb1e28df70", "unit": "ITIDAT1403B", "element": 4, "pc": "4.2", "topic": "Supervision", "stem": "Criterion 4.2 requires a restore to be completed:", "feedback": "Under supervision — this is a basic administration unit, and a restore can overwrite live data. The supervision is the safeguard.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 4.2 of this unit."], "kind": "mc", "options": ["Under the supervision of an appropriate person", "By an appropriate person", "After approval by an appropriate person", "In the presence of the data owner"], "answer": 0}, {"id": "e3c3a51c7a", "unit": "ITIDAT1403B", "element": 4, "pc": "4.3", "topic": "Recording", "stem": "Criterion 4.3 requires a completed restore to be recorded according to:", "feedback": "Organisational guidelines. The restore log is separate from the backup log required by criterion 3.4.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 4.3 of this unit."], "kind": "mc", "options": ["Organisational guidelines", "The backup schedule", "The disaster recovery plan", "Legislative requirements"], "answer": 0}, {"id": "26d1258c82", "unit": "ITIDAT1403B", "element": 4, "pc": "4.1", "topic": "Restore procedures", "stem": "Under criterion 4.1 it is enough to determine the restore procedure and document it.", "feedback": "The criterion requires the procedure to be determined AND tested. Documentation alone proves nothing about whether the restore works.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "a8b4bd2ae1", "unit": "ITIDAT1403B", "element": 4, "pc": "4.1", "topic": "Restore procedures", "stem": "What is the strongest evidence that a restore procedure works?", "feedback": "A successful backup proves data was written. Only a restore proves it can be read back and used, which is why criterion 4.1 says \"test\".", "hints": ["Three of these are about the backup. Only one is about getting the data back.", "Re-read performance criterion 4.1 of this unit."], "kind": "mc", "options": ["A test restore that produced usable data, with the result recorded", "A backup job that reported success every night for a month", "A documented procedure signed off by the supervisor", "A vendor statement that the backup software is reliable"], "answer": 0}, {"id": "d800653d27", "unit": "ITIDAT1403B", "element": 4, "pc": "4.2", "topic": "Element 4", "stem": "", "feedback": "Determine and test, supervise, record — criteria 4.1 to 4.3.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Element 4 has three criteria: "}, {"gap": 0}, {"t": " and test restore procedures, complete a restore under the "}, {"gap": 1}, {"t": " of an appropriate person, and "}, {"gap": 2}, {"t": " the completed restore according to organisational guidelines."}], "pool": ["determine", "supervision", "record", "approve", "presence", "schedule", "verify"], "answer": [0, 1, 2]}, {"id": "25c34f4558", "unit": "ITIDAT1403B", "element": 4, "pc": "4.1", "topic": "Restore", "stem": "", "feedback": "Tested, supervision, recorded — the three verbs of Element 4.", "hints": ["Each rough.", "Re-read performance criterion 5.1 of this unit."], "kind": "mc", "options": ["Clearance guidelines set by management", "The client's stated requirements", "The organisation's ICT policy", "Legislative requirements for data protection"], "answer": 0}, {"id": "2b99b8bda5", "unit": "ITIDAT1403B", "element": 5, "pc": "5.2", "topic": "Access register", "stem": "Criterion 5.2 requires a security access register to record:", "feedback": "The register maps people and groups to resources. That mapping is what lets you answer \"who can reach this share\" without reading every permission on the system.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 5.2 of this unit."], "kind": "mc", "options": ["Which client or groups have access to which resources", "Which clients have had their access changed and when", "Which resources are classified as sensitive", "Which groups exist and who belongs to them"], "answer": 0}, {"id": "3e00f86245", "unit": "ITIDAT1403B", "element": 5, "pc": "5.3", "topic": "File system controls", "stem": "Criterion 5.3 requires you to identify the security controls on the file system provided by:", "feedback": "The operating system. This criterion is about knowing what the platform itself gives you before reaching for anything else.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 5.3 of this unit."], "kind": "mc", "options": ["The operating system", "The network operating system", "The organisation's security policy", "The backup software"], "answer": 0}, {"id": "8fc5202a61", "unit": "ITIDAT1403B", "element": 5, "pc": "5.4", "topic": "Access control", "stem": "Criterion 5.4 requires effective access control to be applied on:", "feedback": "Files and directories — the level at which the operating system controls identified in criterion 5.3 actually operate.", "hints": ["Think about w ool is chosen for the policy, not the other way round.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.2 of this unit."], "kind": "mc", "options": ["Those built into the network operating system, and third-party tools", "Those supplied by the vendor, and open-source alternatives", "Those built into the NOS, and those written in-house", "Those approved by the organisation, and those recommended by the vendor"], "answer": 0}, {"id": "99ae24afa7", "unit": "ITINET1733B", "element": 1, "pc": "1.3", "topic": "Settings", "stem": "Criterion 1.3 requires settings and parameters to be determined and:", "feedback": "Determined AND documented. Undocumented settings are the reason nobody can say why a system is configured the way it is three years later.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.3 of this unit."], "kind": "mc", "options": ["Documented", "Tested", "Approved", "Applied"], "answer": 0}, {"id": "22844c1180", "unit": "ITINET1733B", "element": 1, "pc": "1.4", "topic": "Weaknesses", "stem": "Criterion 1.4 requires recommendations to be made to the appropriate person about:", "feedback": "The criterion is specifically about the TOOLS falling short of what the policy needs. It is an honest admission that the toolset may not be able to enforce everything the policy asks for.", "hints": ["The weakness is not in the policy and not in the network.", "Re-read performance criterion 1.4 of this unit."], "kind": "mc", "options": ["Ways of overcoming weaknesses in administration tools", "Weaknesses in organisational policy", "Gaps between policy and current configuration", "Tools that should be purchased"], "answer": 0}, {"id": "b6c9fcec5b", "unit": "ITINET1733B", "element": 1, "pc": "1.1", "topic": "Policies", "stem": "Which THREE does the range statement list as organisational policies?", "feedback": e records tell you what was bought, not what is actually running.", "hints": ["One of these tells you what should be there; the criterion asks what is.", "Re-read performance criterion 2.1 of this unit."], "kind": "mc", "options": ["Audits of hardware and software", "Consultation with users", "Review of purchase records", "Vendor asset reports"], "answer": 0}, {"id": "a04e193be7", "unit": "ITINET1733B", "element": 2, "pc": "2.2", "topic": "System interaction", "stem": "Criterion 2.2 requires system interaction to be mapped by identifying two things. Which pair?", "feedback": "What data, and how often. Frequency is what turns a list of dependencies into a design — rarely-used data can live somewhere slower.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.2 of this unit."], "kind": "mc", "options": ["What data particular users require, and how often they access it", "Which systems connect to which, and over what protocols", "Which users have access, and at what clearance level", "What data is stored, and where it is stored"], "answer": 0}, {"id": "2c3f0f587c", "unit": "ITINET1733B", "element": 2, "pc": "2.3", "topic": "Upgrades", "stem": "Criterion 2.3 requires existing applications to be examined and:", "feedback": "Examine, then plan what has to change. This is the criterion that stops a new NOS being rolled out into applications that cannot run on it.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.3 of this unit."], "kind": "mc", "options": ["Required upgrades or reconfigurations to the new system or applications to be planned", "Incompatible applications to be identified and replaced before the new system goes live", "Application owners to be consulted", "Application licences to be verified"], "answer": 0}, {"id": "3833537cc4", "unit": "ITINET1733B", "element": 2, "pc": "2.4", "topic": "Testing", "stem": "Criterion 2.4 requires the reconfiguration to be tested for:", "feedback": "The interface is the point. Element 2 is about the new configuration meeting the old one without breaking it.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.4 of this unit."], "kind": "mc", "options": ["Successful interface with the existing system", "Compliance with the security policy", "Acceptable performance under load", "Correct operation of each application"], "answer": 0}, {"id": "53fac59752", "unit": "ITINET1733B", "element": 2, "pc": "2.1", "topic": "Audits", "stem": "Criterion 2.1 requires both hardware and software to be audited.", "feedback": "The criterion says \"through audits of hardware and software\". A hardware inventory on its own leaves you blind to what is running on it.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "27542134e9", "unit": "ITINET1733B", "element": 2, "pc": "2.2", "topic": "Element 2", "stem": "Match each activity to the criterion in Element 2 that requires it.", "feedback": "Audit, map, plan, test. Element 2 is the bridge between what exists and what is being built.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 2.2."], "kind": "match", "left": ["Walking the racks and recording what is installed", "Finding out that payroll reads the HR database nightly", "Working out which applications need reconfiguring for the new NOS", "Confirming the reconfigured system still talks to the old one"], "right": ["Criterion 2.1 — identify and document through audits", "Criterion 2.2 — map system interaction", "Criterion 2.3 — plan required upgrades", "Criterion 2.4 — test reconfiguration for successful interface"], "answer": [0, 1, 2, 3]}, {"id": "b040a7f4c0", "unit": "ITINET1733B", "element": 2, "pc": "2.3", "topic": "Element 2", "stem": "", "feedback": "Audit, map, plan, test — criteria 2.1 to 2.4 in order.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "Interfacing with an existing system: "}, {"gap": 0}, {"t": " the hardware and software, "}, {"gap": 1}, {"t": " which users need what data and how often, "}, {"gap": 2}, {"t": " the upgrades and reconfigurations required, and "}, {"gap": 3}, {"t": " that the interface works."}], "pool": ["audit", "map", "plan", "test", "replace", "document", "approve"], "answer": [0, 1, 2, 3]}, {"id": "0361448aa5", "unit": "ITINET1733B", "element": 3, "pc": "3.1", "topic": "File structure", "stem": "Criterion 3.1 requires the network requirements of the user to be evaluated and:", "feedback": "File and folder structure here; criterion 4.1 uses almost identical wording but produces a set of SERVICES instead. The two are easy to confuse in an exam.", "hints": ["Another criterion in this unit starts the same way but ends differently.", "Re-read performance criterion 3.1 of this unit."], "kind": "mc", "options": ["An appropriate file and folder structure to be designed", "An appropriate set of services to be designed", "The existing structure to be documented", "Storage capacity to be calculated"], "answer": 0}, {"id": "e1e204d87f", "unit": "ITINET1733B", "element": 3, "pc": "3.2", "topic": "File structure", "stem": "Criterion 3.2 requires the designed structure to be created using:", "feedback": "The tools identified back in criterion 1.2. Building a large structure by hand is where inconsistency creeps in.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.2 of this unit."], "kind": "mc", "options": ["Appropriate administration and system tools", "The network operating system's default templates", "Scripts written for the purpose", "The file manager, working folder by folder"], "answer": 0}, {"id": "8d9cbdcbeb", "unit": "ITINET1733B", "element": 3, "pc": "3.3", "topic": "File security", "stem": "Criterion 3.3 requires three things about the file system to be set to meet user requirements. Which three?", "feedback": "Security, access and sharing. Sharing is listed separately because a folder can be permitted at the file system level and still not be reachable across the network.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.3 of this unit."], "kind": "mc", "options": ["Security, access and sharing", "Security, ownership and quotas", "Access, sharing and encryption", "Security, access and auditing"], "answer": 0}, {"id": "8e729b35b0", "unit": "ITINET1733B", "element": 3, "pc": "3.4", "topic": "Virus protection", "stem": "Criterion 3.4 requires virus protection requirements for the network to be identified and implemented in line with:", "feedback": "Organisational procedures. Note the criterion requires both identification and implementation.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.4 of this unit."], "kind": "mc", "options": ["Organisational procedures", "Vendor recommendations", "The security policy", "Industry best practice"], "answer": 0}, {"id": "d300de4d1b", "unit": "ITINET1733B", "element": 3, "pc": "3.4", "topic": "Virus protection", "stem": "The underpinning knowledge for this unit stresses which point about anti-virus software?", "feedback": "The underpinning knowledge names \"the importance of undertaking regular and timely updates, such as that of the virus data file or a newer version of the virus search engine\". Out-of-date protection reads as protection on a report and is not.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.4 of this unit."], "kind": "mc", "options": ["The importance of regular and timely updates to the virus data file and the search engine", "That it must be installed on servers as well as on every workstation on the network segment", "That it should be supplied by the same vendor as the NOS", "That it must not be disabled by users"], "answer": 0}, {"id": "c94bcb12c9", "unit": "ITINET1733B", "element": 3, "pc": "3.5", "topic": "Testing", "stem": "Criterion 3.5 requires the file system to be tested to ensure that:", "feedback": "Tested against the user GROUPS, not just from an administrator account. An admin can always get in, which is exactly why that test proves nothing.", "hints": ["Whose access are you testing?", "Re-read performance criterion 3.5 of this unit."], "kind": "mc", "options": ["Appropriate access is available to the user groups", "Performance remains acceptable under a realistic load", "The structure matches the design", "Backups can read every folder"], "answer": 0}, {"id": "add8350fc7", "unit": "ITINET1733B", "element": 3, "pc": "3.6", "topic": "Documentation", "stem": "Criterion 3.6 requires the created file system to be documented in accordance with:", "feedback": "Organisational standards. Element 3 ends with the record, the same way most elements in this cluster do.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.6 of this unit."], "kind": "mc", "options": ["Organisational standards", "The design specification", "The network documentation conventions", "ISO and IEC standards"], "answer": 0}, {"id": "0300b1a0d9", "unit": "ITINET1733B", "element": 3, "pc": "3.1", "topic": "File system", "stem": "Which THREE does the range statement say a file system may involve?", "feedback": "The range statement lists multiple or single servers, multiple or single logical disks and complex directory, and folder structures.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.1 of this unit."], "kind": "ms", "options": ["Multiple or single servers", "Multiple or single logical disks", "Folder structures", "Cloud storage buckets", "Tape libraries"], "answers": [0, 1, 2]}, {"id": "dbbbb05662", "unit": "ITINET1733B", "element": 3, "pc": "3.3", "topic": "Element 3", "stem": "", "feedback": "Evaluate, create, secure, protect, test, document — criteria 3.1 to 3.6.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Element 3 in six steps: "}, {"gap": 0}, {"t": " user requirements and design a structure, "}, {"gap": 1}, {"t": " it with administration tools, set "}, {"gap": 2}, {"t": ", access and sharing, implement "}, {"gap": 3}, {"t": " protection, "}, {"gap": 4}, {"t": " that user groups can get in, and document it."}], "pool": ["evaluate", "create", "security", "virus", "test", "approve", "audit", "sharing", "backup"], "answer": [0, 1, 2, 3, 4]}, {"id": "3a3f03f413", "unit": "ITINET1733B", "element": 3, "pc": "3.5", "topic": "File system", "stem": "", "feedback": "Test as the user group, not as yourself. This is the most common way a file system passes testing and fails on Monday morning.", "hints": ["Each gap is marked separately — a wrong one does not cost you the others."], "kind": "cloze", "parts": [{"t": "A new folder structure is built and permissions applied. Criterion 3.5 requires it to be tested to ensure appropriate access is available to the "}, {"gap": {"type": "mc", "options": ["user groups", "administrators", "backup service", "network itself"], "answers": [0], "accept": ["user groups"], "wild": false}}, {"t": ". Testing from an administrator account proves "}, {"gap": {"type": "mc", "options": ["nothing, because administrators bypass most restrictions", "that the structure is correct", "that permissions inherit properly", "that sharing is enabled"], "answers": [0], "accept": ["nothing, because administrators bypass most restrictions"], "wild": false}}, {"t": ". The structure is then documented in accordance with "}, {"gap": {"type": "sa", "options": ["organisational"], "answers": [0], "accept": ["organisational"], "wild": false}}, {"t": " standards."}]}, {"id": "c0402c8ebf", "unit": "ITINET1733B", "element": 4, "pc": "4.1", "topic": "Service design", "stem": "Criterion 4.1 requires the network requirements of the user to be evaluated and:", "feedback": "Services here; criterion 3.1 designs the file and folder structure from the same evaluation. Same first half, different deliverable.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 4.1 of this unit."], "kind": "mc", "options": ["An appropriate set of services to be designed", "An appropriate file and folder structure to be designed", "The required user accounts to be created", "Service levels to be agreed with the user"], "answer": 0}, {"id": "d18582fe10", "unit": "ITINET1733B", "element": 4, "pc": "4.2", "topic": "Implementation", "stem": "Criterion 4.2 requires the required services to be implemented by using:", "feedback": "The same phrase as criterion 3.2. This unit returns to the tools identified in 1.2 over and over.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 4.2 of this unit."], "kind": "mc", "options": ["The appropriate administration and system tools", "The vendor's installation wizards", "Scripts developed for the purpose", "The default settings supplied with the network operating system"], "answer": 0}, {"id": "f11408d158", "unit": "ITINET1733B", "element": 4, "pc": "4.3", "topic": "Users and groups", "stem": "Criterion 4.3 requires users and groups to be created to facilitate user security and network access, in accordance with:", "feedback": "User authorisation — somebody with the standing to authorise it has asked for it. Creating access because it seemed sensible is the failure this phrase guards against.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 4.3 of this unit."], "kind": "mc", "options": ["User authorisation", "The security policy", "The organisation's naming standards", "Clearance guidelines set by management"], "answer": 0}, {"id": "71c60370f9", "unit": "ITINET1733B", "element": 4, "pc": "4.4", "topic": "Testing", "stem": "Criterion 4.4 requires successful access by users to be tested and:", "feedback": "Tested AND recorded. The record is what you produce when somebody asks six months later whether access was ever verified.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 4.4 of this unit."], "kind": "mc", "options": ["The outcomes to be recorded", "Any failures to be escalated", "The test to be repeated after any change", "The user to confirm satisfaction"], "answer": 0}, {"id": "127d0e2ddc", "unit": "ITINET1733B", "element": 4, "pc": "4.3", "topic": "Users and groups", "stem": "Criterion 4.3 covers the creation of groups as well as individual user accounts.", "feedback": "It reads \"create users and groups as required\". Groups are what make access manageable once there are more than a handful of people.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "c358a8c005", "unit": "ITINET1733B", "element": 4, "pc": "4.1", "topic": "Similar criteria", "stem": "Several criteria in this unit begin the same way. Match each to what it produces.", "feedback": "Elements 3 and 4 run in parallel: the same evaluation, the same tools, two different deliverables. Knowing which is which is worth a mark.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 4.1."], "kind": "match", "left": ["Criterion 3.1 — evaluate the network requirements of the user", "Criterion 4.1 — evaluate the network requirements of the user", "Criterion 3.2 — create using administration and system tools", "Criterion 4.2 — implement using administration and system tools"], "right": ["A file and folder structure design", "A set of services to be provided", "The file and folder structure itself", "The services themselves"], "answer": [0, 1, 2, 3]}, {"id": "0081b6f135", "unit": "ITINET1733B", "element": 4, "pc": "4.2", "topic": "Element 4", "stem": "", "feedback": "Evaluate, implement, create, test — criteria 4.1 to 4.4.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "Managing user services: "}, {"gap": 0}, {"t": " the user requirements and design the services, "}, {"gap": 1}, {"t": " them with the administration tools, create users and "}, {"gap": 2}, {"t": " in line with authorisation, and "}, {"gap": 3}, {"t": " access and record the outcome."}], "pool": ["evaluate", "implement", "groups", "test", "document", "approve", "monitor"], "answer": [0, 1, 2, 3]}, {"id": "19addb426e", "unit": "ITINET1733B", "element": 5, "pc": "5.1", "topic": "Default settings", "stem": "Criterion 5.1 requires default user settings to be modified to ensure that they:", "feedback": "Defaults are set by the vendor for the general case, not for your security policy. This criterion exists because nobody ever gets round to changing them.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 5.1 of this unit."], "kind": "mc", "options": ["Match security policies", "Meet the user's stated preferences", "Are consistent across the organisation", "Follow the vendor's recommended baseline"], "answer": 0}, {"id": "3c67c83b62", "unit": "ITINET1733B", "element": 5, "pc": "5.2", "topic": "Non-compliance", "stem": "Criterion 5.2 requires EXISTING user settings that are non-compliant to be modified according to:", "feedback": "Criterion 5.1 covers new defaults and 5.2 covers accounts already in place, both against the same policies.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 5.2 of this unit."], "kind": "mc", "options": ["Security and access policies", "The user's clearance level", "Organisational guidelines", "The original authorisation"], "answer": 0}, {"id": "51e15072d2", "unit": "ITINET1733B", "element": 5, "pc": "5.3", "topic": "Legal notices", "stem": "Criterion 5.3 requires you to check that appropriate legal notices are displayed:", "feedback": "At log on. A notice presented at the moment of access is what makes it hard for anybody to claim they had not seen it.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 5.3 of this unit."], "kind": "mc", "options": ["At log on", "In the acceptable use policy", "On the organisation's intranet", "In the user documentation"], "answer": 0}, {"id": "c8ae01ea4d", "unit": "ITINET1733B", "element": 5, "pc": "5.4", "topic": "Password strength", "stem": "Criterion 5.4 requires appropriate utilities to be used to check:", "feedback": "Strength, checked with a utility. A policy that demands strong passwords without checking produces passwords that technically comply and are still guessable.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 5.4 of this unit."], "kind": "mc", "options": ["The strength of passwords", "That passwords are changed regularly", "That passwords are not reused across accounts", "That passwords meet the minimum length"], "answer": 0}, {"id": "3de227e572", "unit": "ITINET1733B", "element": 5, "pc": "5.5", "topic": "Leavers", "stem": "Criterion 5.5 requires procedures to be reviewed and action taken so that users who leave the organisation or area have their accounts:", "feedback": "Disabled or deleted. Note \"or area\" — an internal move leaves stale access behind just as a resignation does.", "hints": ["The criterion covers more than people who resign.", "Re-read performance criterion 5.5 of this unit."], "kind": "mc", "options": ["Disabled or deleted", "Disabled and archived", "Transferred to their replacement", "Locked pending management approval"], "answer": 0}, {"id": "e03ef4b5a5", "unit": "ITINET1733B", "element": 5, "pc": "5.6", "topic": "Security gaps", "stem": "Criterion 5.6 requires information services to be used to identify:", "feedback": "The criterion is about staying current with publicly known weaknesses, and then securing them with appropriate hardware and software.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 5.6 of this unit."], "kind": "mc", "options": ["Well-known and up-to-date security gaps", "Vendor patches awaiting deployment", "Unauthorised changes to user accounts", "Systems that have fallen out of support"], "answer": 0}, {"id": "93755c7859", "unit": "ITINET1733B", "element": 5, "pc": "5.6", "topic": "Information services", "stem": "Which THREE does the range statement list under information services?", "feedback": "The range statement lists internet, chat rooms, forums and newsgroups.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 5.6 of this unit."], "kind": "ms", "options": ["Internet", "Forums", "Newsgroups", "Vendor support contracts", "Trade publications"], "answers": [0, 1, 2]}, {"id": "f68a2bf23b", "unit": "ITINET1733B", "element": 5, "pc": "5.5", "topic": "Leavers", "stem": "Criterion 5.5 applies only to people who leave the organisation altogether.", "feedback": "It says \"leave the organisation OR AREA\". Someone who moves department and keeps their old access is the privilege-creep problem this criterion is meant to stop.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "27dab2e4ac", "unit": "ITINET1733B", "element": 5, "pc": "5.4", "topic": "Element 5", "stem": "", "feedback": "Default, non-compliant, log on, strength, leavers — criteria 5.1 to 5.5.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Monitoring user accounts means modifying "}, {"gap": 0}, {"t": " settings to match security policy, correcting "}, {"gap": 1}, {"t": " existing settings, checking the legal notice at "}, {"gap": 2}, {"t": ", testing password "}, {"gap": 3}, {"t": ", disabling accounts of "}, {"gap": 4}, {"t": ", and closing known security gaps."}], "pool": ["default", "non-compliant", "log on", "strength", "leavers", "user", "compliant", "startup", "length"], "answer": [0, 1, 2, 3, 4]}, {"id": "7f55cbdb7a", "unit": "ITINET1733B", "element": 5, "pc": "5.5", "topic": "Leavers", "stem": "A technician transfers from the Kingston office to Montego Bay and keeps both sets of file permissions. Under criterion 5.5 this is:", "feedback": "The wording \"leave the organisation or area\" is doing real work here. Internal moves are the commonest source of accumulated access.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 5.5 of this unit."], "kind": "mc", "options": ["A failure, because the criterion covers users who leave an area as well as the organisation", "Acceptable, because the person is still employed", "Acceptable, because both offices belong to the same organisation and the same security domain", "A matter for criterion 5.2 rather than 5.5"], "answer": 0}, {"id": "74998bc076", "unit": "ITINET1733B", "element": 6, "pc": "6.1", "topic": "Virus scan", "stem": "Criterion 6.1 requires the network to be scanned and, if required, cleaned of viruses:", "feedback": "Before. Backing up an infected system produces backups that reinfect you on restore — which is how an incident becomes a recurring one.", "hints": ["Think about what you would be preserving if you scanned afterwards.", "Re-read performance criterion 6.1 of this unit."], "kind": "mc", "options": ["Before back-up", "After back-up, so the media is checked as well", "Whenever the anti-virus policy schedules a scan", "Only when an infection is suspected"], "answer": 0}, {"id": "a1bbd20f0b", "unit": "ITINET1733B", "element": 6, "pc": "6.2", "topic": "Security review", "stem": "Criterion 6.2 requires security requirements to be reviewed for two things. Which pair?", "feedback": "Users and data. Who reaches it, and what it is.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 6.2 of this unit."], "kind": "mc", "options": ["Users, and data to be stored on the network", "Users, and the applications they run", "Data, and the systems that process it", "Users, and their clearance levels"], "answer": 0}, {"id": "223ab15259", "unit": "ITINET1733B", "element": 6, "pc": "6.3", "topic": "Risk", "stem": "Criterion 6.3 requires risks to which data is exposed to be determined, and appropriate:", "feedback": "Prevention AND recovery. Preventing every loss is not possible, which is why the criterion pairs the two.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 6.3 of this unit."], "kind": "mc", "options": ["Prevention and recovery processes to be provided", "Controls to be implemented and then tested regularly", "Insurance cover to be arranged", "Access restrictions to be applied"], "answer": 0}, {"id": "8a85fdd0c8", "unit": "ITINET1733B", "element": 6, "pc": "6.4", "topic": "Backup capability", "stem": "Criterion 6.4 requires systems to be implemented that provide two capabilities in the event of a disaster. Which pair?", "feedback": "Back-up and service restoration. Having the data is not the same as having the service back, and criterion 6.4 asks for both.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 6.4 of this unit."], "kind": "mc", "options": ["Back-up and service restoration", "Back-up and off-site storage", "Service restoration and failover", "Back-up and data replication"], "answer": 0}, {"id": "622a736b27", "unit": "ITINET1733B", "element": 6, "pc": "6.5", "topic": "Disaster recovery", "stem": "Criterion 6.5 requires the disaster recovery procedures to be:", "feedback": "Documented and disseminated. ITINET1483B criterion 2.2 makes the same point about the plan — a recovery procedure nobody has read will not be followed under pressure.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 6.5 of this unit."], "kind": "mc", "options": ["Documented and disseminated", "Documented and tested", "Tested and approved", "Documented and reviewed annually"], "answer": 0}, {"id": "0187157b76", "unit": "ITINET1733B", "element": 6, "pc": "6.4", "topic": "Back up", "stem": "The range statement describes back up as a range between two ends. Which TWO are those ends?", "feedback": "The range statement describes back up as ranging from \"simple, single tape unit back-up to more comprehensive and complex back-up facilities across the network\".", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 6.4 of this unit."], "kind": "ms", "options": ["A simple, single tape unit back-up", "More comprehensive and complex back-up facilities across the network", "Continuous replication to a second data centre", "Snapshots taken by the storage array"], "answers": [0, 1]}, {"id": "6a90688255", "unit": "ITINET1733B", "element": 6, "pc": "6.1", "topic": "Virus scan", "stem": "Criterion 6.1 requires the network to be cleaned of viruses in every case before a back-up runs.", "feedback": "It says \"scan and, IF REQUIRED, clean\". The scan is unconditional; the cleaning depends on what the scan finds.", "hints": ["Read the conditional clause in the middle of the criterion."], "kind": "tf", "answer": false}, {"id": "ab880f55f0", "unit": "ITINET1733B", "element": 6, "pc": "6.3", "topic": "Element 6", "stem": "", "feedback": "Scan, review, determine, implement, disseminate — criteria 6.1 to 6.5.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "Providing backup security: "}, {"gap": 0}, {"t": " the network for viruses before backing up, "}, {"gap": 1}, {"t": " the security requirements for users and data, "}, {"gap": 2}, {"t": " the risks the data is exposed to, implement back-up and service "}, {"gap": 3}, {"t": ", and document and "}, {"gap": 4}, {"t": " the recovery procedures."}], "pool": ["scan", "review", "determine", "restoration", "disseminate", "encrypt", "approve", "archive"], "answer": [0, 1, 2, 3, 4]}, {"id": "2a903bd244", "unit": "ITINET1733B", "element": 6, "pc": "6.1", "topic": "Backup security", "stem": "", "feedback": "Scan first so the backup is clean; document and disseminate so the procedure exists where people can find it.", "hints": ["Each gap is marked separately — a wrong one does not cost you the others."], "kind": "cloze", "parts": [{"t": "Before a network back-up runs, criterion 6.1 requires the network to be "}, {"gap": {"type": "mc", "options": ["scanned and, if required, cleaned", "cleaned in every case", "taken offline", "checked for free space"], "answers": [0], "accept": ["scanned and, if required, cleaned"], "wild": false}}, {"t": ". Skipping this risks "}, {"gap": {"type": "mc", "options": ["preserving the infection in the backup", "losing the backup window", "corrupting the media", "overwriting the previous backup"], "answers": [0], "accept": ["preserving the infection in the backup"], "wild": false}}, {"t": ". Criterion 6.5 then requires the disaster recovery procedures to be documented and "}, {"gap": {"type": "sa", "options": ["disseminated"], "answers": [0], "accept": ["disseminated"], "wild": false}}, {"t": "."}]}]}, {"code": "ITINET0823B", "title": "Create scripts for networking", "questions": [{"id": "57a7577db3", "unit": "ITINET0823B", "element": 1, "pc": "1.1", "topic": "Requirements", "stem": "Criterion 1.1 requires you to consult with the client and key stakeholders in order to identify:", "feedback": "The problem first, then what the script must do about it. Choosing a language before understanding the problem is criterion 2.1 done out of order.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.1 of this unit."], "kind": "mc", "options": ["The problem and the associated script requirements", "The scripting language and the target platform", "The problem and the budget available", "The requirements and the delivery date"], "answer": 0}, {"id": "4ac13786e1", "unit": "ITINET0823B", "element": 1, "pc": "1.1", "topic": "Stakeholders", "stem": "Which THREE does the range statement list as stakeholders?", "feedback": "The range statement lists development team, IT manager or representative, network engineer, project team, systems administrator and user.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.1 of this unit."], "kind": "ms", "options": ["Development team", "Network engineer", "Systems administrator", "External auditor", "Software vendor"], "answers": [0, 1, 2]}, {"id": "6b33a24368", "unit": "ITINET0823B", "element": 1, "pc": "1.2", "topic": "Development cycle", "stem": "Criterion 1.2 requires an abbreviated software development cycle to be employed. Why abbreviated?", "feedback": "Abbreviated, not abandoned. The evidence guide still expects the script to be designed, documented, constructed and tested.", "hints": ["Abbreviated means shortened, not skipped.", "Re-read performance criterion 1.2 of this unit."], "kind": "mc", "options": ["Because a script is a small, single-purpose program and does not warrant the full cycle", "Because scripts are written under time pressure", "Because scripts are not maintained after delivery, so the later stages of the cycle serve no purpose", "Because scripts do not require testing"], "answer": 0}, {"id": "0afffbc6e6", "unit": "ITINET0823B", "element": 1, "pc": "1.3", "topic": "Algorithm", "stem": "Criterion 1.3 requires an algorithm to be developed that does two things. Which pair?", "feedback": "Solving the problem and meeting the requirements are not automatically the same thing, which is why the criterion names both.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.3 of this unit."], "kind": "mc", "options": ["Solves the problem, and meets client requirements", "Solves the problem, and runs efficiently", "Meets client requirements, and is easy to maintain", "Solves the problem, and handles errors"], "answer": 0}, {"id": "8e0002d1a2", "unit": "ITINET0823B", "element": 1, "pc": "1.4", "topic": "Edge cases", "stem": "Criterion 1.4 requires the algorithm to take account of:", "feedback": "Expected possible situations — the cases you can reasonably foresee, including the empty file, the missing argument and the device that does not answer.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.4 of this unit."], "kind": "mc", "options": ["Expected possible situations", "Every possible input", "The most likely situation", "Situations described by the client"], "answer": 0}, {"id": "3691eb3402", "unit": "ITINET0823B", "element": 1, "pc": "1.5", "topic": "Termination", "stem": "Criterion 1.5 requires the algorithm to be guaranteed to:", "feedback": "An algorithm that can loop forever is not an algorithm. In a script that runs unattended on a schedule, a loop that never ends is a production incident.", "hints": ["It is the single most basic property an algorithm must have.", "Re-read performance criterion 1.5 of this unit."], "kind": "mc", "options": ["End", "Produce output", "Handle errors", "Run within a time limit"], "answer": 0}, {"id": "6fca226a04", "unit": "ITINET0823B", "element": 1, "pc": "1.6", "topic": "Constructs", "stem": "Criterion 1.6 names four things to use. Which THREE of these are among them?", "feedback": "Criterion 1.6 names structure, sequence, selection and iteration. The underpinning knowledge repeats them as the structured control constructs.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.6 of this unit."], "kind": "ms", "options": ["Sequence", "Selection", "Iteration", "Recursion", "Concurrency"], "answers": [0, 1, 2]}, {"id": "2761c92968", "unit": "ITINET0823B", "element": 1, "pc": "1.6", "topic": "Constructs", "stem": "Match each control construct to what it does.", "feedback": "Sequence, selection and iteration are the three classic structured constructs; criterion 1.6 adds structure itself.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 1.6."], "kind": "match", "left": ["Sequence", "Selection", "Iteration", "Structure"], "right": ["One instruction after another, in order", "A choice between paths, depending on a condition", "Repeating a block while a condition holds", "The overall shape that organises the other three"], "answer": [0, 1, 2, 3]}, {"id": "eaed884c22", "unit": "ITINET0823B", "element": 1, "pc": "1.3", "topic": "Algorithm", "stem": "Which THREE does the range statement list as ways of expressing an algorithm?", "feedback": "The range statement lists flow chart, pseudocode and structured English. None of them is a programming language — which is the point.", "hints": ["Two of these describe data or objects rather than a procedure.", "Re-read performance criterion 1.3 of this unit."], "kind": "ms", "options": ["Flow chart", "Pseudocode", "Structured English", "UML class diagram", "Entity relationship diagram"], "answers": [0, 1, 2]}, {"id": "49362a5824", "unit": "ITINET0823B", "element": 1, "pc": "1.3", "topic": "Algorithm", "stem": "An algorithm has to be written in the scripting language that will eventually be used.", "feedback": "The range statement offers flow charts, pseudocode and structured English. The algorithm is designed before the language is chosen under criterion 2.1.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "72dae8b2a5", "unit": "ITINET0823B", "element": 1, "pc": "1.5", "topic": "Element 1", "stem": "", "feedback": "Expected, end, sequence, iteration — criteria 1.4, 1.5 and 1.6.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Element 1 requires an algorithm that solves the problem, takes account of "}, {"gap": 0}, {"t": " possible situations, is guaranteed to "}, {"gap": 1}, {"t": ", and uses structure, "}, {"gap": 2}, {"t": ", selection and "}, {"gap": 3}, {"t": "."}], "pool": ["expected", "end", "sequence", "iteration", "every", "succeed", "recursion", "branching"], "answer": [0, 1, 2, 3]}, {"id": "8c33080ff8", "unit": "ITINET0823B", "element": 1, "pc": "1.1", "topic": "Element 1", "stem": "", "feedback": "Consult, cycle, algorithm, terminate — criteria 1.1 to 1.5.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "Element 1 in order: "}, {"gap": 0}, {"t": " with the client and stakeholders, employ an abbreviated development "}, {"gap": 1}, {"t": ", develop an "}, {"gap": 2}, {"t": " that meets the requirements, and make sure it is guaranteed to "}, {"gap": 3}, {"t": "."}], "pool": ["consult", "cycle", "algorithm", "terminate", "code", "test", "document"], "answer": [0, 1, 2, 3]}, {"id": "fa733e85b1", "unit": "ITINET0823B", "element": 2, "pc": "2.1", "topic": "Language choice", "stem": "Criterion 2.1 requires an appropriate scripting language to be selected. What makes one appropriate?", "feedback": "Maintainability is the one people forget. A brilliant script in a language nobody else on the team reads is a liability the day it breaks.", "hints": ["Somebody other than the author will have to fix this one day.", "Re-read performance criterion 2.1 of this unit."], "kind": "mc", "options": ["It suits the platform, the task and what the organisation can maintain", "It is the language the writer knows best", "It is the fastest at runtime", "It is the one most widely used in the industry at the moment, according to current surveys"], "answer": 0}, {"id": "57618e5a79", "unit": "ITINET0823B", "element": 2, "pc": "2.1", "topic": "Languages", "stem": "Which THREE does the range statement list as scripting languages?", "feedback": "The range statement lists C and C++, JavaScript, Linux shell scripts, Perl, Python, VBScript, VB.Net and Windows PowerShell.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.1 of this unit."], "kind": "ms", "options": ["Linux shell scripts", "Windows PowerShell", "Python", "Java", "Assembler"], "answers": [0, 1, 2]}, {"id": "d51d1b91f0", "unit": "ITINET0823B", "element": 2, "pc": "2.2", "topic": "Syntax", "stem": "Criterion 2.2 requires you to demonstrate understanding and application of two things. Which pair?", "feedback": "Syntax and best practice. Syntax is what the interpreter demands; best practice is what the next reader needs.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.2 of this unit."], "kind": "mc", "options": ["Basic language syntax rules and best practices", "Syntax rules and the available debugging techniques", "Best practices and coding standards", "Syntax rules and error handling"], "answer": 0}, {"id": "b551739194", "unit": "ITINET0823B", "element": 2, "pc": "2.3", "topic": "Data types", "stem": "Criterion 2.3 requires language data types, operators and expressions to be used to create code that is:", "feedback": "Clear and concise — and the two can pull against each other. Concise code that nobody can read fails the criterion just as badly as clear code that rambles.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.3 of this unit."], "kind": "mc", "options": ["Clear and concise", "Efficient and portable", "Clear and fully commented", "Concise and reusable"], "answer": 0}, {"id": "37acbe424c", "unit": "ITINET0823B", "element": 2, "pc": "2.4", "topic": "Control flow", "stem": "Criterion 2.4 requires techniques of selection, iteration and sequence to be used to control:", "feedback": "Execution flow — the same three constructs from criterion 1.6, now in code rather than in the algorithm.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.4 of this unit."], "kind": "mc", "options": ["Script execution flow", "Data validation", "Error handling", "Output formatting and layout"], "answer": 0}, {"id": "1a3e764e69", "unit": "ITINET0823B", "element": 2, "pc": "2.5", "topic": "File handling", "stem": "Criterion 2.5 requires techniques for sequential file input and output to be used to:", "feedback": "Retrieve and store. The evidence guide expects scripts that access information stored in files and use system utilities to sort or find information within them.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.5 of this unit."], "kind": "mc", "options": ["Retrieve and store information", "Log script activity", "Pass data between scripts", "Back up the script's own configuration"], "answer": 0}, {"id": "77d46867d8", "unit": "ITINET0823B", "element": 2, "pc": "2.6", "topic": "User input", "stem": "Criterion 2.6 requires user input to be obtained and used to:", "feedback": "Input that does not change what the script does is decoration. The underpinning skills also list \"interact with user via script\".", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.6 of this unit."], "kind": "mc", "options": ["Affect the operation of the script", "Confirm the script should proceed", "Populate the script's log file", "Set the script's exit code"], "answer": 0}, {"id": "d7cc95de9d", "unit": "ITINET0823B", "element": 2, "pc": "2.7", "topic": "Documentation", "stem": "Criterion 2.7 requires internal document principles to be applied to the created code. What does \"internal\" mean here?", "feedback": "Internal documentation travels with the code and cannot be separated from it. Element 5 covers the separate technical and user documents.", "hints": ["Internal to what?", "Re-read performance criterion 2.7 of this unit."], "kind": "mc", "options": ["Documentation inside the code itself — comments, headers and meaningful names", "Documentation held on the organisation's internal network", "Documentation for internal staff rather than clients", "Documentation describing the internal workings of the operating system the script runs on"], "answer": 0}, {"id": "8ac0e187dd", "unit": "ITINET0823B", "element": 2, "pc": "2.8", "topic": "Maintainability", "stem": "Criterion 2.8 requires organisational guidelines to be followed when creating scripts, for the purpose of:", "feedback": "Maintainable code. A script lives for years and is read far more often than it is written.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.8 of this unit."], "kind": "mc", "options": ["Developing maintainable code", "Meeting the client's requirements", "Passing the organisation's code review", "Ensuring the script is portable"], "answer": 0}, {"id": "25da38e2bc", "unit": "ITINET0823B", "element": 2, "pc": "2.9", "topic": "Coding standards", "stem": "Which of these does the range statement list as a coding standard?", "feedback": "The range statement lists the GNU coding standard, the Java coding standard and organisation standards.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.9 of this unit."], "kind": "mc", "options": ["GNU coding standard", "ISO 9001", "IEEE 1394 interface standard", "ITIL"], "answer": 0}, {"id": "4678205277", "unit": "ITINET0823B", "element": 2, "pc": "2.7", "topic": "Documentation", "stem": "Choosing meaningful variable names is part of applying internal document principles.", "feedback": "A name that says what a value holds removes the need for a comment explaining it. Naming is the cheapest documentation there is.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "9b7a7ad7f5", "unit": "ITINET0823B", "element": 2, "pc": "2.3", "topic": "Data types", "stem": "A script reads a port number from a file and compares it with 80. What goes wrong if the value is treated as text rather than a number?", "feedback": "Criterion 2.3 is about using data types deliberately. \"80\" as text and 80 as a number are different things, and in many scripting languages the mistake is silent.", "hints": ["The script runs. That is what makes this dangerous.", "Re-read performance criterion 2.3 of this unit."], "kind": "mc", "options": ["The comparison may succeed or fail for the wrong reason, because text is compared character by character", "The script will refuse to run", "The value will be silently converted and rounded to the nearest whole number before the comparison is carried out", "The file will be locked until the script exits"], "answer": 0}, {"id": "63c5c4b3eb", "unit": "ITINET0823B", "element": 4, "pc": "4.3", "topic": "Security", "stem": "A script takes a hostname from the user and passes it straight to a system command. Under criterion 4.3 this is a problem because:", "feedback": "Criterion 4.3 requires action to ensure the code complies with security policy. Input that becomes part of a command has to be validated first.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 4.3 of this unit."], "kind": "mc", "options": ["Unchecked input reaching a system command is a security exposure", "The user may mistype the hostname", "The command may take too long to return and the script will appear to have hung", "The hostname may not resolve"], "answer": 0}, {"id": "778c306e8d", "unit": "ITINET0823B", "element": 2, "pc": "2.8", "topic": "Code quality", "stem": "Match each practice to the criterion in Element 2 that requires it.", "feedback": "Four criteria that all look like \"write it nicely\" until you read them closely. Each asks for something different.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 2.8."], "kind": "match", "left": ["Adding a header comment explaining what the script does", "Following the team's indentation and naming rules", "Writing the script so the next person can change it safely", "Choosing the right variable type for a port number"], "right": ["Criterion 2.7 — apply internal document principles", "Criterion 2.9 — adhere to coding standards", "Criterion 2.8 — organisational guidelines for maintainable code", "Criterion 2.3 — use language data types and operators"], "answer": [0, 1, 2, 3]}, {"id": "400443b7f7", "unit": "ITINET0823B", "element": 2, "pc": "2.5", "topic": "Element 2", "stem": "", "feedback": "Best, clear, iteration, output, input — criteria 2.2 to 2.6.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Element 2 requires you to select a language, apply syntax rules and "}, {"gap": 0}, {"t": " practices, use data types to write "}, {"gap": 1}, {"t": " and concise code, control flow with selection and "}, {"gap": 2}, {"t": ", use sequential file input and "}, {"gap": 3}, {"t": ", and obtain user "}, {"gap": 4}, {"t": "."}], "pool": ["best", "clear", "iteration", "output", "input", "good", "short", "recursion", "feedback"], "answer": [0, 1, 2, 3, 4]}, {"id": "4a7ce3ddd5", "unit": "ITINET0823B", "element": 2, "pc": "2.1", "topic": "Element 2", "stem": "", "feedback": "Select, syntax, data, flow, internally — criteria 2.1 to 2.7.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "Writing the script: "}, {"gap": 0}, {"t": " an appropriate language, apply the "}, {"gap": 1}, {"t": " rules and best practices, use the right "}, {"gap": 2}, {"t": " types, control the execution "}, {"gap": 3}, {"t": ", and document the code "}, {"gap": 4}, {"t": "."}], "pool": ["select", "syntax", "data", "flow", "internally", "compile", "semantic", "externally"], "answer": [0, 1, 2, 3, 4]}, {"id": "d7f5e0b3a5", "unit": "ITINET0823B", "element": 2, "pc": "2.9", "topic": "Code quality", "stem": "", "feedback": "Coding standards under 2.9, internal documentation under 2.7. They are adjacent criteria doing different jobs.", "hints": ["Each gap is marked separately — a wrong one does not cost you the others."], "kind": "cloze", "parts": [{"t": "A team writes shell scripts to a shared convention. Following that convention satisfies criterion "}, {"gap": {"type": "mc", "options": ["2.9", "2.7", "2.8", "2.2"], "answers": [0], "accept": ["2.9"], "wild": false}}, {"t": ", while writing header comments inside the file satisfies criterion "}, {"gap": {"type": "mc", "options": ["2.7", "2.9", "5.1", "2.3"], "answers": [0], "accept": ["2.7"], "wild": false}}, {"t": ". The range statement names the "}, {"gap": {"type": "mc", "options": ["GNU", "POSIX", "ISO", "IEEE"], "answers": [0], "accept": ["gnu"], "wild": false}}, {"t": " coding standard as one example."}]}, {"id": "6ac0f2640a", "unit": "ITINET0823B", "element": 2, "pc": "2.1", "topic": "Language choice", "stem": "Once the algorithm is written, any scripting language will do, since the logic is already settled.", "feedback": "Criterion 2.1 asks for an APPROPRIATE language. The platform, the available interpreters and who will maintain it all constrain the choice.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "f62a5dd830", "unit": "ITINET0823B", "element": 3, "pc": "3.1", "topic": "OS tools", "stem": "Criterion 3.1 requires searching and sorting tools to be used to select information from:", "feedback": "The OS logging output. The evidence guide echoes this: scripts that access information in files and use system utility programs to sort or find information within them.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.1 of this unit."], "kind": "mc", "options": ["The logging output of the operating system", "The script's own output files", "The configuration files of the network devices", "The application error logs"], "answer": 0}, {"id": "a5d683a0e5", "unit": "ITINET0823B", "element": 3, "pc": "3.2", "topic": "Logging", "stem": "Criterion 3.2 requires controls so that where significant events occur, the script creates and maintains a log of operations via:", "feedback": "The OS mechanism, so the script's events land alongside everything else and can be found by the same tools.", "hints": ["The criterion names where the log goes, not just that there is one.", "Re-read performance criterion 3.2 of this unit."], "kind": "mc", "options": ["The operating system logging mechanism", "A log file in the script's own directory", "The organisation's central log server", "Standard output, captured by the scheduler"], "answer": 0}, {"id": "f66c97f293", "unit": "ITINET0823B", "element": 3, "pc": "3.3", "topic": "Scheduling", "stem": "Criterion 3.3 requires scripts to be registered and run with:", "feedback": "The OS scheduling facility — cron on Linux, Task Scheduler on Windows. The underpinning knowledge lists program scheduling utilities as an operating system component.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.3 of this unit."], "kind": "mc", "options": ["The operating system scheduling facility", "A dedicated job scheduling application", "The network management system", "A wrapper script that runs at start-up"], "answer": 0}, {"id": "c1c941ea61", "unit": "ITINET0823B", "element": 3, "pc": "3.2", "topic": "Logging", "stem": "Criterion 3.2 requires the script to log every operation it performs.", "feedback": "It says \"where significant events occur\". A log of everything is as hard to search as no log at all.", "hints": ["Read the condition in the middle of the criterion."], "kind": "tf", "answer": false}, {"id": "e497680723", "unit": "ITINET0823B", "element": 3, "pc": "3.1", "topic": "Element 3", "stem": "", "feedback": "Searching, log, scheduling — criteria 3.1, 3.2 and 3.3.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Element 3 has three criteria: use "}, {"gap": 0}, {"t": " and sorting tools on the operating system logging output, create a "}, {"gap": 1}, {"t": " of operations via the operating system logging mechanism, and register and run scripts with the operating system "}, {"gap": 2}, {"t": " facility."}], "pool": ["searching", "log", "scheduling", "filtering", "report", "monitoring", "backup"], "answer": [0, 1, 2]}, {"id": "d7676bc7b0", "unit": "ITINET0823B", "element": 3, "pc": "3.3", "topic": "OS components", "stem": "The underpinning knowledge names several operating system components. Match each to what a script uses it for.", "feedback": "The underpinning knowledge lists command line interface, log files, program scheduling utilities, development methodologies, tools and utilities, and testing methods.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 3.3."], "kind": "match", "left": ["Command line interface", "Log files", "Program scheduling utilities", "Testing methods"], "right": ["Running the script and passing it arguments", "Finding out what  standards", "The design specification", "Organisational guidelines"], "answer": 0}, {"id": "17eb4715c1", "unit": "ITINET0823B", "element": 4, "pc": "4.4", "topic": "Permissions", "stem": "Criterion 4.4 requires action so that the code operates with:", "feedback": "\"Proper\" means what the task actually needs — no more. A script that runs as administrator because that was easier is the case this criterion exists for.", "hints": ["Not the most permissions, and not the fewest. What is the word?", "Re-read performance criterion 4.4 of this unit."], "kind": "mc", "options": ["Proper permissions", "Administrator privileges", "The permissions of the user who ran it", "Restricted permissions"], "answer": 0}, {"id": "e4536bb675", "unit": "ITINET0823B", "element": 4, "pc": "4.5", "topic": "Debugging", "stem": "Criterion 4.5 names three origins of error that debugging must detect and resolve. Which three?", "feedback": "Syntactical, logical and design. A design-origin error means the script does exactly what you told it and the instruction itself was wrong — the hardest of the three to find.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 4.5 of this unit."], "kind": "mc", "options": ["Syntactical, logical and design", "Syntactical, semantic and runtime", "Logical, runtime and environmental", "Syntax, permissions and data"], "answer": 0}, {"id": "322b119092", "unit": "ITINET0823B", "element": 4, "pc": "4.5", "topic": "Errors", "stem": "Match each fault to the origin criterion 4.5 would assign it.", "feedback": "Syntax errors stop it running; logical errors run wrong; design errors run exactly as specified and the specification was wrong. The fourth is not an error of origin at all — it is criterion 4.4.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 4.5."], "kind": "match", "left": ["A missing closing bracket stops the script running at all", "The loop runs one time too few and misses the last device", "The script archives logs older than 7 days when policy says 30", "The script runs as administrator when it only needs to read logs"], "right": ["Syntactical", "Logical", "Design", "A permissions fault under criterion 4.4"], "answer": [0, 1, 2, 3]}, {"id": "6ec0603aea", "unit": "ITINET0823B", "element": 4, "pc": "4.1", "topic": "Testing", "stem": "Criterion 4.1 requires the tests themselves to be documented, not just the results.", "feedback": "The criterion reads \"engineer, document and conduct simple tests\". A test nobody can repeat proves nothing the second time.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "efc40c4752", "unit": "ITINET0823B", "element": 4, "pc": "4.4", "topic": "Permissions", "stem": "A script that only needs to read log files is scheduled to run as the system administrator account. Under criterion 4.4 this is:", "feedback": "Proper permissions means matched to the task. An over-privileged script turns a small bug into a large incident.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 4.4 of this unit."], "kind": "mc", "options": ["Wrong, because the script operates with more permission than the task requires", "Acceptable, since the administrator account is the one that schedules it", "Acceptable, provided the script is stored securely", "A matter for criterion 4.3 rather than 4.4"], "answer": 0}, {"id": "f37ac09060", "unit": "ITINET0823B", "element": 4, "pc": "4.2", "topic": "Element 4", "stem": "", "feedback": "Tests, covered, security, permissions, logical — criteria 4.1 to 4.5.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be l
