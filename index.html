ents", "A failure to monitor specified outcomes", "A need for further mentoring and coaching"], "answer": 0}, {"id": "acf00fa088", "unit": "BSBFLM0093B", "element": 3, "pc": "3.3", "topic": "Records", "stem": "", "feedback": "A record only the author can reach is not a record the organisation holds, and the next person to look for it will start the improvement over from nothing.", "hints": ["Each gap is marked separately — a wrong one does not cost you the others."], "kind": "cloze", "parts": [{"t": "Criterion 3.3 requires records, reports and recommendations for improvement to be maintained within the organisation's "}, {"gap": {"type": "mc", "options": ["systems and processes", "document management system", "quality manual", "project files"], "answers": [0], "accept": ["systems and processes"], "wild": false}}, {"t": ". Keeping them in a personal folder would be "}, {"gap": {"type": "mc", "options": ["non-compliant, because the record is not accessible to the organisation", "acceptable, provided they are backed up", "acceptable, if the supervisor has access", "non-compliant only if the records are lost"], "answers": [0], "accept": ["non-compliant, because the record is not accessible to the organisation"], "wild": false}}, {"t": "."}]}, {"id": "5c3e8ae283", "unit": "BSBFLM0093B", "element": 3, "pc": "3.2", "topic": "Quality approaches", "stem": "The underpinning knowledge asks for understanding of the quality approaches an organisation may implement. What do they all have in common?", "feedback": "Whatever the name, a quality approach turns improvement into something the organisation does on a cycle, with a method — which is exactly what criterion 1.2 requires to be communicated to the team.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.2 of this unit."], "kind": "mc", "options": ["They make improvement a defined, repeating process rather than an occasional effort", "They require certification by an external body", "They are driven by senior management rather than teams", "They focus on measuring and counting defects after the work has already been completed"], "answer": 0}, {"id": "f82c2a1490", "unit": "BSBFLM0093B", "element": 3, "pc": "3.1", "topic": "Barriers", "stem": "Match each barrier to continuous improvement with what removes it.", "feedback": "The underpinning knowledge for this unit asks for the barriers to continuous improvement. Each of these is answered by a criterion in this unit — 3.1, 1.2, 1.3 and 2.1 in turn.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 3.1."], "kind": "match", "left": ["Suggestions are made but nobody hears an outcome", "Nobody knows how improvement is meant to work here", "The team can see the problem but cannot fix the cause", "Improvement happens only when someone notices something"], "right": ["Communicate agreed recommendations back to the team", "Communicate the organisation's improvement processes", "Coach and mentor so they are able to act", "Use a cyclical review on a defined schedule"], "answer": [0, 1, 2, 3]}]}]}</script>
<script>
(function(){
'use strict';
var DATA = JSON.parse(document.getElementById('data').textContent);
var KEY  = 'hcit-c2-practice-v1-m2';
var PAGE = 5;                       // questions per page
var app  = document.getElementById('app');

/* ------------------------------------------------------------ persistence */
function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
}
var S = load();
S.answers = S.answers || {};        // qid -> {tries, correct, given}
S.place   = S.place   || {};        // section code -> page index

/* ------------------------------------------------------------------ utils */
function el(tag, cls, txt){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
function shuffle(a, seed){
  var r = seed || 1, out = a.slice();
  for (var i = out.length - 1; i > 0; i--){
    r = (r * 1103515245 + 12345) & 0x7fffffff;
    var j = r % (i + 1), t = out[i]; out[i] = out[j]; out[j] = t;
  }
  return out;
}
function seedOf(id){
  var h = 0;
  for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) & 0x7fffffff;
  return h || 7;
}
function sectionStats(sec){
  var done = 0, right = 0;
  sec.questions.forEach(function(q){
    var a = S.answers[q.id];
    if (a && a.done){ done++; if (a.correct) right++; }
  });
  return { done: done, right: right, total: sec.questions.length };
}
var LETTERS = 'ABCDEFGH';

/* ------------------------------------------------------------------- home */
function renderHome(){
  document.getElementById('homeBtn').hidden = true;
  app.innerHTML = '';
  var head = el('div');
  head.appendChild(el('p', 'eyebrow', 'Cluster 2 · Manage Network Operation'));
  var h1 = el('h1', null, DATA.title); head.appendChild(h1);
  head.appendChild(el('p', 'lede', DATA.subtitle));
  app.appendChild(head);

  var grand = { done: 0, right: 0, total: 0 };
  var list = el('div', 'sectionlist');
  DATA.sections.forEach(function(sec, i){
    var st = sectionStats(sec);
    grand.done += st.done; grand.right += st.right; grand.total += st.total;
    var b = el('button', 'srow'); b.type = 'button';
    b.appendChild(el('span', 'snum', 'S' + (i + 1)));
    var mid = el('span'); mid.style.flex = '1'; mid.style.minWidth = '0';
    mid.appendChild(el('span', 'scode', sec.code));
    mid.appendChild(el('h2', null, sec.title));
    var pct = st.total ? Math.round(100 * st.done / st.total) : 0;
    mid.appendChild(el('div', 'smeta',
      st.done === 0 ? st.total + ' questions · not started'
      : st.done + ' of ' + st.total + ' answered · ' +
        (st.done ? Math.round(100 * st.right / st.done) : 0) + '% correct'));
    var bar = el('div', 'bar'); var fill = el('i');
    fill.style.width = pct + '%'; bar.appendChild(fill); mid.appendChild(bar);
    b.appendChild(mid);
    var p = el('span', 'pill' + (st.done === st.total ? ' done' : st.done ? ' part' : ''),
      st.done === st.total ? 'Complete' : st.done ? 'In progress' : 'Start');
    b.appendChild(p);
    b.onclick = function(){ openSection(i); };
    list.appendChild(b);
  });
  app.appendChild(list);

  var card = el('div', 'card');
  card.appendChild(el('h2', null, 'How this works'));
  var ul = el('ul');
  [ 'Four sections, fifty questions each. Stop at the end of any page and come '
    + 'back later — your place and your answers are kept on this computer.',
    'Every question gives you a hint on the first wrong try, so a wrong answer '
    + 'is worth something.',
    'After the second try you get the answer and the reason, with the '
    + 'performance criterion it comes from.',
    'Nothing is sent anywhere. This file works with no internet connection.'
  ].forEach(function(t){ ul.appendChild(el('li', null, t)); });
  card.appendChild(ul);
  if (grand.done){
    var act = el('div', 'actions');
    var reset = el('button', 'btn ghost', 'Clear all my answers'); reset.type = 'button';
    reset.onclick = function(){
      if (reset.dataset.armed){ S.answers = {}; S.place = {}; save(); renderHome(); return; }
      reset.dataset.armed = '1'; reset.textContent = 'Tap again to clear everything';
    };
    act.appendChild(reset); card.appendChild(act);
  }
  app.appendChild(card);
  document.getElementById('foot').textContent =
    grand.total + ' questions · ' + grand.done + ' answered · ' + DATA.programme;
  window.scrollTo(0, 0);
}

/* ---------------------------------------------------------------- section */
function openSection(si){
  var sec = DATA.sections[si];
  var page = S.place[sec.code] || 0;
  renderPage(si, page);
}

function renderPage(si, page){
  var sec = DATA.sections[si];
  var pages = Math.ceil(sec.questions.length / PAGE);
  page = Math.max(0, Math.min(page, pages - 1));
  S.place[sec.code] = page; save();
  document.getElementById('homeBtn').hidden = false;
  app.innerHTML = '';

  var head = el('div');
  head.appendChild(el('p', 'eyebrow', 'Section ' + (si + 1) + ' · ' + sec.code));
  head.appendChild(el('h1', null, sec.title));
  var st = sectionStats(sec);
  head.appendChild(el('p', 'lede',
    'Page ' + (page + 1) + ' of ' + pages + ' · ' + st.done + ' of ' + st.total +
    ' answered so far'));
  var bar = el('div', 'bar'); var fill = el('i');
  fill.style.width = Math.round(100 * st.done / st.total) + '%';
  bar.appendChild(fill); head.appendChild(bar);
  app.appendChild(head);

  var slice = sec.questions.slice(page * PAGE, page * PAGE + PAGE);
  slice.forEach(function(q, k){
    app.appendChild(renderQuestion(q, page * PAGE + k + 1, sec.questions.length));
  });

  var nav = el('div', 'actions');
  nav.style.marginTop = '20px';
  if (page > 0){
    var prev = el('button', 'btn ghost', '← Previous page'); prev.type = 'button';
    prev.onclick = function(){ renderPage(si, page - 1); window.scrollTo(0,0); };
    nav.appendChild(prev);
  }
  if (page < pages - 1){
    var next = el('button', 'btn', 'Next page →'); next.type = 'button';
    next.onclick = function(){ renderPage(si, page + 1); window.scrollTo(0,0); };
    nav.appendChild(next);
  } else {
    var fin = el('button', 'btn', 'Finish this section'); fin.type = 'button';
    fin.onclick = function(){ renderScore(si); };
    nav.appendChild(fin);
  }
  var pause = el('button', 'btn ghost', 'Stop here for now'); pause.type = 'button';
  pause.onclick = function(){ renderHome(); };
  nav.appendChild(pause);
  app.appendChild(nav);

  document.getElementById('foot').textContent =
    sec.code + ' · page ' + (page + 1) + ' of ' + pages +
    ' · your place is saved automatically';
}

/* --------------------------------------------------------------- question */
function renderQuestion(q, n, total){
  var card = el('div', 'card');
  var head = el('div', 'qhead');
  head.appendChild(el('span', null, 'Question ' + n + ' of ' + total));
  var tag = el('span');
  tag.appendChild(el('span', 'tagpc', 'Element ' + q.element + ' · PC ' + q.pc));
  head.appendChild(tag);
  card.appendChild(head);

  var state = S.answers[q.id] || { tries: 0, done: false, correct: false };
  var body = el('div');
  card.appendChild(body);
  var foot = el('div');
  card.appendChild(foot);

  var HOWTO = {
    ms:    'More than one answer is right — select every one that applies.',
    match: 'Pick the matching item for each row.',
    gap:   'Choose the right word for each gap. There are more options than gaps.',
    drag:  'Tap a word, then tap the gap you want it in. Tap a filled gap to '
         + 'empty it. There are more words than gaps.',
    cloze: 'Fill in every gap. Each one is marked separately.'
  };
  var api = KINDS[q.kind](q, body, state);
  if (HOWTO[q.kind]){
    var tip = el('p', 'howto', HOWTO[q.kind]);
    var slotty = q.kind === 'gap' || q.kind === 'drag' || q.kind === 'cloze';
    body.insertBefore(tip, slotty ? body.firstChild : body.firstChild.nextSibling);
  }

  var act = el('div', 'actions');
  var check = el('button', 'btn', 'Check'); check.type = 'button';
  act.appendChild(check);
  foot.appendChild(act);

  function settle(correct){
    state.tries++;
    state.correct = correct;
    if (correct || state.tries >= 2) state.done = true;
    S.answers[q.id] = state; save();
    foot.innerHTML = '';
    if (correct){
      api.mark(true);
      var ok = el('div', 'note ok');
      ok.appendChild(el('b', null, 'Correct'));
      ok.appendChild(el('span', null, q.feedback));
      foot.appendChild(ok);
    } else if (state.tries === 1){
      var h = el('div', 'note hint');
      h.appendChild(el('b', null, 'Not yet — try once more'));
      h.appendChild(el('span', null, q.hints[0]));
      foot.appendChild(h);
      var again = el('div', 'actions');
      var b2 = el('button', 'btn', 'Check again'); b2.type = 'button';
      b2.onclick = function(){ settle(api.isCorrect()); };
      again.appendChild(b2);
      var reveal = el('button', 'btn ghost', 'Show me the answer');
      reveal.type = 'button';
      reveal.onclick = function(){ state.tries = 2; settle(false); };
      again.appendChild(reveal);
      foot.appendChild(again);
    } else {
      api.mark(false);
      var no = el('div', 'note no');
      no.appendChild(el('b', null, 'The answer'));
      no.appendChild(el('span', null, q.feedback));
      foot.appendChild(no);
      var hh = el('div', 'note');
      hh.appendChild(el('b', null, q.hints[1] ? 'Also worth knowing' : ''));
      hh.appendChild(el('span', null, q.hints[1] || ''));
      if (q.hints[1]) foot.appendChild(hh);
    }
  }
  check.onclick = function(){ if (api.answered()) settle(api.isCorrect()); };

  if (state.done){ settle(state.correct); }
  return card;
}

/* ------------------------------------------------------------ question kinds */
var KINDS = {};

function choiceList(q, host, opts, multi, getSel, setSel){
  var order = shuffle(opts.map(function(_, i){ return i; }), seedOf(q.id));
  var wrap = el('div', 'opts');
  var nodes = [];
  order.forEach(function(oi, pos){
    var b = el('button', 'opt'); b.type = 'button';
    b.appendChild(el('span', 'k', LETTERS[pos]));
    b.appendChild(el('span', null, opts[oi]));
    b.setAttribute('aria-pressed', 'false');
    b.dataset.i = oi;
    b.onclick = function(){
      if (b.disabled) return;
      if (multi){
        var on = b.getAttribute('aria-pressed') === 'true';
        b.setAttribute('aria-pressed', on ? 'false' : 'true');
      } else {
        nodes.forEach(function(x){ x.setAttribute('aria-pressed', 'false'); });
        b.setAttribute('aria-pressed', 'true');
      }
    };
    nodes.push(b);
    wrap.appendChild(b);
  });
  host.appendChild(wrap);
  return nodes;
}

KINDS.mc = function(q, host, state){
  host.appendChild(el('p', 'stem', q.stem));
  var nodes = choiceList(q, host, q.options, false);
  function picked(){
    return nodes.filter(function(n){ return n.getAttribute('aria-pressed') === 'true'; });
  }
  return {
    answered: function(){ return picked().length === 1; },
    isCorrect: function(){ return picked().length === 1 && +picked()[0].dataset.i === q.answer; },
    mark: function(){
      nodes.forEach(function(n){
        n.disabled = true;
        if (+n.dataset.i === q.answer) n.classList.add('right');
        else if (n.getAttribute('aria-pressed') === 'true') n.classList.add('wrong');
      });
    }
  };
};

KINDS.ms = function(q, host, state){
  host.appendChild(el('p', 'stem', q.stem));
  var nodes = choiceList(q, host, q.options, true);
  function picked(){
    return nodes.filter(function(n){ return n.getAttribute('aria-pressed') === 'true'; })
                .map(function(n){ return +n.dataset.i; }).sort();
  }
  return {
    answered: function(){ return picked().length > 0; },
    isCorrect: function(){
      var p = picked(), a = q.answers.slice().sort();
      return p.length === a.length && p.every(function(v, i){ return v === a[i]; });
    },
    mark: function(){
      nodes.forEach(function(n){
        n.disabled = true;
        var i = +n.dataset.i, sel = n.getAttribute('aria-pressed') === 'true';
        if (q.answers.indexOf(i) >= 0) n.classList.add('right');
        else if (sel) n.classList.add('wrong');
      });
    }
  };
};

KINDS.tf = function(q, host, state){
  host.appendChild(el('p', 'stem', q.stem));
  var nodes = choiceList(q, host, ['True', 'False'], false);
  function picked(){
    return nodes.filter(function(n){ return n.getAttribute('aria-pressed') === 'true'; });
  }
  var want = q.answer ? 0 : 1;
  return {
    answered: function(){ return picked().length === 1; },
    isCorrect: function(){ return picked().length === 1 && +picked()[0].dataset.i === want; },
    mark: function(){
      nodes.forEach(function(n){
        n.disabled = true;
        if (+n.dataset.i === want) n.classList.add('right');
        else if (n.getAttribute('aria-pressed') === 'true') n.classList.add('wrong');
      });
    }
  };
};

KINDS.match = function(q, host, state){
  host.appendChild(el('p', 'stem', q.stem));
  var grid = el('div', 'matchgrid');
  var order = shuffle(q.right.map(function(_, i){ return i; }), seedOf(q.id));
  var rows = [];
  q.left.forEach(function(lt, li){
    var row = el('div', 'mrow');
    row.appendChild(el('span', null, lt));
    var sel = document.createElement('select');
    var blank = document.createElement('option');
    blank.value = ''; blank.textContent = 'Choose…';
    sel.appendChild(blank);
    order.forEach(function(ri){
      var o = document.createElement('option');
      o.value = ri; o.textContent = q.right[ri];
      sel.appendChild(o);
    });
    row.appendChild(sel);
    grid.appendChild(row);
    rows.push({ row: row, sel: sel, want: q.answer[li] });
  });
  host.appendChild(grid);
  return {
    answered: function(){ return rows.every(function(r){ return r.sel.value !== ''; }); },
    isCorrect: function(){ return rows.every(function(r){ return +r.sel.value === r.want; }); },
    mark: function(){
      rows.forEach(function(r){
        r.sel.disabled = true;
        var ok = +r.sel.value === r.want;
        r.row.classList.add(ok ? 'right' : 'wrong');
        if (!ok) r.sel.value = r.want;
      });
    }
  };
};

KINDS.gap = function(q, host, state){
  var line = el('p', 'slotline');
  var slots = [];
  var order = shuffle(q.pool.map(function(_, i){ return i; }), seedOf(q.id));
  q.parts.forEach(function(p){
    if (p.t != null){ line.appendChild(document.createTextNode(p.t)); return; }
    var sel = document.createElement('select');
    sel.className = 'slot';
    var blank = document.createElement('option');
    blank.value = ''; blank.textContent = '— choose —';
    sel.appendChild(blank);
    order.forEach(function(pi){
      var o = document.createElement('option');
      o.value = pi; o.textContent = q.pool[pi];
      sel.appendChild(o);
    });
    line.appendChild(sel);
    slots.push({ sel: sel, want: q.answer[p.gap] });
  });
  host.appendChild(line);
  return {
    answered: function(){ return slots.every(function(s){ return s.sel.value !== ''; }); },
    isCorrect: function(){ return slots.every(function(s){ return +s.sel.value === s.want; }); },
    mark: function(){
      slots.forEach(function(s){
        s.sel.disabled = true;
        var ok = +s.sel.value === s.want;
        s.sel.classList.add(ok ? 'right' : 'wrong');
        if (!ok) s.sel.value = s.want;
      });
    }
  };
};

KINDS.drag = function(q, host, state){
  var line = el('p', 'slotline');
  var slots = [];
  q.parts.forEach(function(p){
    if (p.t != null){ line.appendChild(document.createTextNode(p.t)); return; }
    var b = el('button', 'dropslot', 'drop here'); b.type = 'button';
    line.appendChild(b);
    slots.push({ node: b, want: q.answer[p.gap], val: null });
  });
  host.appendChild(line);

  var bank = el('div', 'bank');
  var toks = [];
  shuffle(q.pool.map(function(_, i){ return i; }), seedOf(q.id)).forEach(function(pi){
    var t = el('button', 'tok', q.pool[pi]); t.type = 'button';
    t.setAttribute('aria-pressed', 'false');
    t.dataset.i = pi;
    toks.push(t); bank.appendChild(t);
  });
  host.appendChild(bank);

  var held = null;
  function clearHeld(){
    held = null;
    toks.forEach(function(t){ t.setAttribute('aria-pressed', 'false'); });
    slots.forEach(function(s){ s.node.classList.remove('active'); });
  }
  function refresh(){
    var used = slots.map(function(s){ return s.val; })
                    .filter(function(v){ return v != null; });
    toks.forEach(function(t){
      var on = used.indexOf(+t.dataset.i) >= 0;
      t.classList.toggle('used', on);
    });
  }
  toks.forEach(function(t){
    t.onclick = function(){
      if (t.disabled || t.classList.contains('used')) return;
      var was = t.getAttribute('aria-pressed') === 'true';
      clearHeld();
      if (!was){
        t.setAttribute('aria-pressed', 'true');
        held = +t.dataset.i;
        slots.forEach(function(s){ if (s.val == null) s.node.classList.add('active'); });
      }
    };
  });
  slots.forEach(function(s){
    s.node.onclick = function(){
      if (s.node.disabled) return;
      if (held == null){
        if (s.val != null){ s.val = null; s.node.textContent = 'drop here';
          s.node.classList.remove('filled'); refresh(); }
        return;
      }
      s.val = held;
      s.node.textContent = q.pool[held];
      s.node.classList.add('filled');
      clearHeld(); refresh();
    };
  });
  return {
    answered: function(){ return slots.every(function(s){ return s.val != null; }); },
    isCorrect: function(){ return slots.every(function(s){ return s.val === s.want; }); },
    mark: function(){
      clearHeld();
      toks.forEach(function(t){ t.disabled = true; });
      slots.forEach(function(s){
        s.node.disabled = true;
        var ok = s.val === s.want;
        s.node.classList.remove('filled');
        s.node.classList.add(ok ? 'right' : 'wrong');
        s.node.textContent = q.pool[s.want];
      });
    }
  };
};

KINDS.cloze = function(q, host, state){
  var line = el('p', 'slotline');
  var gaps = [];
  q.parts.forEach(function(p){
    if (p.t != null){ line.appendChild(document.createTextNode(p.t)); return; }
    var g = p.gap;
    if (g.type === 'sa'){
      var inp = document.createElement('input');
      inp.type = 'text'; inp.className = 'sa';
      inp.setAttribute('aria-label', 'answer');
      line.appendChild(inp);
      gaps.push({ node: inp, kind: 'sa', accept: g.accept, wild: g.wild,
                  show: g.options[g.answers[0]] });
    } else {
      var sel = document.createElement('select');
      sel.className = 'slot';
      var blank = document.createElement('option');
      blank.value = ''; blank.textContent = '— choose —';
      sel.appendChild(blank);
      shuffle(g.options.map(function(_, i){ return i; }), seedOf(q.id) + gaps.length)
        .forEach(function(oi){
          var o = document.createElement('option');
          o.value = oi; o.textContent = g.options[oi];
          sel.appendChild(o);
        });
      line.appendChild(sel);
      gaps.push({ node: sel, kind: 'mc', answers: g.answers,
                  show: g.options[g.answers[0]] });
    }
  });
  host.appendChild(line);
  function ok(g){
    if (g.kind === 'mc') return g.answers.indexOf(+g.node.value) >= 0;
    var v = (g.node.value || '').trim().toLowerCase();
    if (!v) return false;
    return g.accept.some(function(a){
      return g.wild ? v.indexOf(a) === 0 : v === a;
    });
  }
  return {
    answered: function(){
      return gaps.every(function(g){ return (g.node.value || '').trim() !== ''; });
    },
    isCorrect: function(){ return gaps.every(ok); },
    mark: function(){
      gaps.forEach(function(g){
        g.node.disabled = true;
        var good = ok(g);
        g.node.classList.add(good ? 'right' : 'wrong');
        if (!good){
          if (g.kind === 'mc'){ g.node.value = g.answers[0]; }
          else { g.node.value = g.show; }
        }
      });
    }
  };
};

/* ------------------------------------------------------------------ score */
function renderScore(si){
  var sec = DATA.sections[si];
  var st = sectionStats(sec);
  app.innerHTML = '';
  app.appendChild(el('p', 'eyebrow', 'Section ' + (si + 1) + ' · ' + sec.code));
  app.appendChild(el('h1', null, 'How you did'));

  var pct = st.done ? Math.round(100 * st.right / st.done) : 0;
  var card = el('div', 'card');
  var big = el('div', 'big ' + (pct >= 80 ? 'ok' : 'no'), pct + '%');
  card.appendChild(big);
  card.appendChild(el('p', 'lede',
    st.right + ' right out of ' + st.done + ' answered' +
    (st.done < st.total ? ' (' + (st.total - st.done) + ' not attempted)' : '')));
  card.appendChild(el('p', null, pct >= 80
    ? 'That is at or above the mastery mark used across this programme. '
    + 'Move on, and come back to this section a week before the end-of-cluster test.'
    : 'Below the 80% mastery mark. Work through the elements where you lost '
    + 'marks, then run the section again.'));
  app.appendChild(card);

  var byEl = {};
  sec.questions.forEach(function(q){
    var a = S.answers[q.id];
    var k = 'Element ' + q.element;
    byEl[k] = byEl[k] || { n: 0, right: 0, done: 0 };
    byEl[k].n++;
    if (a && a.done){ byEl[k].done++; if (a.correct) byEl[k].right++; }
  });
  var wrap = el('div', 'wrap');
  var t = el('table');
  var thead = el('thead');
  var hr = el('tr');
  ['Element', 'Answered', 'Right', 'Score'].forEach(function(h){
    hr.appendChild(el('th', null, h));
  });
  thead.appendChild(hr); t.appendChild(thead);
  var tb = el('tbody');
  Object.keys(byEl).sort().forEach(function(k){
    var v = byEl[k];
    var tr = el('tr');
    tr.appendChild(el('td', null, k));
    tr.appendChild(el('td', 'num', v.done + ' / ' + v.n));
    tr.appendChild(el('td', 'num', String(v.right)));
    tr.appendChild(el('td', 'num',
      v.done ? Math.round(100 * v.right / v.done) + '%' : '—'));
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); app.appendChild(wrap);

  var act = el('div', 'actions');
  act.style.marginTop = '18px';
  var again = el('button', 'btn', 'Run this section again'); again.type = 'button';
  again.onclick = function(){
    sec.questions.forEach(function(q){ delete S.answers[q.id]; });
    S.place[sec.code] = 0; save(); renderPage(si, 0); window.scrollTo(0, 0);
  };
  act.appendChild(again);
  if (si + 1 < DATA.sections.length){
    var nx = el('button', 'btn ghost', 'Next section →'); nx.type = 'button';
    nx.onclick = function(){ openSection(si + 1); window.scrollTo(0, 0); };
    act.appendChild(nx);
  }
  var hb = el('button', 'btn ghost', 'All sections'); hb.type = 'button';
  hb.onclick = renderHome;
  act.appendChild(hb);
  app.appendChild(act);
  window.scrollTo(0, 0);
}

/* ------------------------------------------------------------------- boot */
document.getElementById('homeBtn').onclick = renderHome;
document.getElementById('themeBtn').onclick = function(){
  var r = document.documentElement;
  var now = r.getAttribute('data-theme');
  var dark = now ? now === 'dark'
    : window.matchMedia('(prefers-color-scheme:dark)').matches;
  r.setAttribute('data-theme', dark ? 'light' : 'dark');
  try { localStorage.setItem(KEY + '-theme', dark ? 'light' : 'dark'); } catch(e){}
};
try {
  var th = localStorage.getItem(KEY + '-theme');
  if (th) document.documentElement.setAttribute('data-theme', th);
} catch(e){}
renderHome();
})();

<script id="data" type="application/json">{"title": "Network Administration Level 3 — Module Three", "subtitle": "Practice bank for all six units of Cluster 3, Provide Network Administration", "programme": "ITI30616", "sections": [{"code": "CRIMAT0013A", "title": "Perform advance mathematical computations", "questions": [{"id": "904e15bfea", "unit": "CRIMAT0013A", "element": 1, "pc": "1.1", "topic": "Scientific notation", "stem": "A switch has forwarded 48,000,000 frames. Written in scientific notation that is 4.8 × 10ⁿ. What is n?", "feedback": "Move the decimal point left until one non-zero digit remains in front of it: 48000000 becomes 4.8, and the point moved seven places, so n = 7.", "hints": ["Count how many places the decimal point has to travel.", "Check the units and the rounding before you type the number."], "kind": "num", "answer": 7, "tol": 0, "also": []}, {"id": "07a3e6ff32", "unit": "CRIMAT0013A", "element": 1, "pc": "1.1", "topic": "Scientific notation", "stem": "Which of these numbers is the largest?", "feedback": "Compare the exponent first and only then the coefficient. 10⁶ beats 10⁵ however large the coefficient in front of the smaller power.", "hints": ["Look at the power of ten before you look at the number in front.", "Re-read performance criterion 1.1 of this unit."], "kind": "mc", "options": ["3.2 × 10⁶", "4.1 × 10⁵", "9.9 × 10⁴", "7.8 × 10⁵"], "answer": 0}, {"id": "e87d5c48b4", "unit": "CRIMAT0013A", "element": 1, "pc": "1.2", "topic": "Powers", "stem": "A subnet has 10 host bits. Using 2 to the power of 10, how many bit patterns are possible?", "feedback": "2¹⁰ = 1024. Doubling ten times from 1 gives 1024 — worth memorising, because subnetting uses it constantly.", "hints": ["Write down what you are given and what you are asked for before you start calculating.", "Check the units and the rounding before you type the number."], "kind": "num", "answer": 1024, "tol": 0, "also": []}, {"id": "b11217841e", "unit": "CRIMAT0013A", "element": 1, "pc": "1.2", "topic": "Fractions", "stem": "Add 3/4 and 5/6. Give your answer as a single fraction in the form a/b, not as a decimal.", "feedback": "The lowest common denominator of 4 and 6 is 12. 3/4 = 9/12 and 5/6 = 10/12, so the sum is 19/12. It is already in lowest terms because 19 is prime.", "hints": ["Find the lowest common denominator first.", "Re-read performance criterion 1.2 of this unit."], "kind": "sa", "accept": ["19/12"], "show": "19/12"}, {"id": "e322440712", "unit": "CRIMAT0013A", "element": 1, "pc": "1.3", "topic": "Decimals", "stem": "Express 7/8 as a percentage. Give the number only.", "feedback": "7 ÷ 8 = 0.875, and 0.875 × 100 = 87.5%.", "hints": ["Write down what you are given and what you are asked for before you start calculating.", "Check the units and the rounding before you type the number."], "kind": "num", "answer": 87.5, "tol": 0.01, "also": []}, {"id": "923d84e531", "unit": "CRIMAT0013A", "element": 1, "pc": "1.3", "topic": "Decimals", "stem": "Express 3/16 as a decimal.", "feedback": "3 ÷ 16 = 0.1875. Sixteenths always terminate, because 16 is a power of 2.", "hints": ["Write down what you are given and what you are asked for before you start calculating.", "Check the units and the rounding before you type the number."], "kind": "num", "answer": 0.1875, "tol": 0.0001, "also": []}, {"id": "066b6c3131", "unit": "CRIMAT0013A", "element": 1, "pc": "1.4", "topic": "Rational", "stem": "Which of these is an irrational number?", "feedback": "An irrational number cannot be written as one integer over another. √2 cannot. 22/7 can — it is a common approximation of π but is itself perfectly rational.", "hints": ["One of these is famously used to approximate an irrational number without being one.", "Re-read performance criterion 1.4 of this unit."], "kind": "mc", "options": ["√2", "22/7", "0.75", "−13"], "answer": 0}, {"id": "f0c5981ec5", "unit": "CRIMAT0013A", "element": 1, "pc": "1.4", "topic": "Rational", "stem": "Every integer is a rational number.", "feedback": "Any integer n can be written as n/1, which fits the definition of a rational number exactly.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "02e99b6df1", "unit": "CRIMAT0013A", "element": 1, "pc": "1.5", "topic": "Terminating", "stem": "Which fraction produces a repeating decimal rather than a terminating one?", "feedback": "A fraction in lowest terms terminates only when its denominator factors into 2s and 5s alone. 8 = 2³, 20 = 2²×5 and 25 = 5², so those terminate. 3 does not, so 1/3 repeats.", "hints": ["Factorise each denominator. Which one has a factor that is neither 2 nor 5?", "Re-read performance criterion 1.5 of this unit."], "kind": "mc", "options": ["1/3", "1/8", "1/20", "3/25"], "answer": 0}, {"id": "262bf24acb", "unit": "CRIMAT0013A", "element": 1, "pc": "1.6", "topic": "Fractions", "stem": "Convert the terminating decimal 0.375 to a fraction in its lowest terms, in the form a/b.", "feedback": "0.375 = 375/1000. Dividing top and bottom by 125 gives 3/8.", "hints": ["Spelling is forgiving here, but the answer has to be the right term.", "Re-read performance criterion 1.6 of this unit."], "kind": "sa", "accept": ["3/8"], "show": "3/8"}, {"id": "e47560703c", "unit": "CRIMAT0013A", "element": 1, "pc": "1.7", "topic": "Percentage", "stem": "Monthly traffic on a link rose from 400 GB to 520 GB. What is the percentage increase? Give the number only.", "feedback": "The rise is 120 GB. 120 ÷ 400 = 0.3, so a 30% increase. Always divide by the ORIGINAL figure, not the new one.", "hints": ["Divide the change by the figure you started with.", "Check the units and the rounding before you type the number."], "kind": "num", "answer": 30, "tol": 0, "also": []}, {"id": "764b3524d8", "unit": "CRIMAT0013A", "element": 2, "pc": "2.1", "topic": "Negative exponents", "stem": "What is 2 to the power of −3, as a decimal?", "feedback": "A negative exponent means the reciprocal: 2⁻³ = 1 ÷ 2³ = 1 ÷ 8 = 0.125.", "hints": ["Write down what you are given and what you are asked for before you start calculating.", "Check the units and the rounding before you type the number."], "kind": "num", "answer": 0.125, "tol": 0.0001, "also": []}, {"id": "a3a6e71141", "unit": "CRIMAT0013A", "element": 2, "pc": "2.1", "topic": "Negative exponents", "stem": "Write 5⁻² as a fraction in the form a/b.", "feedback": "5⁻² = 1 ÷ 5² = 1/25. The minus sign flips it; it does not make it negative.", "hints": ["A negative exponent does not produce a negative number.", "Re-read performance criterion 2.1 of this unit."], "kind": "sa", "accept": ["1/25"], "show": "1/25"}, {"id": "9764383334", "unit": "CRIMAT0013A", "element": 2, "pc": "2.2", "topic": "Same base", "stem": "Simplify 2¹² ÷ 2⁴ and give the value as a whole number.", "feedback": "Dividing powers of the same base subtracts the exponents: 2¹²⁻⁴ = 2⁸ = 256.", "hints": ["Write down what you are given and what you are asked for before you start calculating.", "Check the units and the rounding before you type the number."], "kind": "num", "answer": 256, "tol": 0, "also": []}, {"id": "3222591272", "unit": "CRIMAT0013A", "element": 2, "pc": "2.3", "topic": "Common denominators", "stem": "Add 5/12 and 7/18. Give the answer as a fraction in lowest terms, a/b.", "feedback": "12 = 2²×3 and 18 = 2×3², so the lowest common denominator is 2²×3² = 36. 5/12 = 15/36 and 7/18 = 14/36, giving 29/36.", "hints": ["Factorise both denominators and take the highest power of each prime.", "Re-read performance criterion 2.3 of this unit."], "kind": "sa", "accept": ["29/36"], "show": "29/36"}, {"id": "d6cf932b46", "unit": "CRIMAT0013A", "element": 2, "pc": "2.4", "topic": "Exponent rules", "stem": "Simplify (2³)⁴ and give the value as a whole number.", "feedback": "A power raised to a power multiplies the exponents: 2³ˣ⁴ = 2¹² = 4096.", "hints": ["Do the exponents get added here, or multiplied?", "Check the units and the rounding before you type the number."], "kind": "num", "answer": 4096, "tol": 0, "also": []}, {"id": "0897ac5a2a", "unit": "CRIMAT0013A", "element": 2, "pc": "2.5", "topic": "Roots", "stem": "What is the square root of 1024?", "feedback": "32 × 32 = 1024. Squaring and taking a square root undo each other, which is what criterion 2.5 calls the inverse relationship.", "hints": ["Write down what you are given and what you are asked for before you start calculating.", "Check the units and the rounding before you type the number."], "kind": "num", "answer": 32, "tol": 0, "also": []}, {"id": "a4e82bf6b8", "unit": "CRIMAT0013A", "element": 2, "pc": "2.6", "topic": "Roots", "stem": "Without a calculator: √200 lies between two consecutive whole numbers. What is the smaller of the two?", "feedback": "14² = 196 and 15² = 225, so √200 sits between 14 and 15 — much closer to 14.", "hints": ["Which squares do you know that sit either side of 200?", "Check the units and the rounding before you type the number."], "kind": "num", "answer": 14, "tol": 0, "also": []}, {"id": "7ebdb9b9fb", "unit": "CRIMAT0013A", "element": 2, "pc": "2.7", "topic": "Absolute value", "stem": "What does the absolute value of a number mean?", "feedback": "Criteria 2.7 and 2.8 together: the absolute value is a distance, and a distance is never negative.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.7 of this unit."], "kind": "mc", "options": ["Its distance from zero, without regard to direction", "Its value once any negative sign is applied", "The nearest whole number to it", "Its value ignoring any decimal part"], "answer": 0}, {"id": "0d36c30045", "unit": "CRIMAT0013A", "element": 2, "pc": "2.8", "topic": "Absolute value", "stem": "On a number line, |−6| and |6| are the same distance from zero.", "feedback": "Both are 6 units from zero. That is exactly what criterion 2.8 means by interpreting absolute value as distance.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "30e34e7e66", "unit": "CRIMAT0013A", "element": 2, "pc": "2.9", "topic": "Absolute value", "stem": "A reading is 17.5 units below the baseline, recorded as −17.5. What is its absolute value?", "feedback": "|−17.5| = 17.5. The size of the deviation matters; the direction is carried by the sign separately.", "hints": ["Write down what you are given and what you are asked for before you start calculating.", "Check the units and the rounding before you type the number."], "kind": "num", "answer": 17.5, "tol": 0.01, "also": []}, {"id": "c5a75a6cd2", "unit": "CRIMAT0013A", "element": 2, "pc": "2.2", "topic": "Exponent rules", "stem": "", "feedback": "Add, subtract, multiply. Mixing up the third one is the most common mistake in this element.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "When you multiply powers of the same base you "}, {"gap": 0}, {"t": " the exponents; when you divide them you "}, {"gap": 1}, {"t": " the exponents; and when you raise a power to another power you "}, {"gap": 2}, {"t": " the exponents."}], "pool": ["add", "subtract", "multiply", "divide", "square", "ignore"], "answer": [0, 1, 2]}, {"id": "c7e689668d", "unit": "CRIMAT0013A", "element": 3, "pc": "3.1", "topic": "Expressions", "stem": "Write an algebraic expression for \"three less than a number n\". Use n as the variable.", "feedback": "\"Three less than n\" is n − 3, not 3 − n. The order matters, and reversing it is the classic error this criterion tests.", "hints": ["Which quantity is being reduced?", "Re-read performance criterion 3.1 of this unit."], "kind": "sa", "accept": ["n-3", "n - 3", "n−3", "n − 3"], "show": "n-3"}, {"id": "84919d9766", "unit": "CRIMAT0013A", "element": 3, "pc": "3.1", "topic": "Expressions", "stem": "A technician charges a fixed call-out fee of $2,500 plus $900 for each hour worked. Which expression gives the total for h hours?", "feedback": "The fee is charged once; the hourly rate is charged h times. Criterion 3.1 is exactly this: turning a verbal description into an expression.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.1 of this unit."], "kind": "mc", "options": ["2500 + 900h", "2500h + 900", "900(h + 2500)", "3400h"], "answer": 0}, {"id": "1da7b4ade0", "unit": "CRIMAT0013A", "element": 3, "pc": "3.2", "topic": "Order of operations", "stem": "Evaluate 8 + 3 × (10 − 4)² ÷ 9", "feedback": "Brackets first: 10 − 4 = 6. Then the power: 6² = 36. Then multiply and divide left to right: 3 × 36 = 108, 108 ÷ 9 = 12. Finally add: 8 + 12 = 20.", "hints": ["Brackets, then the power, then multiply and divide, then add.", "Check the units and the rounding before you type the number."], "kind": "num", "answer": 20, "tol": 0, "also": []}, {"id": "ebfde3a434", "unit": "CRIMAT0013A", "element": 3, "pc": "3.3", "topic": "Properties", "stem": "Rewriting 6 × (40 + 3) as (6 × 40) + (6 × 3) uses which property?", "feedback": "Distribution spreads a multiplication across an addition. The range statement lists identity, inverse, distributive, associative and commutative as the properties of rational numbers.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.3 of this unit."], "kind": "mc", "options": ["The distributive property", "The commutative property", "The associative property", "The identity property"], "answer": 0}, {"id": "d28b90e4c9", "unit": "CRIMAT0013A", "element": 3, "pc": "3.4", "topic": "Terminology", "stem": "In the expression 7x + 4y − 9, match each part to what it is called.", "feedback": "The range statement lists variable, equation, term, coefficient, inequality, expression and constant. Note that this is an expression, not an equation — there is no equals sign.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 3.4."], "kind": "match", "left": ["x", "7", "−9, the part with no variable attached", "4y", "7x + 4y − 9 as a whole"], "right": ["A variable", "A coefficient", "A constant", "A term containing a variable", "An expression"], "answer": [0, 1, 2, 3, 4]}, {"id": "325e3369c1", "unit": "CRIMAT0013A", "element": 3, "pc": "3.2", "topic": "Order of operations", "stem": "", "feedback": "Brackets, powers, multiply/divide, add/subtract. The two paired operations are done left to right, not one before the other.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "Work through an expression in this order: "}, {"gap": 0}, {"t": " first, then any "}, {"gap": 1}, {"t": ", then "}, {"gap": 2}, {"t": " and division from left to right, and finally "}, {"gap": 3}, {"t": " and subtraction from left to right."}], "pool": ["brackets", "powers", "multiplication", "addition", "fractions", "variables", "rounding"], "answer": [0, 1, 2, 3]}, {"id": "aa76bf63f5", "unit": "CRIMAT0013A", "element": 4, "pc": "4.1", "topic": "Unit conversion", "stem": "A cable run is 2.5 km. How many metres is that?", "feedback": "1 km = 1000 m, so 2.5 × 1000 = 2500 m.", "hints": ["Write down what you are given and what you are asked for before you start calculating.", "Check the units and the rounding before you type the number."], "kind": "num", "answer": 2500, "tol": 0, "also": []}, {"id": "88b9e50063", "unit": "CRIMAT0013A", "element": 4, "pc": "4.2", "topic": "Comparing measures", "stem": "Which of these is the largest capacity?", "feedback": "1.5 TB = 1500 GB, and 1,000,000 MB = 1000 GB. Criterion 4.2 is about comparing capacities across units, which means converting them to a common unit first.", "hints": ["Put them all into the same unit before comparing.", "Re-read performance criterion 4.2 of this unit."], "kind": "mc", "options": ["1.5 TB", "1200 GB", "900 GB", "1,000,000 MB"], "answer": 0}, {"id": "047decb13a", "unit": "CRIMAT0013A", "element": 4, "pc": "4.3", "topic": "Scale drawings", "stem": "A floor plan is drawn to a scale of 1:50. A cable run measures 14 cm on the plan. How long is it in real life, in metres?", "feedback": "14 cm on the plan is 14 × 50 = 700 cm in reality, and 700 cm = 7 m.", "hints": ["Multiply by the scale, then convert the units.", "Check the units and the rounding before you type the number."], "kind": "num", "answer": 7, "tol": 0, "also": []}, {"id": "a5bfdf8a93", "unit": "CRIMAT0013A", "element": 4, "pc": "4.4", "topic": "Rates", "stem": "A 12 GB disk image is copied across a 200 Mbps link with no overhead. Using 1 byte = 8 bits and 1 GB = 1000 MB, how many seconds does the transfer take?", "feedback": "12 GB = 12,000 MB = 96,000 megabits. 96,000 ÷ 200 = 480 seconds, which is 8 minutes. The trap is forgetting that the link is rated in BITS and the file measured in BYTES.", "hints": ["The file is in bytes and the link is in bits. Convert first.", "Check the units and the rounding before you type the number."], "kind": "num", "answer": 480, "tol": 0, "also": []}, {"id": "764ea86fd0", "unit": "CRIMAT0013A", "element": 4, "pc": "4.5", "topic": "Geometric elements", "stem": "Match each element of a geometric figure to its definition.", "feedback": "The range statement names altitudes, mid-points, diagonals, angle bisectors, perpendicular bisectors, central angles, radii, diameters and chords of circles.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 4.5."], "kind": "match", "left": ["Radius", "Chord", "Diameter", "Perpendicular bisector", "Angle bisector"], "right": ["A line from the centre of a circle to its edge", "A line joining two points on a circle without passing through the centre", "A chord that passes through the centre", "A line cutting another in half at a right angle", "A line dividing an angle into two equal parts"], "answer": [0, 1, 2, 3, 4]}, {"id": "052af33def", "unit": "CRIMAT0013A", "element": 4, "pc": "4.6", "topic": "Constructions", "stem": "Criterion 4.6 requires basic elements to be constructed using:", "feedback": "The criterion names the two tools specifically. A straightedge draws lines but is not used to measure — that is what separates a construction from a drawing.", "hints": ["One of these tools deliberately has no measurements on it.", "Re-read performance criterion 4.6 of this unit."], "kind": "mc", "options": ["A compass and a straightedge", "A protractor and a ruler", "A set square and a calculator", "Drawing software"], "answer": 0}, {"id": "79b3ced691", "unit": "CRIMAT0013A", "element": 4, "pc": "4.7", "topic": "Coordinates", "stem": "A cable runs in a straight vertical line from the point (2, 3) to the point (2, 11) on a floor grid. How many units long is it?", "feedback": "Both points share an x value, so the line is vertical and its length is the difference in y: 11 − 3 = 8.", "hints": ["Write down what you are given and what you are asked for before you start calculating.", "Check the units and the rounding before you type the number."], "kind": "num", "answer": 8, "tol": 0, "also": []}, {"id": "40da6e117e", "unit": "CRIMAT0013A", "element": 4, "pc": "4.7", "topic": "Coordinates", "stem": "The point (5, 3) is reflected in the x-axis. Write the new coordinates in the form (x, y).", "feedback": "Reflecting in the x-axis keeps x and flips the sign of y, giving (5, −3).", "hints": ["Which coordinate changes when you flip across the horizontal axis?", "Re-read performance criterion 4.7 of this unit."], "kind": "sa", "accept": ["(5,-3)", "(5, -3)", "5,-3", "5, -3", "(5,−3)", "(5, −3)", "5,−3", "5, −3"], "show": "(5,-3)"}, {"id": "0918cc345e", "unit": "CRIMAT0013A", "element": 5, "pc": "5.1", "topic": "Estimation", "stem": "A technician calculates that 47 workstations at 2.4 GB each need 1,128 GB of storage. Which estimate best checks whether that is reasonable?", "feedback": "Criterion 5.1 is estimation used as a check. Rounding to 50 × 2.5 gives 125, which exposes a factor-of-ten slip immediately — and that kind of slip is exactly what estimation is for.", "hints": ["Work out the rough answer in your head first, then compare.", "Re-read performance criterion 5.1 of this unit."], "kind": "mc", "options": ["About 50 × 2.5 = 125, so roughly 125 GB — the calculated figure is ten times too large", "About 50 × 2.4 = 120, so the calculation is about right", "About 47 × 2 = 94, so the calculation is close enough", "The figure cannot be checked without redoing the whole calculation from the beginning by hand"], "answer": 0}, {"id": "4981be5184", "unit": "CRIMAT0013A", "element": 5, "pc": "5.3", "topic": "Strategies", "stem": "Criterion 5.3 asks you to apply strategies and results from simple problems to more complex ones. Which is the best example?", "feedback": "The point is carrying the METHOD forward, not the answer. That is what makes a simple problem worth working through properly.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 5.3 of this unit."], "kind": "mc", "options": ["Having worked out the transfer time for one file, using the same rate method for a batch of files of different sizes", "Using a calculator for the harder problem instead of working by hand", "Breaking the complex problem into parts and asking someone else for the hardest part", "Looking for a worked example that matches the complex problem exactly"], "answer": 0}, {"id": "1531635d7c", "unit": "CRIMAT0013A", "element": 5, "pc": "5.4", "topic": "Solving", "stem": "A job costs a $12,000 call-out plus $5,000 per hour. The final bill was $87,000. Solve 5000h + 12000 = 87000 for h — how many hours were worked?", "feedback": "Subtract 12,000 from both sides to get 5000h = 75,000, then divide by 5,000 to get h = 15 hours.", "hints": ["Undo the addition first, then the multiplication.", "Check the units and the rounding before you type the number."], "kind": "num", "answer": 15, "tol": 0, "also": []}, {"id": "9bc7d11b20", "unit": "CRIMAT0013A", "element": 5, "pc": "5.5", "topic": "Notation", "stem": "Criterion 5.5 requires the solution to be expressed clearly and logically using appropriate notation. Which answer meets it?", "feedback": "The criterion asks for the working and the units, not just the number. An answer nobody can follow cannot be checked, and an unchecked answer is not evidence of competence.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 5.5 of this unit."], "kind": "mc", "options": ["\"h = 15 hours, since 5000h + 12000 = 87000 gives 5000h = 75000\"", "\"15\"", "\"About 15 hours I think\"", "\"h=15 (I did it on the calculator twice, so it should be right)\""], "answer": 0}, {"id": "5a1cdeeac3", "unit": "CRIMAT0013A", "element": 5, "pc": "5.6", "topic": "Validity", "stem": "A calculation shows that 1.4 technicians are needed to cover a shift. What does criterion 5.6 require you to do?", "feedback": "Criterion 5.6 is about checking validity \"from the context of the problem\". The arithmetic can be flawless and the answer still nonsense until you ask what it means.", "hints": ["The arithmetic is not in dispute. What is?", "Re-read performance criterion 5.6 of this unit."], "kind": "mc", "options": ["Check the result against the context and round up to 2, because you cannot roster part of a person", "Report 1.4 as calculated, since the arithmetic is correct", "Round to 1, because 1.4 is closer to 1 than to 2", "Recalculate using a different method until a whole number appears in the answer, since the first method must be faulty"], "answer": 0}, {"id": "3a03a927df", "unit": "CRIMAT0013A", "element": 5, "pc": "5.1", "topic": "Reasoning", "stem": "", "feedback": "20% of 850 is 170, giving 1020 GB. An answer ten times that size fails the estimate, and criterion 5.1 says the estimate is what catches it.", "hints": ["Each gap is marked separately — a wrong one does not cost you the others."], "kind": "cloze", "parts": [{"t": "A link carries 850 GB in a month and is expected to grow by 20%. Estimating first: 20% of 850 is about "}, {"gap": {"type": "mc", "options": ["170", "85", "200", "340"], "answers": [0], "accept": ["170"], "wild": false}}, {"t": ", so next month should be near "}, {"gap": {"type": "mc", "options": ["1020 GB", "935 GB", "1700 GB", "870 GB"], "answers": [0], "accept": ["1020 gb"], "wild": false}}, {"t": ". A calculated answer of 8,500 GB would therefore be "}, {"gap": {"type": "mc", "options": ["rejected as unreasonable", "accepted, since the arithmetic was done", "rounded down to fit", "reported with a note"], "answers": [0], "accept": ["rejected as unreasonable"], "wild": false}}, {"t": "."}]}, {"id": "5724be20f9", "unit": "CRIMAT0013A", "element": 1, "pc": "1.7", "topic": "Percentage", "stem": "", "feedback": "The same 50 GB is 20% of 250 but 25% of 200. Percentage change always depends on where you started, which is why a fall and the matching rise are not the same percentage.", "hints": ["Each gap is marked separately — a wrong one does not cost you the others."], "kind": "cloze", "parts": [{"t": "Traffic falls from 250 GB to 200 GB. The change is "}, {"gap": {"type": "sa", "options": ["50"], "answers": [0], "accept": ["50"], "wild": false}}, {"t": " GB, which as a percentage of the ORIGINAL figure is a "}, {"gap": {"type": "mc", "options": ["20% decrease", "25% decrease", "20% increase", "50% decrease"], "answers": [0], "accept": ["20% decrease"], "wild": false}}, {"t": ". If it then rose from 200 GB back to 250 GB, the percentage change would be "}, {"gap": {"type": "mc", "options": ["25%, because the starting figure is now smaller", "20%, because it is the same change", "50%, because it is reversed", "the same either way"], "answers": [0], "accept": ["25%, because the starting figure is now smaller"], "wild": false}}, {"t": "."}]}, {"id": "d1a888ed7f", "unit": "CRIMAT0013A", "element": 2, "pc": "2.2", "topic": "Powers of two", "stem": "", "feedback": "Each additional bit doubles the count. Knowing the small powers of two by sight makes subnetting arithmetic almost instant.", "hints": ["Each gap is marked separately — a wrong one does not cost you the others."], "kind": "cloze", "parts": [{"t": "Host bits and addresses: 2⁸ = "}, {"gap": {"type": "sa", "options": ["256"], "answers": [0], "accept": ["256"], "wild": false}}, {"t": ", 2⁶ = "}, {"gap": {"type": "sa", "options": ["64"], "answers": [0], "accept": ["64"], "wild": false}}, {"t": ", and 2¹² = "}, {"gap": {"type": "sa", "options": ["4096"], "answers": [0], "accept": ["4096"], "wild": false}}, {"t": ". Each extra bit "}, {"gap": {"type": "mc", "options": ["doubles", "adds two to", "squares", "halves"], "answers": [0], "accept": ["doubles"], "wild": false}}, {"t": " the number of possible patterns."}]}, {"id": "cebbfb81ee", "unit": "CRIMAT0013A", "element": 4, "pc": "4.1", "topic": "Unit conversion", "stem": "To convert a measurement to a smaller unit you always divide.", "feedback": "It is the other way round: a smaller unit means more of them, so you multiply. 2.5 km becomes 2500 m, not 0.0025.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "6a7d30972a", "unit": "CRIMAT0013A", "element": 1, "pc": "1.4", "topic": "Rational", "stem": "Which THREE of the following are rational numbers?", "feedback": "A rational number can be written as one integer over another. −13 i
