eedback": "Criterion 4.7 names translations and reflections specifically. Neither changes the size of the figure.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "On a coordinate grid, a "}, {"gap": 0}, {"t": " moves a figure without turning or resizing it, while a "}, {"gap": 1}, {"t": " flips it across a line. Both leave the figure the same "}, {"gap": 2}, {"t": " as it started."}], "pool": ["translation", "reflection", "size", "rotation", "scaling", "position", "orientation"], "answer": [0, 1, 2]}, {"id": "420ba804cd", "unit": "CRIMAT0013A", "element": 5, "pc": "5.1", "topic": "Analysing problems", "stem": "The range statement lists five things that analysing a problem involves. Match each to what it looks like in practice.", "feedback": "The range statement lists identify relationships, distinguish relevant from irrelevant information, identify missing information, sequence and prioritize information, and observe patterns.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 5.1."], "kind": "match", "left": ["Identify relationships", "Distinguish relevant from irrelevant information", "Identify missing information", "Sequence and prioritize information", "Observe patterns"], "right": ["Noticing that transfer time depends on both file size and link speed", "Ignoring the number of users when only total volume matters", "Realising the link speed was never given", "Working out the file size before attempting the transfer time", "Seeing that each extra host bit doubles the address count"], "answer": [0, 1, 2, 3, 4]}]}, {"code": "ITINET1753B", "title": "Administer network peripherals", "questions": [{"id": "04cd077307", "unit": "ITINET1753B", "element": 1, "pc": "1.1", "topic": "Placement", "stem": "Criterion 1.1 requires the location of peripherals to be planned for two things. Which pair?", "feedback": "Both halves are in the criterion. A printer that is convenient but forces staff to lift reams over their heads fails it just as surely as one nobody can reach.", "hints": ["One half is about the user, the other about safety.", "Re-read performance criterion 1.1 of this unit."], "kind": "mc", "options": ["Appropriate service to users, and OH&S standards", "Cable economy, and appropriate service to users", "OH&S standards, and manufacturer warranty terms", "Network segment load, and power availability"], "answer": 0}, {"id": "51d10e09c5", "unit": "ITINET1753B", "element": 1, "pc": "1.1", "topic": "OH&S", "stem": "Which THREE does the range statement list under OH&S standards?", "feedback": "The range statement lists correct posture, lighting, type of desk, type of monitor, style of chair, typing position, repetitive strain injury prevention, ventilation, light position, correct lifting method and length of time in front of a computer.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.1 of this unit."], "kind": "ms", "options": ["Correct posture", "Correct lifting method", "Length of time in front of computer", "Fire extinguisher placement", "Cable colour coding"], "answers": [0, 1, 2]}, {"id": "3102fb481a", "unit": "ITINET1753B", "element": 1, "pc": "1.1", "topic": "Placement", "stem": "A heavy departmental printer is to be sited. Which placement best satisfies criterion 1.1?", "feedback": "Ventilation and correct lifting height are named OH&S items in the range statement, and \"appropriate services to users\" rules out a locked room. Cable convenience is not a criterion.", "hints": ["Two of these solve a technician's problem rather than the users'.", "Re-read performance criterion 1.1 of this unit."], "kind": "mc", "options": ["On a stand at waist height, in a ventilated area, within reach of the department that uses it most", "In the server room, where it is secure and out of the walkway", "On the floor beside the nearest network point, to keep the cable run as short and as tidy as possible", "On a high shelf, to free up desk space for the department"], "answer": 0}, {"id": "d18d15bf73", "unit": "ITINET1753B", "element": 1, "pc": "1.2", "topic": "Connection", "stem": "Criterion 1.2 requires peripherals to be connected to the network using:", "feedback": "The criterion names vendor approval specifically. Improvising a connection method usually voids support and sometimes the warranty.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.2 of this unit."], "kind": "mc", "options": ["A vendor-approved method and technology", "The fastest available interface", "Whatever method the existing peripherals use", "A method documented in the organisation's standards"], "answer": 0}, {"id": "94018ab7a8", "unit": "ITINET1753B", "element": 1, "pc": "1.3", "topic": "Connection", "stem": "Criterion 1.3 covers connecting peripherals to computers using parallel, serial or other direct connection methods. Which is a direct connection in that sense?", "feedback": "Criterion 1.2 covers the network path; 1.3 covers the cable straight from a computer to the device. The range statement names USB and Firewire (IEEE 1394) among the connection technologies.", "hints": ["Which one has a cable between exactly two devices?", "Re-read performance criterion 1.3 of this unit."], "kind": "mc", "options": ["A USB cable from the workstation to the printer", "A print queue shared from another workstation", "A wireless print service advertised over the LAN", "A print server accepting jobs over IP"], "answer": 0}, {"id": "8fc440e7c6", "unit": "ITINET1753B", "element": 1, "pc": "1.2", "topic": "Peripherals", "stem": "Which THREE does the range statement list as peripherals?", "feedback": "The range statement lists printers, scanners, tape cartridges, speakers, multimedia kits, PC fax/modems, input equipment, mobile phones, palmtops and PDAs, laptops and desktops, Bluetooth devices, USB and Firewire.", "hints": ["Two of these are network infrastructure rather than peripherals.", "Re-read performance criterion 1.2 of this unit."], "kind": "ms", "options": ["Scanners", "Personal computer fax/modems", "Palmtops and personal digital assistants", "Network switches", "Wireless access points"], "answers": [0, 1, 2]}, {"id": "e9a35f632d", "unit": "ITINET1753B", "element": 1, "pc": "1.4", "topic": "Accessories", "stem": "Criterion 1.4 gives two examples of a printer upgrade. Which are they?", "feedback": "The criterion names memory and high-volume paper trays. Note that toner is a consumable under criterion 4.2, not an upgrade.", "hints": ["One of the wrong answers is a consumable, which belongs to a different element.", "Re-read performance criterion 1.4 of this unit."], "kind": "mc", "options": ["Memory and high-volume paper trays", "Duplex units and network cards", "Toner cartridges and drums", "Firmware updates and print drivers"], "answer": 0}, {"id": "962f345d96", "unit": "ITINET1753B", "element": 1, "pc": "1.4", "topic": "Accessories", "stem": "Adding memory to a printer is an upgrade under criterion 1.4, while replacing its toner is a maintenance task under Element 4.", "feedback": "Criterion 1.4 covers accessories and upgrades such as memory and paper trays; criterion 4.2 covers replacing consumables and components.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "74492b2257", "unit": "ITINET1753B", "element": 1, "pc": "1.5", "topic": "Testing", "stem": "Criterion 1.5 requires peripherals to be tested for correct operation. When?", "feedback": "Criterion 1.5 closes Element 1. Handing over an untested device makes the user your test procedure.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.5 of this unit."], "kind": "mc", "options": ["As the last step of installation, before the device is handed to users", "Once users report the first fault", "During the first scheduled maintenance visit", "Only where the vendor requires it as a condition of the warranty on the device"], "answer": 0}, {"id": "a9ba1a1eb9", "unit": "ITINET1753B", "element": 1, "pc": "1.5", "topic": "Testing", "stem": "A successful test page proves the peripheral has been correctly configured for every user who needs it.", "feedback": "A test page proves the device works from where you tested it. Whether the right users can reach it is criterion 2.3, and whether they know how to use it from their own application is criterion 3.5.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "72aba3189a", "unit": "ITINET1753B", "element": 1, "pc": "1.1", "topic": "Installation", "stem": "", "feedback": "Plan, connect, upgrade, test — criteria 1.1 to 1.5 in sequence.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Element 1 runs in order: "}, {"gap": 0}, {"t": " the location for service and safety, "}, {"gap": 1}, {"t": " the device to the network by a vendor-approved method, add any "}, {"gap": 2}, {"t": " such as memory or paper trays, and finally "}, {"gap": 3}, {"t": " it for correct operation."}], "pool": ["plan", "connect", "upgrades", "test", "document", "secure", "schedule"], "answer": [0, 1, 2, 3]}, {"id": "4e7ac11d3b", "unit": "ITINET1753B", "element": 1, "pc": "1.2", "topic": "Networks", "stem": "The range statement describes what \"network\" may include. Match each to its description.", "feedback": "The range statement lists large and small LANs, WANs, VPNs, the internet, the use of the PSTN for dial-up modems only, private lines, data and voice.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 1.2."], "kind": "match", "left": ["LAN", "WAN", "VPN", "PSTN dial-up"], "right": ["A network confined to one site or building", "A network spanning separate geographic locations", "A private tunnel carried over a public network", "A connection raised over the telephone network when needed"], "answer": [0, 1, 2, 3]}, {"id": "a3b09c2a50", "unit": "ITINET1753B", "element": 1, "pc": "1.3", "topic": "Connection", "stem": "The range statement names one connection technology by its IEEE standard number, 1394. What is that technology usually called?", "feedback": "IEEE 1394 is Firewire. The range statement lists it alongside Bluetooth and USB as peripheral connection technologies.", "hints": ["Spelling is forgiving here, but the answer has to be the right term.", "Re-read performance criterion 1.3 of this unit."], "kind": "sa", "accept": ["firewire", "fire wire", "ieee 1394"], "show": "firewire"}, {"id": "396f723c8a", "unit": "ITINET1753B", "element": 2, "pc": "2.1", "topic": "Driver software", "stem": "Criterion 2.1 requires software to be installed to manage:", "feedback": "The criterion says \"local and network-connected\". Both paths need managing, and they are often managed by different tools.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.1 of this unit."], "kind": "mc", "options": ["Both local and network-connected peripherals", "Network-connected peripherals only", "Locally connected peripherals only", "Whichever peripherals the vendor supplies software for"], "answer": 0}, {"id": "508e1ab3df", "unit": "ITINET1753B", "element": 2, "pc": "2.2", "topic": "Naming", "stem": "Criterion 2.2 requires meaningful names for peripherals and control queues. Which name best meets it?", "feedback": "A meaningful name tells a user or a technician where the device is and what it does. A model number tells you what to order, not where to walk; a person's name outlives their time in the post.", "hints": ["Which name still makes sense to someone who has never seen the device?", "Re-read performance criterion 2.2 of this unit."], "kind": "mc", "options": ["HR-2F-Printer-01", "HP4350", "Printer3", "KENISTA-PRN-OFFICE"], "answer": 0}, {"id": "d779d3e427", "unit": "ITINET1753B", "element": 2, "pc": "2.2", "topic": "Naming", "stem": "Why does the underpinning knowledge tie peripheral naming to network documentation conventions?", "feedback": "The underpinning skills ask you to \"be aware of network documentation conventions when configuring the peripheral device's name or new profile\". Naming is a documentation act.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.2 of this unit."], "kind": "mc", "options": ["Because a name that breaks the convention makes the device hard to find in the records later", "Because vendors require a naming convention for support", "Because the operating system rejects names that are longer than the naming convention allows for a device", "Because names must be unique across the whole organisation"], "answer": 0}, {"id": "82c68774b1", "unit": "ITINET1753B", "element": 2, "pc": "2.3", "topic": "Security", "stem": "Criterion 2.3 requires security and access to be configured so that:", "feedback": "The criterion is about appropriate access — which is both letting the right people in and keeping the wrong ones out. A colour printer open to the whole site fails it as clearly as one nobody can reach.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.3 of this unit."], "kind": "mc", "options": ["Appropriate users can make use of the peripherals", "All users on the network can print", "Only administrators can change device settings", "Print jobs are encrypted in transit"], "answer": 0}, {"id": "5745ed2a06", "unit": "ITINET1753B", "element": 2, "pc": "2.4", "topic": "Workstation", "stem": "Criterion 2.4 requires the workstation to be configured so that:", "feedback": "Being visible to the operating system is not the same as being usable from the application the person actually works in — which is where the complaint comes from.", "hints": ["The device is installed and visible. What still might not work?", "Re-read performance criterion 2.4 of this unit."], "kind": "mc", "options": ["Applications can work with the peripheral", "The peripheral appears in the operating system device list", "The user can change the peripheral's settings", "The peripheral is reachable by its network name"], "answer": 0}, {"id": "451c1e0617", "unit": "ITINET1753B", "element": 2, "pc": "2.3", "topic": "Security", "stem": "Configuring peripheral access is a security task as well as a service task.", "feedback": "Criterion 2.3 says \"configure security and access\". Uncontrolled access to a device that holds queued documents is a genuine exposure.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "036ace381d", "unit": "ITINET1753B", "element": 2, "pc": "2.1", "topic": "Software", "stem": "Which THREE does the range statement list under software?", "feedback": "The range statement for software in this unit lists commercial, in-house or packaged, and customised software.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.1 of this unit."], "kind": "ms", "options": ["Commercial", "In-house, packaged", "Customised software", "Open source", "Firmware"], "answers": [0, 1, 2]}, {"id": "10f569d943", "unit": "ITINET1753B", "element": 2, "pc": "2.2", "topic": "Configuration", "stem": "", "feedback": "Install, name, secure, configure the workstation — criteria 2.1 to 2.4.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "Element 2 in order: "}, {"gap": 0}, {"t": " the management software, give the device and its queue a "}, {"gap": 1}, {"t": " name, configure "}, {"gap": 2}, {"t": " and access for the right users, and configure the "}, {"gap": 3}, {"t": " so applications can use it."}], "pool": ["install", "meaningful", "security", "workstation", "test", "vendor", "default"], "answer": [0, 1, 2, 3]}, {"id": "4324836003", "unit": "ITINET1753B", "element": 2, "pc": "2.2", "topic": "Naming", "stem": "What is a control queue, in the sense used by criterion 2.2?", "feedback": "A named queue can have a priority set on it under criterion 3.1 and be monitored under criterion 4.4. It is a managed object, not just a buffer.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.2 of this unit."], "kind": "mc", "options": ["The queue that holds jobs waiting for a peripheral, which can itself be named and managed", "The order in which technicians attend to faults reported against the device during the working day", "The list of users authorised to use the device", "The maintenance schedule for the device"], "answer": 0}, {"id": "58da315035", "unit": "ITINET1753B", "element": 2, "pc": "2.3", "topic": "Configuration", "stem": "", "feedback": "Access, workstation, meaningful name — criteria 2.3, 2.4 and 2.2.", "hints": ["Each gap is marked separately — a wrong one does not cost you the others."], "kind": "cloze", "parts": [{"t": "A colour laser is installed for the marketing department. Criterion 2.3 requires you to configure "}, {"gap": {"type": "mc", "options": ["security and access so that appropriate users can use it", "open access so that nobody is blocked", "administrator-only access for safety", "access by IP address only"], "answers": [0], "accept": ["security and access so that appropriate users can use it"], "wild": false}}, {"t": ". Criterion 2.4 then requires the "}, {"gap": {"type": "mc", "options": ["workstation", "server", "router", "firewall"], "answers": [0], "accept": ["workstation"], "wild": false}}, {"t": " to be configured so that applications can work with it. Naming it "}, {"gap": {"type": "mc", "options": ["MKT-3F-Colour-01", "LJ5550", "Printer7", "the colour one"], "answers": [0], "accept": ["mkt-3f-colour-01"], "wild": false}}, {"t": " satisfies criterion 2.2."}]}, {"id": "76f1827b61", "unit": "ITINET1753B", "element": 3, "pc": "3.2", "topic": "Management software", "stem": "Peripheral management software may come from the network operating system itself rather than from the device vendor.", "feedback": "Criterion 3.2 says so explicitly: management software may be supplied as part of the network operating system or by third parties.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "2bae76ea9e", "unit": "ITINET1753B", "element": 3, "pc": "3.1", "topic": "Priority", "stem": "Criterion 3.1 requires priority to be assigned to control queues. What does that achieve?", "feedback": "Priority is about order, not speed. The device prints at the same rate; what changes is who waits.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.1 of this unit."], "kind": "mc", "options": ["Jobs that matter more are printed ahead of jobs that matter less on the same device", "Faster printing for all users of the device, because the queue is processed more efficiently", "Reduced network traffic to the device", "Fewer paper jams caused by large jobs"], "answer": 0}, {"id": "f73c9615e3", "unit": "ITINET1753B", "element": 3, "pc": "3.2", "topic": "Management software", "stem": "Criterion 3.2 says peripheral management software may be supplied:", "feedback": "Two named sources. Knowing what the NOS already gives you often saves buying a third-party tool you do not need.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.2 of this unit."], "kind": "mc", "options": ["As part of the network operating system, or by third parties", "By the device vendor only", "By the network operating system only", "By the organisation's own development team, working from the vendor's published documentation"], "answer": 0}, {"id": "b4b9bea53d", "unit": "ITINET1753B", "element": 3, "pc": "3.3", "topic": "Templates", "stem": "Criterion 3.3 requires templates to be created for use on the network. What is the point of a peripheral template?", "feedback": "Templates make the twentieth installation identical to the first — which is what makes the estate supportable.", "hints": ["Think about the second and third device of the same model.", "Re-read performance criterion 3.3 of this unit."], "kind": "mc", "options": ["A standard configuration that can be applied to new devices without rebuilding the settings each time", "A blank document users can print to test the device", "A record of the device's current settings, kept with the documentation so it can be rebuilt when it is replaced", "A form for users to request access to the device"], "answer": 0}, {"id": "3d51379f5e", "unit": "ITINET1753B", "element": 3, "pc": "3.4", "topic": "Settings", "stem": "Criterion 3.4 names THREE things to be created by configuring settings on the network. Which are they?", "feedback": "Maintenance schedules, usage logs and cost centre usage statistics — all three are named in criterion 3.4.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.4 of this unit."], "kind": "ms", "options": ["Maintenance schedules", "Usage logs", "Cost centre usage statistics", "Access control lists", "Firmware update schedules"], "answers": [0, 1, 2]}, {"id": "3987400e99", "unit": "ITINET1753B", "element": 3, "pc": "3.4", "topic": "Settings", "stem": "Why does criterion 3.4 ask for cost centre usage statistics?", "feedback": "Cost centre statistics exist for recharging and budgeting. They also tend to reduce printing simply by making it visible.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.4 of this unit."], "kind": "mc", "options": ["So that printing costs can be attributed to the department that incurred them", "So that the busiest device can be identified and scheduled for replacement first", "So that users who print too much can be disciplined", "So that consumable orders can be placed automatically"], "answer": 0}, {"id": "eaf5d727e8", "unit": "ITINET1753B", "element": 3, "pc": "3.5", "topic": "User support", "stem": "Criterion 3.5 requires you to demonstrate to the user the methods for using peripheral services from:", "feedback": "The demonstration happens where the user actually works. Showing them the admin console teaches them nothing they can use.", "hints": ["Where does the user sit?", "Re-read performance criterion 3.5 of this unit."], "kind": "mc", "options": ["Their application or workstation", "The management console", "The device's own control panel", "The organisation's user documentation"], "answer": 0}, {"id": "9619252a70", "unit": "ITINET1753B", "element": 3, "pc": "3.5", "topic": "User support", "stem": "Under criterion 3.5, sending the user a link to the vendor manual counts as demonstrating the method.", "feedback": "The criterion says \"demonstrate to the user\". A manual is a reference, not a demonstration.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "819305dab1", "unit": "ITINET1753B", "element": 3, "pc": "3.1", "topic": "Administration", "stem": "Match each administration task to the criterion in Element 3 that requires it.", "feedback": "Element 3 is the running of the service, as distinct from installing it (Element 1) or fixing it (Element 4).", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 3.1."], "kind": "match", "left": ["Setting the payroll queue to print ahead of general jobs", "Using the NOS print management console", "Building a standard config to apply to the next six printers", "Turning on per-department page counting"], "right": ["Criterion 3.1 — assign priority to control queues", "Criterion 3.2 — use peripheral management software", "Criterion 3.3 — create templates for use on the network", "Criterion 3.4 — configure cost centre usage statistics"], "answer": [0, 1, 2, 3]}, {"id": "0cdefeec0b", "unit": "ITINET1753B", "element": 3, "pc": "3.4", "topic": "Administration", "stem": "", "feedback": "Schedules, logs, statistics — the three outputs named in criterion 3.4.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Configuring settings on the network can create maintenance "}, {"gap": 0}, {"t": ", usage "}, {"gap": 1}, {"t": ", and cost centre usage "}, {"gap": 2}, {"t": "."}], "pool": ["schedules", "logs", "statistics", "policies", "reports", "templates", "alerts"], "answer": [0, 1, 2]}, {"id": "f16bf072f8", "unit": "ITINET1753B", "element": 3, "pc": "3.1", "topic": "Priority", "stem": "The payroll run and a 400-page draft manual are queued to the same printer at the same time. What does criterion 3.1 let you do?", "feedback": "This is what queue priority is for. The other options work, but they cost somebody their job or your time, every time it happens.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.1 of this unit."], "kind": "mc", "options": ["Give the payroll queue a higher priority so it prints first", "Cancel the draft manual and ask the user to resubmit it later", "Move the payroll job to a different printer", "Split the manual into smaller jobs"], "answer": 0}, {"id": "a0c513306e", "unit": "ITINET1753B", "element": 3, "pc": "3.3", "topic": "Templates", "stem": "Templates under criterion 3.3 are created for use on the network, not on a single workstation.", "feedback": "The criterion says \"for use on the network\". A template that lives on one machine helps nobody else.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "0c77795fbf", "unit": "ITINET1753B", "element": 3, "pc": "3.5", "topic": "Support", "stem": "", "feedback": "Assign, use, create templates, demonstrate — criteria 3.1 to 3.5.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "Supporting a peripheral service: "}, {"gap": 0}, {"t": " priority on the queues, "}, {"gap": 1}, {"t": " the management software the NOS provides, create "}, {"gap": 2}, {"t": " for the next device, and "}, {"gap": 3}, {"t": " the method to the user at their own workstation."}], "pool": ["assign", "use", "templates", "demonstrate", "schedule", "replace", "document"], "answer": [0, 1, 2, 3]}, {"id": "53ddc15744", "unit": "ITINET1753B", "element": 3, "pc": "3.2", "topic": "Management software", "stem": "Criterion 3.2 allows management software to come from the network operating system or from one other source. What is that source called in the criterion? (Two words.)", "feedback": "The criterion reads \"supplied as part of the network operating system or by third parties\".", "hints": ["Spelling is forgiving here, but the answer has to be the right term.", "Re-read performance criterion 3.2 of this unit."], "kind": "sa", "accept": ["third parties", "third party", "third-parties", "third-party"], "show": "third parties"}, {"id": "1f77783d58", "unit": "ITINET1753B", "element": 4, "pc": "4.1", "topic": "Maintenance", "stem": "Criterion 4.1 requires a regular maintenance schedule to be established and followed, as recommended by:", "feedback": "The criterion names the manufacturer. They know the duty cycle and the service intervals; a schedule invented locally usually turns out to be either wasteful or too late.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 4.1 of this unit."], "kind": "mc", "options": ["The peripheral manufacturer", "The organisation's maintenance policy", "The service level agreement with the user", "The technician's own judgement of wear"], "answer": 0}, {"id": "1845663063", "unit": "ITINET1753B", "element": 4, "pc": "4.2", "topic": "Consumables", "stem": "Which of these does the range statement list as a consumable?", "feedback": "Consumables in the range statement are ink cartridges, toner cartridges, ribbons, floppy disks, CD-R and CD-RW. The others are components.", "hints": ["A consumable is used up by normal operation.", "Re-read performance criterion 4.2 of this unit."], "kind": "mc", "options": ["Toner cartridges", "Interface cards", "RAM upgrades", "CMOS battery"], "answer": 0}, {"id": "6e0238eca5", "unit": "ITINET1753B", "element": 4, "pc": "4.2", "topic": "Components", "stem": "Which THREE does the range statement list as components?", "feedback": "Components are motherboards, CMOS battery, CPU, CD and DVD drives, interface cards, drives, fax/modem cards, RAM upgrades and CPU upgrades. Toner and ribbons are consumables.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 4.2 of this unit."], "kind": "ms", "options": ["Motherboards", "CMOS battery", "Interface cards", "Toner cartridges", "Ribbons"], "answers": [0, 1, 2]}, {"id": "79351a31a5", "unit": "ITINET1753B", "element": 4, "pc": "4.3", "topic": "Faults", "stem": "Criterion 4.3 covers fixing peripheral mishaps and malfunctions. Which is a mishap rather than a malfunction?", "feedback": "A mishap is something that went wrong in use; a malfunction is the device itself failing. Criterion 4.3 covers both, and telling them apart is what stops you ordering parts for a jam.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 4.3 of this unit."], "kind": "mc", "options": ["A paper jam caused by a sheet loaded crookedly", "A fuser that has failed and needs replacing", "A print queue that will not clear after a driver update", "A scanner that returns blank pages after a firmware change"], "answer": 0}, {"id": "8932e33f24", "unit": "ITINET1753B", "element": 4, "pc": "4.4", "topic": "Monitoring", "stem": "Criterion 4.4 requires peripheral usage and traffic to be monitored, and:", "feedback": "The criterion ends in a recommendation. Element 4 is where evidence about load turns into a case for buying another device.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 4.4 of this unit."], "kind": "mc", "options": ["Additional peripherals to be recommended if needed", "Under-used peripherals to be removed", "Usage to be reported to the cost centre monthly", "Traffic to be balanced across available devices"], "answer": 0}, {"id": "4bc004a6cb", "unit": "ITINET1753B", "element": 4, "pc": "4.4", "topic": "Monitoring", "stem": "One printer handles 78% of all pages on a floor with three devices, and users queue at it daily. Under criterion 4.4 the right response is:", "feedback": "The monitoring has done its job; the criterion asks for the recommendation. The other three manage the symptom and leave the shortfall in place.", "hints": ["The criterion names what monitoring is supposed to produce.", "Re-read performance criterion 4.4 of this unit."], "kind": "mc", "options": ["Recommend an additional device, with the usage figures as the evidence", "Redirect users to the quieter devices by policy", "Increase the maintenance frequency on the busy device to reduce breakdowns", "Raise the priority of the queue on the busy device"], "answer": 0}, {"id": "03c1ac67b8", "unit": "ITINET1753B", "element": 4, "pc": "4.5", "topic": "Failures", "stem": "Criterion 4.5 covers failures of peripheral services or devices. What is the difference?", "feedback": "The criterion names both because a perfectly healthy printer is useless if the queue is stuck — and the fix is in a different place.", "hints": ["One of these you can fix without touching the device.", "Re-read performance criterion 4.5 of this unit."], "kind": "mc", "options": ["A device failure is the hardware; a service failure is the spooler, queue or driver that makes the device usable", "A device failure is permanent; a service failure is temporary", "A device failure affects one user; a service failure affects everybody", "A device failure is the vendor's responsibility; a service failure is yours"], "answer": 0}, {"id": "e65f876fe7", "unit": "ITINET1753B", "element": 4, "pc": "4.1", "topic": "Maintenance", "stem": "Criterion 4.1 requires the maintenance schedule to be both established and followed.", "feedback": "Both verbs are in the criterion. A schedule on paper that nobody works to does not meet it.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "35ad35add0", "unit": "ITINET1753B", "element": 4, "pc": "4.3", "topic": "Faults", "stem": "Match each symptom to where the fault most likely sits.", "feedback": "Criteria 4.3 and 4.5 together. Which users are affected tells you where to look before you touch anything.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 4.3."], "kind": "match", "left": ["Every user on the floor sees jobs stuck in the queue", "Pages come out streaked down one side", "One user cannot print but everyone else can", "The device reports a hardware error on its own panel"], "right": ["The print service or spooler", "A consumable at the end of its life", "That workstation's configuration or permissions", "The device itself"], "answer": [0, 1, 2, 3]}, {"id": "3aa73c10a1", "unit": "ITINET1753B", "element": 4, "pc": "4.2", "topic": "Maintenance", "stem": "", "feedback": "Maintenance, consumables, malfunctions, additional — criteria 4.1 to 4.4.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Element 4 covers four things: following a "}, {"gap": 0}, {"t": " schedule set by the manufacturer, replacing "}, {"gap": 1}, {"t": " and components when required, fixing mishaps and "}, {"gap": 2}, {"t": ", and monitoring usage to recommend "}, {"gap": 3}, {"t": " peripherals if needed."}], "pool": ["maintenance", "consumables", "malfunctions", "additional", "installation", "upgrades", "templates", "replacement"], "answer": [0, 1, 2, 3]}, {"id": "de0c3d437c", "unit": "ITINET1753B", "element": 4, "pc": "4.4", "topic": "Monitoring", "stem": "", "feedback": "Element 3 configures the logging; Element 4 reads it and acts. That is why the two elements are worth studying together.", "hints": ["Each gap is marked separately — a wrong one does not cost you the others."], "kind": "cloze", "parts": [{"t": "Usage logs show one device taking most of the load. Criterion 4.4 requires you to monitor usage and "}, {"gap": {"type": "mc", "options": ["recommend additional peripherals if needed", "replace the device with a faster model", "restrict heavy users", "move the device to a quieter area"], "answers": [0], "accept": ["recommend additional peripherals if needed"], "wild": false}}, {"t": ". The evidence for that recommendation comes from the "}, {"gap": {"type": "mc", "options": ["usage logs configured under criterion 3.4", "user complaints", "vendor report", "maintenance schedule"], "answers": [0], "accept": ["usage logs configured under criterion 3.4"], "wild": false}}, {"t": "."}]}, {"id": "dbc94df077", "unit": "ITINET1753B", "element": 4, "pc": "4.5", "topic": "Failures", "stem": "", "feedback": "Narrowing by scope before you touch anything is what criteria 4.3 and 4.5 reward. Guessing costs a trip to the floor.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "When a networked printer stops working, check in this order: is the "}, {"gap": 0}, {"t": " itself reporting an error, is the "}, {"gap": 1}, {"t": " holding jobs, does the problem affect "}, {"gap": 2}, {"t": " user or everyone, and has a "}, {"gap": 3}, {"t": " run out."}], "pool": ["device", "queue", "one", "consumable", "vendor", "cable", "template"], "answer": [0, 1, 2, 3]}, {"id": "1d5fa2cbc8", "unit": "ITINET1753B", "element": 4, "pc": "4.2", "topic": "Consumables", "stem": "Criterion 4.2 requires consumables and components to be replaced:", "feedback": "The criterion says \"when required\", which the maintenance schedule under 4.1 and the monitoring under 4.4 are there to tell you.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 4.2 of this unit."], "kind": "mc", "options": ["When required", "At every scheduled maintenance visit", "Before they are completely exhausted", "When the user reports a fall in quality"], "answer": 0}]}, {"code": "ITINET1483B", "title": "Provide network systems administration", "questions": [{"id": "89a778a3b1", "unit": "ITINET1483B", "element": 1, "pc": "1.1", "topic": "Client access", "stem": "Criterion 1.1 requires three things to be provided to users, plus documentation. Which three?", "feedback": "Logons, passwords and applications file access — and the documentation is part of the criterion, not an afterthought.", "hints": ["Count the items in the criterion before the word \"and\".", "Re-read performance criterion 1.1 of this unit."], "kind": "mc", "options": ["Logons, passwords and applications file access", "Logons, hardware and network addresses", "Passwords, email accounts and printer access", "Usernames, security clearance and training"], "answer": 0}, {"id": "722bba8eac", "unit": "ITINET1483B", "element": 1, "pc": "1.1", "topic": "Documentation", "stem": "Criterion 1.1 requires the documentation to be prepared:", "feedback": "Organisational requirements set the format. The range statement lists ISO and IEC standards, audit trails, naming standards and version control among what documentation may follow.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.1 of this unit."], "kind": "mc", "options": ["In line with organisational requirements", "Before the account is created", "In the format the client prefers", "To the standard set by the vendor"], "answer": 0}, {"id": "8e80057f52", "unit": "ITINET1483B", "element": 1, "pc": "1.1", "topic": "Documentation", "stem": "Which THREE does the range statement list under what documentation may follow?", "feedback": "The range statement lists ISO/IEC standards, audit trails, naming standards, version control, project management templates and report writing, maintaining equipment inventory, client training and satisfaction reports.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.1 of this unit."], "kind": "ms", "options": ["Audit trails", "Naming standards", "Version control", "Vendor licence agreements", "Change advisory board minutes"], "answers": [0, 1, 2]}, {"id": "7fe77bcdec", "unit": "ITINET1483B", "element": 1, "pc": "1.2", "topic": "Access review", "stem": "Criterion 1.2 requires records of user accounts to be evaluated to determine two things. Which pair?", "feedback": "Privileges and usage. An account with the right privileges that nobody has used in a year is still a finding.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.2 of this unit."], "kind": "mc", "options": ["Access privileges and usage", "Access privileges and password strength", "Usage and licence compliance", "Account age and last logon"], "answer": 0}, {"id": "23638c3712", "unit": "ITINET1483B", "element": 1, "pc": "1.2", "topic": "Access review", "stem": "A review shows a technician who moved from the helpdesk to networking still holds both sets of privileges. What has the review found?", "feedback": "Privilege creep is exactly what criterion 1.2 exists to catch. The access was justified once; the question is whether it is justified now.", "hints": ["Both sets of access were granted legitimately. What changed?", "Re-read performance criterion 1.2 of this unit."], "kind": "mc", "options": ["Accumulated privilege that should be reduced to what the current role needs", "A documentation error, since the record does not match the role", "An acceptable arrangement, since both roles are legitimate", "A licensing problem, since two roles consume two licences"], "answer": 0}, {"id": "08b1e1135f", "unit": "ITINET1483B", "element": 1, "pc": "1.3", "topic": "System integrity", "stem": "Criterion 1.3 requires action to be taken to ensure the maintenance of:", "feedback": "Integrity and security. Element 3 covers performance separately.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.3 of this unit."], "kind": "mc", "options": ["System integrity and security", "System availability and performance", "Data accuracy and completeness", "Service levels and response times"], "answer": 0}, {"id": "36fdccecfe", "unit": "ITINET1483B", "element": 1, "pc": "1.1", "topic": "Client access", "stem": "Under this unit, a \"user\" may be a third party outside the organisation.", "feedback": "The range statement defines user as a person within a department, a department within the organisation, or a third party.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "d522997a2d", "unit": "ITINET1483B", "element": 1, "pc": "1.1", "topic": "Client access", "stem": "A new starter needs access on their first day. Which order satisfies criterion 1.1?", "feedback": "Copying a predecessor carries their accumulated privilege across; granting everything and pruning later rarely gets pruned. The criterion pairs provision with documentation for exactly this reason.", "hints": ["Two of these create the privilege problem that criterion 1.2 then has to find.", "Re-read performance criterion 1.1 of this unit."], "kind": "mc", "options": ["Confirm what access the role requires, create the account, then record what was granted", "Create the account with the same access as their predecessor, then adjust it later", "Create the account with full access so the person is not blocked, then reduce it", "Wait for the documentation to be approved before creating the account"], "answer": 0}, {"id": "01df621fe0", "unit": "ITINET1483B", "element": 1, "pc": "1.3", "topic": "System integrity", "stem": "Criterion 1.3 is satisfied by identifying a threat to system integrity and reporting it.", "feedback": "The criterion says \"take necessary action\". Reporting may be part of the action, but identification on its own is not enough.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "2a7df587d6", "unit": "ITINET1483B", "element": 1, "pc": "1.1", "topic": "Client access", "stem": "Match each account task to what it establishes.", "feedback": "Criterion 1.1 in four parts. Identity, proof, permission, record — and the record is what makes criterion 1.2 possible at all.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 1.1."], "kind": "match", "left": ["Issuing a logon", "Issuing a password", "Granting applications file access", "Preparing the documentation"], "right": ["Who the person is on the system", "That the person is who the logon claims", "What the person may reach once inside", "A record that can be audited later"], "answer": [0, 1, 2, 3]}, {"id": "5666992cc8", "unit": "ITINET1483B", "element": 1, "pc": "1.1", "topic": "Client access", "stem": "", "feedback": "Logons, documentation, organisational. Note \"organisational\", not \"legislative\" — this unit sets the boundary internally.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Criterion 1.1 requires you to provide "}, {"gap": 0}, {"t": ", passwords and applications file access to users, and to prepare "}, {"gap": 1}, {"t": " in line with "}, {"gap": 2}, {"t": " requirements."}], "pool": ["logons", "documentation", "organisational", "licences", "training", "reports", "legislative"], "answer": [0, 1, 2]}, {"id": "6a67863ce4", "unit": "ITINET1483B", "element": 1, "pc": "1.1", "topic": "Documentation", "stem": "Why does the range statement list \"audit trails\" as something documentation may follow?", "feedback": "An audit trail turns a set of decisions into something that can be checked afterwards. Without it, criterion 1.2 has nothing to evaluate.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.1 of this unit."], "kind": "mc", "options": ["Because a record of who was granted what, and when, is what makes later review and investigation possible", "Because auditors require documentation in a specific format", "Because audit trails are generated automatically and replace the need for any separate documentation to be kept", "Because auditors will not accept any other form of record"], "answer": 0}, {"id": "2208b5cffe", "unit": "ITINET1483B", "element": 1, "pc": "1.2", "topic": "Access review", "stem": "Criterion 1.2 asks you to evaluate records of user accounts to determine access privileges and one other thing. What is it? (One word.)", "feedback": "The criterion reads \"to determine access privileges and usage\".", "hints": ["Spelling is forgiving here, but the answer has to be the right term.", "Re-read performance criterion 1.2 of this unit."], "kind": "sa", "accept": ["usage"], "show": "usage"}, {"id": "3e47cabe3a", "unit": "ITINET1483B", "element": 1, "pc": "1.3", "topic": "Client access", "stem": "", "feedback": "Provide, document, evaluate, act — criteria 1.1 to 1.3.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "Element 1 in sequence: "}, {"gap": 0}, {"t": " logons, passwords and file access; "}, {"gap": 1}, {"t": " what was granted; "}, {"gap": 2}, {"t": " the account records for privileges and usage; and take action to maintain system "}, {"gap": 3}, {"t": " and security."}], "pool": ["provide", "document", "evaluate", "integrity", "restrict", "archive", "audit"], "answer": [0, 1, 2, 3]}, {"id": "d818b095d2", "unit": "ITINET1483B", "element": 1, "pc": "1.3", "topic": "System integrity", "stem": "Which action most directly maintains system integrity, in the sense of criterion 1.3?", "feedback": "The others improve recovery and availability. A live account with no owner is a hole in the system's integrity, and closing it is squarely within this element.", "hints": ["Three of these are about the system surviving. One is about who can get into it.", "Re-read performance criterion 1.3 of this unit."], "kind": "mc", "options": ["Disabling accounts belonging to people who have left the organisation", "Increasing the frequency of full backups", "Upgrading the network switches to a faster model", "Adding a second internet connection so the site stays online during an outage"], "answer": 0}, {"id": "d042e34cac", "unit": "ITINET1483B", "element": 2, "pc": "2.1", "topic": "Disaster recovery", "stem": "Criterion 2.1 requires you to do what with the organisation's disaster recovery plan?", "feedback": "Input. At this level you contribute what you know about the network; ownership of the plan sits above you.", "hints": ["Note the verb. This unit is careful about how far your authority runs.", "Re-read performance criterion 2.1 of this unit."], "kind": "mc", "options": ["Provide input for it", "Write it", "Approve it", "Test it at least once every year"], "answer": 0}, {"id": "321923dbc4", "unit": "ITINET1483B", "element": 2, "pc": "2.1", "topic": "Disaster recovery", "stem": "What input is a network systems administrator best placed to give to a disaster recovery plan?", "feedback": "You know the dependencies and the restore times because you run the system. Priority order and budget are business decisions made above this role.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.1 of this unit."], "kind": "mc", "options": ["Which systems depend on which, and how long each takes to restore", "The budget available for recovery equipment", "Which departments should be recovered first", "The legal obligations the organisation must meet after an incident"], "answer": 0}, {"id": "46589cf201", "unit": "ITINET1483B", "element": 2, "pc": "2.2", "topic": "Dissemination", "stem": "Criterion 2.2 requires the disaster recovery plan to be disseminated to users:", "feedback": "The criterion says \"as required\" — which leaves the scope to the plan itself rather than fixing it in advance.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.2 of this unit."], "kind": "mc", "options": ["As required", "In full, to every user", "Once it has been approved by management", "Only to users with a role in the recovery"], "answer": 0}, {"id": "a1937cb1f2", "unit": "ITINET1483B", "element": 2, "pc": "2.2", "topic": "Dissemination", "stem": "A disaster recovery plan that has never been disseminated to any of the users with a role in the recovery fails Element 2.", "feedback": "Criterion 2.2 requires dissemination as required. \"As required\" narrows who gets it; it does not make the dissemination optional.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "dc332fa9bd", "unit": "ITINET1483B", "element": 2, "pc": "2.2", "topic": "Disaster recovery", "stem": "Why does criterion 2.2 make dissemination a separate criterion from providing input?", "feedback": "Contributing to a plan and making sure it reaches people are genuinely different acts, and the second is the one most often skipped.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.2 of this unit."], "kind": "mc", "options": ["Because a plan only works if the people who must act on it know what it says before the incident", "Because the two tasks are done by different people", "Because dissemination requires management approval", "Because the plan often changes between drafting and publication, so only the final version is worth sharing"], "answer": 0}, {"id": "74fdfef6b6", "unit": "ITINET1483B", "element": 2, "pc": "2.1", "topic": "Systems", "stem": "Which THREE does the range statement list under \"system\"?", "feedback": "The range statement lists network, application, software, business, computers, financial system, management system and information system.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.1 of this unit."], "kind": "ms", "options": ["Network", "Financial system", "Information system", "Disaster recovery plan", "Service level agreement"], "answers": [0, 1, 2]}, {"id": "803df5de58", "unit": "ITINET1483B", "element": 2, "pc": "2.1", "topic": "Disaster recovery", "stem": "Match each piece of disaster recovery information to who is best placed to supply it.", "feedback": "Criterion 2.1 asks for YOUR input. Knowing where your input stops is part of the competency.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 2.1."], "kind": "match", "left": ["How long a full server restore takes from tape", "Which business function must be running first", "What the recovery budget allows", "What the organisation must do by law"], "right": ["The network systems administrator", "Management", "Finance", "Whoever advises on legal obligations"], "answer": [0, 1, 2, 3]}, {"id": "3a68b095c5", "unit": "ITINET1483B", "element": 2, "pc": "2.2", "topic": "Disaster recovery", "stem": "", "feedback": "Input, disseminate, as required — the whole of Element 2 in nine words.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Element 2 has two criteria: provide "}, {"gap": 0}, {"t": " for the organisation's disaster recovery plan, and "}, {"gap": 1}, {"t": " that plan to users "}, {"gap": 2}, {"t": " required."}], "pool": ["input", "disseminate", "as", "approval", "publish", "when", "draft"], "answer": [0, 1, 2]}, {"id": "2549bc62f0", "unit": "ITINET1483B", "element": 2, "pc": "2.2", "topic": "Dissemination", "stem": "Under criterion 2.2 the plan must be given to every user in the organisation.", "feedback": "The criterion says \"as required\". Who needs it is determined by the plan and their role in it.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "6a6dbe88d9", "unit": "ITINET1483B", "element": 2, "pc": "2.1", "topic": "Disaster recovery", "stem": "The underpinning knowledge for this unit lists disaster recovery policy alongside which related area?", "feedback": "The underpinning knowledge lists approaches to backup and restoring computer data, and disaster recovery policy, next to one another. Backup is the mechanism the plan depends on.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.1 of this unit."], "kind": "mc", "options": ["Approaches to backup and restoring computer data", "Network topology design", "Vendor contract negotiation and annual licence renewal", "Budget preparation"], "answer": 0}, {"id": "920c273d71", "unit": "ITINET1483B", "element": 2, "pc": "2.1", "topic": "Disaster recovery", "stem": "", "feedback": "Input, disseminate, technical detail. Criteria 2.1 and 2.2 in one sentence each.", "hints": ["Each gap is marked separately — a wrong one does not cost you the others."], "kind": "cloze", "parts": [{"t": "Under Element 2 the network administrator provides "}, {"gap": {"type": "mc", "options": ["input for", "approval of", "ownership of", "funding for"], "answers": [0], "accept": ["input for"], "wild": false}}, {"t": " the organisation's disaster recovery plan, and then "}, {"gap": {"type": "mc", "options": ["disseminates", "archives", "tests", "signs"], "answers": [0], "accept": ["disseminates"], "wild": false}}, {"t": " it to users as required. The part you are best placed to supply is "}, {"gap": {"type": "mc", "options": ["technical restore times and dependencies", "the order in which departments recover", "the recovery budget", "the legal obligations"], "answers": [0], "accept": ["technical restore times and dependencies"], "wild": false}}, {"t": "."}]}, {"id": "842a57f598", "unit": "ITINET1483B", "element": 3, "pc": "3.1", "topic": "Diagnostics", "stem": "Criterion 3.1 requires diagnostic tests to be performed. Which tests?", "feedback": "The criterion ties the tests to the administration task, not to a fixed list. What you run depends on what you are trying to find out.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.1 of this unit."], "kind": "mc", "options": ["Those associated with administering the network or system", "Those recommended by the hardware vendor", "Those specified in the service level agreement", "Those that can be run without interrupting users"], "answer": 0}, {"id": "40c0e1e9d9", "unit": "ITINET1483B", "element": 3, "pc": "3.2", "topic": "Diagnostics", "stem": "Criterion 3.2 requires you to do two things with diagnostic information. Which pair?", "feedback": "Analyse and respond. A diagnostic run whose output nobody acts on has told you nothing you have used.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.2 of this unit."], "kind": "mc", "options": ["Analyse it, and respond to it", "Record it, and report it", "Analyse it, and archive it", "Interpret it, and escalate it"], "answer": 0}, {"id": "699452a555", "unit": "ITINET1483B", "element": 3, "pc": "3.2", "topic": "Diagnostics", "stem": "A diagnostic shows 12% packet loss on one segment at peak. What does criterion 3.2 require next?", "feedback": "Confirming and recording are reasonable steps, but the criterion says analyse AND respond. Only one of these options responds.", "hints": ["Three of these stop short of doing anything about it.", "Re-read performance criterion 3.2 of this unit."], "kind": "mc", "options": ["Work out what is causing it and act on the cause", "Record the figure in the monitoring log for the week", "Report the figure to the service desk", "Repeat the test to confirm the figure"], "answer": 0}, {"id": "d0c4b66dc9", "unit": "ITINET1483B", "element": 3, "pc": "3.3", "topic": "Software usage", "stem": "Criterion 3.3 requires software usage to be monitored, including:", "feedback": "The criterion names inappropriate or illegal use specifically. Licence records are the neighbouring unit, ITIDAT1403B.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.3 of this unit."], "kind": "mc", "options": ["Inappropriate or illegal use", "Licence expiry dates", "Usage against the software budget", "Version currency across the estate"], "answer": 0}, {"id": "8ac5e62601", "unit": "ITINET1483B", "element": 3, "pc": "3.4", "topic": "Software usage", "stem": "Criterion 3.4 requires illegal software to be:", "feedback": "This unit says delete. Note that ITIDAT1403B criterion 2.4 says REPORT illegal software to the appropriate person — the two units divide the task between them.", "hints": ["Be careful: a neighbouring unit in this cluster gives a different verb for this.", "Re-read performance criterion 3.4 of this unit."], "kind": "mc", "options": ["Deleted from the system", "Reported to the appropriate person", "Quarantined until the licence is verified", "Blocked from executing"], "answer": 0}, {"id": "bf1c1b2086", "unit": "ITINET1483B", "element": 3, "pc": "3.4", "topic": "Software usage", "stem": "Criterion 3.4 of this unit and criterion 2.4 of ITIDAT1403B require the same action when illegal software is found.", "feedback": "ITINET1483B 3.4 says delete it from the system; ITIDAT1403B 2.4 says report it to the appropriate person. In practice you do both, and in assessment you must cite the right one.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "eb395968a0", "unit": "ITINET1483B", "element": 3, "pc": "3.5", "topic": "Performance", "stem": "Criterion 3.5 requires monitoring of hardware response time and:", "feedback": "Response time is named as one example among performance indicators. The criterion deliberately leaves the rest open.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.5 of this unit."], "kind": "mc", "options": ["Other performance indicators", "Other hardware faults", "Other software response times", "Other user complaints"], "answer": 0}, {"id": "328416cc8c", "unit": "ITINET1483B", "element": 3, "pc": "3.5", "topic": "Hardware", "stem": "Which THREE does the range statement list under hardware?", "feedback": "The range statement lists workstations and personal computers, modems or other connectivity devices, and servers. Peripherals are the subject of ITINET1753B instead.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.5 of this unit."], "kind": "ms", "options": ["Workstations, personal computers", "Servers", "Modems or other connectivity devices", "Printers and scanners", "Uninterruptible power supplies"], "answers": [0, 1, 2]}, {"id": "113932700a", "unit": "ITINET1483B", "element": 3, "pc": "3.6", "topic": "Efficiency", "stem": "Criterion 3.6 requires methods for improving network and systems efficiency to be identified and actioned according to:", "feedback": "Organisational guidelines. The range statement lists what those cover — email and internet use, downloading, communication methods, financial control mechanisms and more.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.6 of this unit."], "kind": "mc", "options": ["Organisational guidelines", "Vendor recommendations", "Industry benchmarks", "The service level agreement"], "answer": 0}, {"id": "ec4468073b", "unit": "ITINET1483B", "element": 3, "pc": "3.6", "topic": "Efficiency", "stem": "Note the wording of criterion 3.6: methods are to be \"identified and actioned\". What does the second word add?", "feedback": "Several criteria across this cluster pair a finding with an action, and the second half is where candidates most often fall short.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.6 of this unit."], "kind": "mc", "options": ["That finding an improvement is not enough — it has to be carried out", "That the improvement must be approved before being carried out", "That the improvement must be documented", "That the improvement must be measured afterwards"], "answer": 0}, {"id": "e01e6dd328", "unit": "ITINET1483B", "element": 3, "pc": "3.6", "topic": "Org guidelines", "stem": "Which THREE does the range statement list under organisational guidelines?", "feedback": "Organisational guidelines may include personal use of email and internet access, content of emails, downloading information and accessing particular websites, opening mail with attachments, virus risk, dispute resolution, document procedures and templates, communication methods and financial control mechanisms.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.6 of this unit."], "kind": "ms", "options": ["Personal use of emails and internet access", "Content of emails", "Financial control mechanisms", "Network addressing scheme", "Backup retention period"], "answers": [0, 1, 2]}, {"id": "799add73f0", "unit": "ITINET1483B", "element": 3, "pc": "3.1", "topic": "Diagnostics", "stem": "Diagnostic tests under criterion 3.1 are run only in response to a reported fault.", "feedback": "The criterion associates them with administering the network — which includes routine testing. Element 3 is titled \"Monitor network performance\", and monitoring is continuous.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "40dfd74867", "unit": "ITINET1483B", "element": 3, "pc": "3.5", "topic": "Monitoring", "stem": "Match each observation to what it most likely indicates.", "feedback": "Criterion 3.5 asks for monitoring; criterion 3.2 asks you to analyse and respond. The shape of the pattern is what points you at the cause.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 3.5."], "kind": "match", "left": ["Response time rising steadily over six weeks", "Response time spiking at the same hour each day", "One workstation slow while all others are fine", "Everything slow immediately after a change"], "right": ["A capacity problem building up", "A scheduled job competing for resources", "A local problem on that machine", "The change itself"], "answer": [0, 1, 2, 3]}, {"id": "551a64d1a1", "unit": "ITINET1483B", "element": 3, "pc": "3.3", "topic": "Monitoring", "stem": "", "feedback": "Tests, respond, delete, response — criteria 3.1, 3.2, 3.4 and 3.5. Note that this unit says DELETE where ITIDAT1403B says report.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Element 3 requires you to perform diagnostic "}, {"gap": 0}, {"t": ", analyse and "}, {"gap": 1}, {"t": " to the information, monitor software usage including inappropriate or illegal use, "}, {"gap": 2}, {"t": " illegal software from the system, and monitor hardware "}, {"gap": 3}, {"t": " time."}], "pool": ["tests", "respond", "delete", "response", "reports", "archive", "report", "processing"], "answer": [0, 1, 2, 3]}, {"id": "a7ecddf893", "unit": "ITINET1483B", "element": 3, "pc": "3.6", "topic": "Efficiency", "stem": "", "feedback": "Analyse, identify, action, check. Criterion 3.6 covers the middle two; the check is what tells you whether it worked.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "Turning monitoring into improvement: "}, {"gap": 0}, {"t": " the diagnostic data, "}, {"gap": 1}, {"t": " a method that would improve efficiency, "}, {"gap": 2}, {"t": " it according to organisational guidelines, and "}, {"gap": 3}, {"t": " whether the indicators moved."}], "pool": ["analyse", "identify", "action", "check", "archive", "escalate", "report"], "answer": [0, 1, 2, 3]}, {"id": "4a5628eecf", "unit": "ITINET1483B", "element": 3, "pc": "3.3", "topic": "Software usage", "stem": "Monitoring shows a user running a peer-to-peer file sharing client during work hours. Under Element 3 this is:", "feedback": "Criterion 3.3 names inappropriate use specifically, and the range statement for organisational guidelines covers downloading and personal internet use.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.3 of this unit."], "kind": "mc", "options": ["Inappropriate use, which criterion 3.3 requires to be monitored and acted on", "A performance problem, to be handled under criterion 3.5 on hardware response time", "A security incident, outside the scope of this unit", "A licensing matter, to be handled under ITIDAT1403B"], "answer": 0}, {"id": "172666b248", "unit": "ITINET1483B", "element": 3, "pc": "3.1", "topic": "Diagnostics", "stem": "Which is a diagnostic test associated with administering the network, in the sense of criterion 3.1?", "feedback": "The others are all legitimate administration tasks, but they belong to Elements 1 and 2 and to ITIDAT1403B. A diagnostic test measures the network as it runs.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.1 of this unit."], "kind": "mc", "options": ["Checking round-trip time and packet loss between two segments", "Reviewing the disaster recovery plan for accuracy and currency", "Auditing user accounts for unused privileges", "Confirming the backup completed overnight"], "answer": 0}, {"id": "57b269cca2", "unit": "ITINET1483B", "element": 3, "pc": "3.6", "topic": "Efficiency", "stem": "An efficiency improvement that would breach the organisation's guidelines should still be actioned if the gain is large enough.", "feedback": "Criterion 3.6 requires improvements to be actioned ACCORDING TO organisational guidelines. The right move is to recommend a change to the guideline.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "b20c220ea1", "unit": "ITINET1483B", "element": 3, "pc": "3.1", "topic": "Critical aspects", "stem": "The evidence guide lists five abilities for this unit. Which is one of them?", "feedback": "The five are: sustain network operation and perform diagnostics; contribute to a disaster recovery plan and provide an optimised network; improve efficiency according to guidelines; provide appropriate access; and maintain, limit or enhance user access according to , "kind": "sa", "accept": ["delete"], "show": "delete"}, {"id": "87823c6dfa", "unit": "ITINET1483B", "element": 3, "pc": "3.3", "topic": "Software usage", "stem": "", "feedback": "Monitor, confirm, delete, record. Confirming first matters — deleting software that turns out to be licensed creates a different problem.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "Handling unlicensed software found by monitoring: "}, {"gap": 0}, {"t": " the usage, "}, {"gap": 1}, {"t": " that the software is not licensed, "}, {"gap": 2}, {"t": " it from the system under criterion 3.4, and "}, {"gap": 3}, {"t": " what was found and removed."}], "pool": ["monitor", "confirm", "delete", "record", "ignore", "quarantine", "purchase"], "answer": [0, 1, 2, 3]}]}, {"code": "ITIDAT1403B", "title": "Provide basic system administration", "questions": [{"id": "6b6e1854c8", "unit": "ITIDAT1403B", "element": 1, "pc": "1.1", "topic": "Access requirements", "stem": "Criterion 1.1 requires two things to be obtained from the client. Which pair?", "feedback": "Requirements say what they need to reach; clearance says how far they are permitted to go. Both come from the client, according to organisational requirements.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.1 of this unit."], "kind": "mc", "options": ["Access requirements and clearance levels", "Access requirements and job description", "Clearance levels and manager approval", "Username preferences and access requirements"], "answer": 0}, {"id": "0e0b68729e", "unit": "ITIDAT1403B", "element": 1, "pc": "1.2", "topic": "Issuing accounts", "stem": "Criterion 1.2 requires which details to be issued to the client?", "feedback": "Account and password under 1.2; the security documentation is separate, under criterion 1.3.", "hints": ["Two criteria here are about handing things over. This is the first.", "Re-read performance criterion 1.2 of this unit."], "kind": "mc", "options": ["Computer or network user account and password details", "User account details and security documentation", "Password details and clearance level", "User account details and access log"], "answer": 0}, {"id": "616efba250", "unit": "ITIDAT1403B", "element": 1, "pc": "1.3", "topic": "Security documentation", "stem": "Criterion 1.3 requires you to provide the client with:", "feedback": "Documentation and access together. Handing over access without telling the person the rules that come with it is half a job.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.3 of this unit."], "kind": "mc", "options": ["Security documentation and access", "Security documentation and training", "Access and a clearance certificate", "Documentation and a signed acceptance form"], "answer": 0}, {"id": "8f09ea9f71", "unit": "ITIDAT1403B", "element": 1, "pc": "1.4", "topic": "Recording", "stem": "Criterion 1.4 requires user account and security access details to be recorded for two reasons. Which pair?", "feedback": "Integrity now, auditing later. The record is what makes it possible to answer \"who had access to this, and when\" months afterwards.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.4 of this unit."], "kind": "mc", "options": ["To maintain system integrity and to assist later auditing", "To maintain system integrity and to support the helpdesk", "To assist later auditing and to recover forgotten passwords", "To support licence compliance and later auditing"], "answer": 0}, {"id": "dc550d3eb0", "unit": "ITIDAT1403B", "element": 1, "pc": "1.4", "topic": "Recording", "stem": "Recording a password alongside the account details is what criterion 1.4 requires.", "feedback": "The criterion requires user account and security ACCESS details to be recorded. A stored password defeats the integrity the criterion is meant to protect.", "hints": ["Read what the criterion says is recorded, and what it does not."], "kind": "tf", "answer": false}, {"id": "757f8026bc", "unit": "ITIDAT1403B", "element": 1, "pc": "1.1", "topic": "Client", "stem": "Which THREE does the range statement list as a client?", "feedback": "The range statement lists employee, external organisation, individual and internal department.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.1 of this unit."], "kind": "ms", "options": ["Employee", "External organisation", "Internal department", "Vendor support engineer", "Regulatory auditor"], "answers": [0, 1, 2]}, {"id": "54e03e54fe", "unit": "ITIDAT1403B", "element": 1, "pc": "1.1", "topic": "Access requirements", "stem": "A manager asks you to give a new analyst \"the same access as the rest of the team\". Under criterion 1.1 you should:", "feedback": "Copying carries across whatever the other person has accumulated. The criterion asks for requirements and clearance levels, which is a different question from \"what does Marcia have\".", "hints": ["What is wrong with the account you would be copying?", "Re-read performance criterion 1.1 of this unit."], "kind": "mc", "options": ["Ask what the role actually requires and what clearance level applies, rather than copying an existing account", "Copy an existing team member's account, since the manager has authorised it", "Grant the access and record that the manager requested it", "Grant read-only access first and expand it on request"], "answer": 0}, {"id": "c659af7c63", "unit": "ITIDAT1403B", "element": 1, "pc": "1.3", "topic": "Element 1", "stem": "Match each act to the criterion in Element 1 that requires it.", "feedback": "Ask, issue, inform, record. Element 1 is a single transaction broken into four assessable parts.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 1.3."], "kind": "match", "left": ["Asking the department head what clearance the role carries", "Handing the new starter their username and initial password", "Giving them the acceptable use policy with their account", "Entering the grant in the security access register"], "right": ["Criterion 1.1 — obtain access requirements and clearance", "Criterion 1.2 — issue account and password details", "Criterion 1.3 — provide security documentation and access", "Criterion 1.4 — record account and security access details"], "answer": [0, 1, 2, 3]}, {"id": "456ef3757f", "unit": "ITIDAT1403B", "element": 1, "pc": "1.4", "topic": "Element 1", "stem": "", "feedback": "Recorded, integrity, auditing — the three words that make this criterion assessable.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Criterion 1.4 requires user account and security access details to be "}, {"gap": 0}, {"t": " in order to maintain system "}, {"gap": 1}, {"t": " and to assist later "}, {"gap": 2}, {"t": "."}], "pool": ["recorded", "integrity", "auditing", "encrypted", "security", "recovery", "reporting"], "answer": [0, 1, 2]}, {"id": "4bd4bbfd09", "unit": "ITIDAT1403B", "element": 1, "pc": "1.1", "topic": "Access requirements", "stem": "Client access requirements must be obtained according to organisational requirements.", "feedback": "Criterion 1.1 ends with \"according to organisational requirements\" — the organisation, not the client, decides what the process looks like.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "745d547b76", "unit": "ITIDAT ge", "stem": "Why does criterion 3.3 pair labelling with storage?", "feedback": "Both halves have to be right on the day you need the restore. A shelf of unlabelled media is not a backup.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.3 of this unit."], "kind": "mc", "options": ["Because a backup you cannot identify is no more use than one you cannot find", "Because labels on backup media are required by data protection legislation in most jurisdictions", "Because the label records the retention period", "Because storage locations are assigned by label"], "answer": 0}, {"id": "b7f4a23f4d", "unit": "ITIDAT1403B", "element": 3, "pc": "3.4", "topic": "Records", "stem": "Criterion 3.4 requires you to:", "feedback": "The criterion reads \"Maintain record of backups.\" Restores are recorded separately, under criterion 4.3.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.4 of this unit."], "kind": "mc", "options": ["Maintain a record of backups", "Maintain a record of restores", "Maintain a record of backup failures", "Maintain a record of the backup schedule"], "answer": 0}, {"id": "6391323011", "unit": "ITIDAT1403B", "element": 3, "pc": "3.2", "topic": "Backups", "stem": "A backup that completed successfully but was never recorded still meets Element 3 in full.", "feedback": "Criterion 3.4 requires a record of backups. Without it you cannot show what exists or when it was taken.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "408d85da55", "unit": "ITIDAT1403B", "element": 3, "pc": "3.3", "topic": "Org requirements", "stem": "Which THREE does the range statement list under organisational requirements?", "feedback": "Organisational requirements may include availability of the system to be optimised,
