auditor checking compliance", "The person who will run the script"], "answer": 0}, {"id": "630dacd372", "unit": "ITINET0823B", "element": 5, "pc": "5.2", "topic": "User docs", "stem": "Criterion 5.2 requires user-level documentation. What should it contain?", "feedback": "User documentation is operational. Design decisions and source belong in the technical document under criterion 5.1.", "hints": ["What does somebody need who will never open the file?", "Re-read performance criterion 5.2 of this unit."], "kind": "mc", "options": ["How to run the script, what input it expects and what it produces", "The algorithm and the reasoning behind each design decision that was made", "The source code with comments", "The test results and known limitations"], "answer": 0}, {"id": "072c925a26", "unit": "ITINET0823B", "element": 5, "pc": "5.1", "topic": "Documentation", "stem": "Match each item to the document it belongs in.", "feedback": "This unit produces four kinds of written output, for four readers. Criteria 5.1 and 5.2 are the two standalone documents; the other two live inside the code and the test file.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 5.1."], "kind": "match", "left": ["The command to run the script and its arguments", "Why the retention period was set to 30 days", "A comment above a function explaining what it returns", "The test cases and the results they produced"], "right": ["User-level documentation, criterion 5.2", "Technical-level documentation, criterion 5.1", "Internal documentation, criterion 2.7", "The test record, criterion 4.1"], "answer": [0, 1, 2, 3]}, {"id": "54f60435b4", "unit": "ITINET0823B", "element": 5, "pc": "5.2", "topic": "Documentation", "stem": "A single document covering both the code internals and how to run the script satisfies Element 5.", "feedback": "Criteria 5.1 and 5.2 name technical-level and user-level documentation separately. They are written for different readers.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}]}]}</script>
<script>
(function(){
'use strict';
var DATA = JSON.parse(document.getElementById('data').textContent);
var KEY  = 'hcit-c2-practice-v1-m3';
var PAGE = 5;                       // questions per page
var app  = document.getElementById('app');

/* ------------------------------------------------------------ persistence */
function load(){
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ return {}; }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
}
var S = load();
S.answers = S.answers || {};        // qid -> {tries, correct, given}
S.place   = S.place   || {};        // section code -> page index

/* ------------------------------------------------------------------ utils */
function el(tag, cls, txt){
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (txt != null) n.textContent = txt;
  return n;
}
function shuffle(a, seed){
  var r = seed || 1, out = a.slice();
  for (var i = out.length - 1; i > 0; i--){
    r = (r * 1103515245 + 12345) & 0x7fffffff;
    var j = r % (i + 1), t = out[i]; out[i] = out[j]; out[j] = t;
  }
  return out;
}
function seedOf(id){
  var h = 0;
  for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) & 0x7fffffff;
  return h || 7;
}
function sectionStats(sec){
  var done = 0, right = 0;
  sec.questions.forEach(function(q){
    var a = S.answers[q.id];
    if (a && a.done){ done++; if (a.correct) right++; }
  });
  return { done: done, right: right, total: sec.questions.length };
}
var LETTERS = 'ABCDEFGH';

/* ------------------------------------------------------------------- home */
function renderHome(){
  document.getElementById('homeBtn').hidden = true;
  app.innerHTML = '';
  var head = el('div');
  head.appendChild(el('p', 'eyebrow', 'Cluster 2 · Manage Network Operation'));
  var h1 = el('h1', null, DATA.title); head.appendChild(h1);
  head.appendChild(el('p', 'lede', DATA.subtitle));
  app.appendChild(head);

  var grand = { done: 0, right: 0, total: 0 };
  var list = el('div', 'sectionlist');
  DATA.sections.forEach(function(sec, i){
    var st = sectionStats(sec);
    grand.done += st.done; grand.right += st.right; grand.total += st.total;
    var b = el('button', 'srow'); b.type = 'button';
    b.appendChild(el('span', 'snum', 'S' + (i + 1)));
    var mid = el('span'); mid.style.flex = '1'; mid.style.minWidth = '0';
    mid.appendChild(el('span', 'scode', sec.code));
    mid.appendChild(el('h2', null, sec.title));
    var pct = st.total ? Math.round(100 * st.done / st.total) : 0;
    mid.appendChild(el('div', 'smeta',
      st.done === 0 ? st.total + ' questions · not started'
      : st.done + ' of ' + st.total + ' answered · ' +
        (st.done ? Math.round(100 * st.right / st.done) : 0) + '% correct'));
    var bar = el('div', 'bar'); var fill = el('i');
    fill.style.width = pct + '%'; bar.appendChild(fill); mid.appendChild(bar);
    b.appendChild(mid);
    var p = el('span', 'pill' + (st.done === st.total ? ' done' : st.done ? ' part' : ''),
      st.done === st.total ? 'Complete' : st.done ? 'In progress' : 'Start');
    b.appendChild(p);
    b.onclick = function(){ openSection(i); };
    list.appendChild(b);
  });
  app.appendChild(list);

  var card = el('div', 'card');
  card.appendChild(el('h2', null, 'How this works'));
  var ul = el('ul');
  [ 'Four sections, fifty questions each. Stop at the end of any page and come '
    + 'back later — your place and your answers are kept on this computer.',
    'Every question gives you a hint on the first wrong try, so a wrong answer '
    + 'is worth something.',
    'After the second try you get the answer and the reason, with the '
    + 'performance criterion it comes from.',
    'Nothing is sent anywhere. This file works with no internet connection.'
  ].forEach(function(t){ ul.appendChild(el('li', null, t)); });
  card.appendChild(ul);
  if (grand.done){
    var act = el('div', 'actions');
    var reset = el('button', 'btn ghost', 'Clear all my answers'); reset.type = 'button';
    reset.onclick = function(){
      if (reset.dataset.armed){ S.answers = {}; S.place = {}; save(); renderHome(); return; }
      reset.dataset.armed = '1'; reset.textContent = 'Tap again to clear everything';
    };
    act.appendChild(reset); card.appendChild(act);
  }
  app.appendChild(card);
  document.getElementById('foot').textContent =
    grand.total + ' questions · ' + grand.done + ' answered · ' + DATA.programme;
  window.scrollTo(0, 0);
}

/* ---------------------------------------------------------------- section */
function openSection(si){
  var sec = DATA.sections[si];
  var page = S.place[sec.code] || 0;
  renderPage(si, page);
}

function renderPage(si, page){
  var sec = DATA.sections[si];
  var pages = Math.ceil(sec.questions.length / PAGE);
  page = Math.max(0, Math.min(page, pages - 1));
  S.place[sec.code] = page; save();
  document.getElementById('homeBtn').hidden = false;
  app.innerHTML = '';

  var head = el('div');
  head.appendChild(el('p', 'eyebrow', 'Section ' + (si + 1) + ' · ' + sec.code));
  head.appendChild(el('h1', null, sec.title));
  var st = sectionStats(sec);
  head.appendChild(el('p', 'lede',
    'Page ' + (page + 1) + ' of ' + pages + ' · ' + st.done + ' of ' + st.total +
    ' answered so far'));
  var bar = el('div', 'bar'); var fill = el('i');
  fill.style.width = Math.round(100 * st.done / st.total) + '%';
  bar.appendChild(fill); head.appendChild(bar);
  app.appendChild(head);

  var slice = sec.questions.slice(page * PAGE, page * PAGE + PAGE);
  slice.forEach(function(q, k){
    app.appendChild(renderQuestion(q, page * PAGE + k + 1, sec.questions.length));
  });

  var nav = el('div', 'actions');
  nav.style.marginTop = '20px';
  if (page > 0){
    var prev = el('button', 'btn ghost', '← Previous page'); prev.type = 'button';
    prev.onclick = function(){ renderPage(si, page - 1); window.scrollTo(0,0); };
    nav.appendChild(prev);
  }
  if (page < pages - 1){
    var next = el('button', 'btn', 'Next page →'); next.type = 'button';
    next.onclick = function(){ renderPage(si, page + 1); window.scrollTo(0,0); };
    nav.appendChild(next);
  } else {
    var fin = el('button', 'btn', 'Finish this section'); fin.type = 'button';
    fin.onclick = function(){ renderScore(si); };
    nav.appendChild(fin);
  }
  var pause = el('button', 'btn ghost', 'Stop here for now'); pause.type = 'button';
  pause.onclick = function(){ renderHome(); };
  nav.appendChild(pause);
  app.appendChild(nav);

  document.getElementById('foot').textContent =
    sec.code + ' · page ' + (page + 1) + ' of ' + pages +
    ' · your place is saved automatically';
}

/* --------------------------------------------------------------- question */
function renderQuestion(q, n, total){
  var card = el('div', 'card');
  var head = el('div', 'qhead');
  head.appendChild(el('span', null, 'Question ' + n + ' of ' + total));
  var tag = el('span');
  tag.appendChild(el('span', 'tagpc', 'Element ' + q.element + ' · PC ' + q.pc));
  head.appendChild(tag);
  card.appendChild(head);

  var state = S.answers[q.id] || { tries: 0, done: false, correct: false };
  var body = el('div');
  card.appendChild(body);
  var foot = el('div');
  card.appendChild(foot);

  var HOWTO = {
    ms:    'More than one answer is right — select every one that applies.',
    match: 'Pick the matching item for each row.',
    gap:   'Choose the right word for each gap. There are more options than gaps.',
    drag:  'Tap a word, then tap the gap you want it in. Tap a filled gap to '
         + 'empty it. There are more words than gaps.',
    cloze: 'Fill in every gap. Each one is marked separately.',
    num:   'Type the number. Units and commas are not needed.',
    sa:    'Type your answer. Spelling is forgiving; the term has to be right.'
  };
  var api = KINDS[q.kind](q, body, state);
  if (HOWTO[q.kind]){
    var tip = el('p', 'howto', HOWTO[q.kind]);
    var slotty = q.kind === 'gap' || q.kind === 'drag' || q.kind === 'cloze';
    body.insertBefore(tip, slotty ? body.firstChild : body.firstChild.nextSibling);
  }

  var act = el('div', 'actions');
  var check = el('button', 'btn', 'Check'); check.type = 'button';
  act.appendChild(check);
  foot.appendChild(act);

  function settle(correct){
    state.tries++;
    state.correct = correct;
    if (correct || state.tries >= 2) state.done = true;
    S.answers[q.id] = state; save();
    foot.innerHTML = '';
    if (correct){
      api.mark(true);
      var ok = el('div', 'note ok');
      ok.appendChild(el('b', null, 'Correct'));
      ok.appendChild(el('span', null, q.feedback));
      foot.appendChild(ok);
    } else if (state.tries === 1){
      var h = el('div', 'note hint');
      h.appendChild(el('b', null, 'Not yet — try once more'));
      h.appendChild(el('span', null, q.hints[0]));
      foot.appendChild(h);
      var again = el('div', 'actions');
      var b2 = el('button', 'btn', 'Check again'); b2.type = 'button';
      b2.onclick = function(){ settle(api.isCorrect()); };
      again.appendChild(b2);
      var reveal = el('button', 'btn ghost', 'Show me the answer');
      reveal.type = 'button';
      reveal.onclick = function(){ state.tries = 2; settle(false); };
      again.appendChild(reveal);
      foot.appendChild(again);
    } else {
      api.mark(false);
      var no = el('div', 'note no');
      no.appendChild(el('b', null, 'The answer'));
      no.appendChild(el('span', null, q.feedback));
      foot.appendChild(no);
      var hh = el('div', 'note');
      hh.appendChild(el('b', null, q.hints[1] ? 'Also worth knowing' : ''));
      hh.appendChild(el('span', null, q.hints[1] || ''));
      if (q.hints[1]) foot.appendChild(hh);
    }
  }
  check.onclick = function(){ if (api.answered()) settle(api.isCorrect()); };

  if (state.done){ settle(state.correct); }
  return card;
}

/* ------------------------------------------------------------ question kinds */
var KINDS = {};

function choiceList(q, host, opts, multi, getSel, setSel){
  var order = shuffle(opts.map(function(_, i){ return i; }), seedOf(q.id));
  var wrap = el('div', 'opts');
  var nodes = [];
  order.forEach(function(oi, pos){
    var b = el('button', 'opt'); b.type = 'button';
    b.appendChild(el('span', 'k', LETTERS[pos]));
    b.appendChild(el('span', null, opts[oi]));
    b.setAttribute('aria-pressed', 'false');
    b.dataset.i = oi;
    b.onclick = function(){
      if (b.disabled) return;
      if (multi){
        var on = b.getAttribute('aria-pressed') === 'true';
        b.setAttribute('aria-pressed', on ? 'false' : 'true');
      } else {
        nodes.forEach(function(x){ x.setAttribute('aria-pressed', 'false'); });
        b.setAttribute('aria-pressed', 'true');
      }
    };
    nodes.push(b);
    wrap.appendChild(b);
  });
  host.appendChild(wrap);
  return nodes;
}

KINDS.mc = function(q, host, state){
  host.appendChild(el('p', 'stem', q.stem));
  var nodes = choiceList(q, host, q.options, false);
  function picked(){
    return nodes.filter(function(n){ return n.getAttribute('aria-pressed') === 'true'; });
  }
  return {
    answered: function(){ return picked().length === 1; },
    isCorrect: function(){ return picked().length === 1 && +picked()[0].dataset.i === q.answer; },
    mark: function(){
      nodes.forEach(function(n){
        n.disabled = true;
        if (+n.dataset.i === q.answer) n.classList.add('right');
        else if (n.getAttribute('aria-pressed') === 'true') n.classList.add('wrong');
      });
    }
  };
};

KINDS.ms = function(q, host, state){
  host.appendChild(el('p', 'stem', q.stem));
  var nodes = choiceList(q, host, q.options, true);
  function picked(){
    return nodes.filter(function(n){ return n.getAttribute('aria-pressed') === 'true'; })
                .map(function(n){ return +n.dataset.i; }).sort();
  }
  return {
    answered: function(){ return picked().length > 0; },
    isCorrect: function(){
      var p = picked(), a = q.answers.slice().sort();
      return p.length === a.length && p.every(function(v, i){ return v === a[i]; });
    },
    mark: function(){
      nodes.forEach(function(n){
        n.disabled = true;
        var i = +n.dataset.i, sel = n.getAttribute('aria-pressed') === 'true';
        if (q.answers.indexOf(i) >= 0) n.classList.add('right');
        else if (sel) n.classList.add('wrong');
      });
    }
  };
};

KINDS.tf = function(q, host, state){
  host.appendChild(el('p', 'stem', q.stem));
  var nodes = choiceList(q, host, ['True', 'False'], false);
  function picked(){
    return nodes.filter(function(n){ return n.getAttribute('aria-pressed') === 'true'; });
  }
  var want = q.answer ? 0 : 1;
  return {
    answered: function(){ return picked().length === 1; },
    isCorrect: function(){ return picked().length === 1 && +picked()[0].dataset.i === want; },
    mark: function(){
      nodes.forEach(function(n){
        n.disabled = true;
        if (+n.dataset.i === want) n.classList.add('right');
        else if (n.getAttribute('aria-pressed') === 'true') n.classList.add('wrong');
      });
    }
  };
};

KINDS.match = function(q, host, state){
  host.appendChild(el('p', 'stem', q.stem));
  var grid = el('div', 'matchgrid');
  var order = shuffle(q.right.map(function(_, i){ return i; }), seedOf(q.id));
  var rows = [];
  q.left.forEach(function(lt, li){
    var row = el('div', 'mrow');
    row.appendChild(el('span', null, lt));
    var sel = document.createElement('select');
    var blank = document.createElement('option');
    blank.value = ''; blank.textContent = 'Choose…';
    sel.appendChild(blank);
    order.forEach(function(ri){
      var o = document.createElement('option');
      o.value = ri; o.textContent = q.right[ri];
      sel.appendChild(o);
    });
    row.appendChild(sel);
    grid.appendChild(row);
    rows.push({ row: row, sel: sel, want: q.answer[li] });
  });
  host.appendChild(grid);
  return {
    answered: function(){ return rows.every(function(r){ return r.sel.value !== ''; }); },
    isCorrect: function(){ return rows.every(function(r){ return +r.sel.value === r.want; }); },
    mark: function(){
      rows.forEach(function(r){
        r.sel.disabled = true;
        var ok = +r.sel.value === r.want;
        r.row.classList.add(ok ? 'right' : 'wrong');
        if (!ok) r.sel.value = r.want;
      });
    }
  };
};

KINDS.gap = function(q, host, state){
  var line = el('p', 'slotline');
  var slots = [];
  var order = shuffle(q.pool.map(function(_, i){ return i; }), seedOf(q.id));
  q.parts.forEach(function(p){
    if (p.t != null){ line.appendChild(document.createTextNode(p.t)); return; }
    var sel = document.createElement('select');
    sel.className = 'slot';
    var blank = document.createElement('option');
    blank.value = ''; blank.textContent = '— choose —';
    sel.appendChild(blank);
    order.forEach(function(pi){
      var o = document.createElement('option');
      o.value = pi; o.textContent = q.pool[pi];
      sel.appendChild(o);
    });
    line.appendChild(sel);
    slots.push({ sel: sel, want: q.answer[p.gap] });
  });
  host.appendChild(line);
  return {
    answered: function(){ return slots.every(function(s){ return s.sel.value !== ''; }); },
    isCorrect: function(){ return slots.every(function(s){ return +s.sel.value === s.want; }); },
    mark: function(){
      slots.forEach(function(s){
        s.sel.disabled = true;
        var ok = +s.sel.value === s.want;
        s.sel.classList.add(ok ? 'right' : 'wrong');
        if (!ok) s.sel.value = s.want;
      });
    }
  };
};

KINDS.drag = function(q, host, state){
  var line = el('p', 'slotline');
  var slots = [];
  q.parts.forEach(function(p){
    if (p.t != null){ line.appendChild(document.createTextNode(p.t)); return; }
    var b = el('button', 'dropslot', 'drop here'); b.type = 'button';
    line.appendChild(b);
    slots.push({ node: b, want: q.answer[p.gap], val: null });
  });
  host.appendChild(line);

  var bank = el('div', 'bank');
  var toks = [];
  shuffle(q.pool.map(function(_, i){ return i; }), seedOf(q.id)).forEach(function(pi){
    var t = el('button', 'tok', q.pool[pi]); t.type = 'button';
    t.setAttribute('aria-pressed', 'false');
    t.dataset.i = pi;
    toks.push(t); bank.appendChild(t);
  });
  host.appendChild(bank);

  var held = null;
  function clearHeld(){
    held = null;
    toks.forEach(function(t){ t.setAttribute('aria-pressed', 'false'); });
    slots.forEach(function(s){ s.node.classList.remove('active'); });
  }
  function refresh(){
    var used = slots.map(function(s){ return s.val; })
                    .filter(function(v){ return v != null; });
    toks.forEach(function(t){
      var on = used.indexOf(+t.dataset.i) >= 0;
      t.classList.toggle('used', on);
    });
  }
  toks.forEach(function(t){
    t.onclick = function(){
      if (t.disabled || t.classList.contains('used')) return;
      var was = t.getAttribute('aria-pressed') === 'true';
      clearHeld();
      if (!was){
        t.setAttribute('aria-pressed', 'true');
        held = +t.dataset.i;
        slots.forEach(function(s){ if (s.val == null) s.node.classList.add('active'); });
      }
    };
  });
  slots.forEach(function(s){
    s.node.onclick = function(){
      if (s.node.disabled) return;
      if (held == null){
        if (s.val != null){ s.val = null; s.node.textContent = 'drop here';
          s.node.classList.remove('filled'); refresh(); }
        return;
      }
      s.val = held;
      s.node.textContent = q.pool[held];
      s.node.classList.add('filled');
      clearHeld(); refresh();
    };
  });
  return {
    answered: function(){ return slots.every(function(s){ return s.val != null; }); },
    isCorrect: function(){ return slots.every(function(s){ return s.val === s.want; }); },
    mark: function(){
      clearHeld();
      toks.forEach(function(t){ t.disabled = true; });
      slots.forEach(function(s){
        s.node.disabled = true;
        var ok = s.val === s.want;
        s.node.classList.remove('filled');
        s.node.classList.add(ok ? 'right' : 'wrong');
        s.node.textContent = q.pool[s.want];
      });
    }
  };
};

KINDS.cloze = function(q, host, state){
  var line = el('p', 'slotline');
  var gaps = [];
  q.parts.forEach(function(p){
    if (p.t != null){ line.appendChild(document.createTextNode(p.t)); return; }
    var g = p.gap;
    if (g.type === 'sa'){
      var inp = document.createElement('input');
      inp.type = 'text'; inp.className = 'sa';
      inp.setAttribute('aria-label', 'answer');
      line.appendChild(inp);
      gaps.push({ node: inp, kind: 'sa', accept: g.accept, wild: g.wild,
                  show: g.options[g.answers[0]] });
    } else {
      var sel = document.createElement('select');
      sel.className = 'slot';
      var blank = document.createElement('option');
      blank.value = ''; blank.textContent = '— choose —';
      sel.appendChild(blank);
      shuffle(g.options.map(function(_, i){ return i; }), seedOf(q.id) + gaps.length)
        .forEach(function(oi){
          var o = document.createElement('option');
          o.value = oi; o.textContent = g.options[oi];
          sel.appendChild(o);
        });
      line.appendChild(sel);
      gaps.push({ node: sel, kind: 'mc', answers: g.answers,
                  show: g.options[g.answers[0]] });
    }
  });
  host.appendChild(line);
  function ok(g){
    if (g.kind === 'mc') return g.answers.indexOf(+g.node.value) >= 0;
    var v = (g.node.value || '').trim().toLowerCase();
    if (!v) return false;
    return g.accept.some(function(a){
      return g.wild ? v.indexOf(a) === 0 : v === a;
    });
  }
  return {
    answered: function(){
      return gaps.every(function(g){ return (g.node.value || '').trim() !== ''; });
    },
    isCorrect: function(){ return gaps.every(ok); },
    mark: function(){
      gaps.forEach(function(g){
        g.node.disabled = true;
        var good = ok(g);
        g.node.classList.add(good ? 'right' : 'wrong');
        if (!good){
          if (g.kind === 'mc'){ g.node.value = g.answers[0]; }
          else { g.node.value = g.show; }
        }
      });
    }
  };
};

KINDS.num = function(q, host, state){
  host.appendChild(el('p', 'stem', q.stem));
  var wrap = el('p');
  var inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'sa'; inp.inputMode = 'decimal';
  inp.setAttribute('aria-label', 'your answer');
  wrap.appendChild(inp);
  host.appendChild(wrap);
  function ok(){
    var v = parseFloat((inp.value || '').replace(/[, ]/g, ''));
    if (isNaN(v)) return false;
    var pairs = [[q.answer, q.tol]].concat(q.also || []);
    return pairs.some(function(p){
      return Math.abs(v - p[0]) <= (p[1] || 0) + 1e-9;
    });
  }
  return {
    answered: function(){ return (inp.value || '').trim() !== ''; },
    isCorrect: ok,
    mark: function(){
      var good = ok();
      inp.disabled = true;
      inp.classList.add(good ? 'right' : 'wrong');
      if (!good) inp.value = String(q.answer);
    }
  };
};

KINDS.sa = function(q, host, state){
  host.appendChild(el('p', 'stem', q.stem));
  var wrap = el('p');
  var inp = document.createElement('input');
  inp.type = 'text'; inp.className = 'sa'; inp.style.width = '18em';
  inp.setAttribute('aria-label', 'your answer');
  wrap.appendChild(inp);
  host.appendChild(wrap);
  function ok(){
    var v = (inp.value || '').trim().toLowerCase();
    if (!v) return false;
    return q.accept.some(function(a){
      if (a.indexOf('*') < 0) return v === a;
      var re = new RegExp('^' + a.split('*')
        .map(function(x){ return x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); })
        .join('.*') + '$');
      return re.test(v);
    });
  }
  return {
    answered: function(){ return (inp.value || '').trim() !== ''; },
    isCorrect: ok,
    mark: function(){
      var good = ok();
      inp.disabled = true;
      inp.classList.add(good ? 'right' : 'wrong');
      if (!good) inp.value = q.show;
    }
  };
};

/* ------------------------------------------------------------------ score */
function renderScore(si){
  var sec = DATA.sections[si];
  var st = sectionStats(sec);
  app.innerHTML = '';
  app.appendChild(el('p', 'eyebrow', 'Section ' + (si + 1) + ' · ' + sec.code));
  app.appendChild(el('h1', null, 'How you did'));

  var pct = st.done ? Math.round(100 * st.right / st.done) : 0;
  var card = el('div', 'card');
  var big = el('div', 'big ' + (pct >= 80 ? 'ok' : 'no'), pct + '%');
  card.appendChild(big);
  card.appendChild(el('p', 'lede',
    st.right + ' right out of ' + st.done + ' answered' +
    (st.done < st.total ? ' (' + (st.total - st.done) + ' not attempted)' : '')));
  card.appendChild(el('p', null, pct >= 80
    ? 'That is at or above the mastery mark used across this programme. '
    + 'Move on, and come back to this section a week before the end-of-cluster test.'
    : 'Below the 80% mastery mark. Work through the elements where you lost '
    + 'marks, then run the section again.'));
  app.appendChild(card);

  var byEl = {};
  sec.questions.forEach(function(q){
    var a = S.answers[q.id];
    var k = 'Element ' + q.element;
    byEl[k] = byEl[k] || { n: 0, right: 0, done: 0 };
    byEl[k].n++;
    if (a && a.done){ byEl[k].done++; if (a.correct) byEl[k].right++; }
  });
  var wrap = el('div', 'wrap');
  var t = el('table');
  var thead = el('thead');
  var hr = el('tr');
  ['Element', 'Answered', 'Right', 'Score'].forEach(function(h){
    hr.appendChild(el('th', null, h));
  });
  thead.appendChild(hr); t.appendChild(thead);
  var tb = el('tbody');
  Object.keys(byEl).sort().forEach(function(k){
    var v = byEl[k];
    var tr = el('tr');
    tr.appendChild(el('td', null, k));
    tr.appendChild(el('td', 'num', v.done + ' / ' + v.n));
    tr.appendChild(el('td', 'num', String(v.right)));
    tr.appendChild(el('td', 'num',
      v.done ? Math.round(100 * v.right / v.done) + '%' : '—'));
    tb.appendChild(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); app.appendChild(wrap);

  var act = el('div', 'actions');
  act.style.marginTop = '18px';
  var again = el('button', 'btn', 'Run this section again'); again.type = 'button';
  again.onclick = function(){
    sec.questions.forEach(function(q){ delete S.answers[q.id]; });
    S.place[sec.code] = 0; save(); renderPage(si, 0); window.scrollTo(0, 0);
  };
  act.appendChild(again);
  if (si + 1 < DATA.sections.length){
    var nx = el('button', 'btn ghost', 'Next section →'); nx.type = 'button';
    nx.onclick = function(){ openSection(si + 1); window.scrollTo(0, 0); };
    act.appendChild(nx);
  }
  var hb = el('button', 'btn ghost', 'All sections'); hb.type = 'button';
  hb.onclick = renderHome;
  act.appendChild(hb);
  app.appendChild(act);
  window.scrollTo(0, 0);
}

renderHome();
})();

<script>
(function(){
"use strict";

/* ---------------- built-in library (ships inside this file) ---------------- */
var BUILTIN = [
  { id:"m2", label:"Module Two",   name:"Module Two Practice",   meta:"Interactive practice · quiz", avatar:"M2", builtin:true },
  { id:"m3", label:"Module Three", name:"Module Three Practice", meta:"Interactive practice · quiz", avatar:"M3", builtin:true }
];

var ITEMS_KEY  = "classwork-hub-items-v1";
var THEME_KEY  = "classwork-hub-theme-v1";
var CUSTOM_KEY = "classwork-hub-custom-lib-v1";
var STATE_DB   = "classwork-hub-state-v1";
var STATE_STORE = "app-state";
var STATE_ID   = "current";

function rawOf(lib){
  if(lib.builtin){
    var ta = document.getElementById("src-" + lib.id);
    return ta ? ta.value : "";
  }
  return lib.html || "";
}

/* ---------------- persisted state ---------------- */
function loadItems(){
  try{
    var raw = localStorage.getItem(ITEMS_KEY);
    if(!raw) return [];
    var parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  }catch(e){ return []; }
}
function saveItems(){
  persistState();
}
function loadCustom(){
  try{
    var raw = localStorage.getItem(CUSTOM_KEY);
    if(!raw) return [];
    var parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  }catch(e){ return []; }
}
function saveCustom(){
  persistState();
}

/*
 * Imported files are read once and copied into app storage. Nothing in this
 * state points back to the File object, its filename, or a phone filesystem
 * path. IndexedDB is used first because course HTML can be larger than the
 * localStorage quota; localStorage remains a migration/fallback store.
 */
function stateSnapshot(){
  return {
    version: 1,
    savedAt: Date.now(),
    items: items.slice(),
    customLib: customLib.slice()
  };
}

function openStateDatabase(done){
  if(!window.indexedDB){ done(null); return; }
  try{
    var request = window.indexedDB.open(STATE_DB, 1);
    request.onupgradeneeded = function(){
      var db = request.result;
      if(!db.objectStoreNames.contains(STATE_STORE)){
        db.createObjectStore(STATE_STORE, {keyPath:"id"});
      }
    };
    request.onsuccess = function(){ done(request.result); };
    request.onerror = function(){ done(null); };
  }catch(e){ done(null); }
}

function persistState(){
  var snapshot = stateSnapshot();

  // Keep the existing keys for compatibility with older versions of the app.
  try{
    localStorage.setItem(ITEMS_KEY, JSON.stringify(snapshot.items));
    localStorage.setItem(CUSTOM_KEY, JSON.stringify(snapshot.customLib));
  }catch(e){}

  // Store a complete independent copy, including custom course HTML.
  openStateDatabase(function(db){
    if(!db) return;
    try{
      var tx = db.transaction(STATE_STORE, "readwrite");
      tx.objectStore(STATE_STORE).put({
        id: STATE_ID,
        version: snapshot.version,
        savedAt: snapshot.savedAt,
        items: snapshot.items,
        customLib: snapshot.customLib
      });
      tx.oncomplete = function(){ db.close(); };
      tx.onerror = function(){ db.close(); };
    }catch(e){
      try{ db.close(); }catch(ignore){}
    }
  });
}

function restoreStateFromAppStorage(){
  openStateDatabase(function(db){
    if(!db) return;
    try{
      var request = db.transaction(STATE_STORE, "readonly")
        .objectStore(STATE_STORE).get(STATE_ID);
      request.onsuccess = function(){
        var stored = request.result;
        db.close();
        if(!stored) {
          // Migrate an older localStorage-only installation into the durable
          // store without requiring the user to import the file again.
          persistState();
          return;
        }
        if(!Array.isArray(stored.customLib) || !Array.isArray(stored.items)) return;

        customLib = stored.customLib.filter(function(c){
          return c && c.id && typeof c.html === "string";
        });
        items = stored.items.filter(function(id){
          return library().some(function(l){ return l.id === id; });
        });
        // Keep both stores synchronized after restoring the durable copy.
        persistState();
        render();
      };
      request.onerror = function(){ db.close(); };
    }catch(e){
      try{ db.close(); }catch(ignore){}
    }
  });
}

var customLib = loadCustom();
function library(){ return BUILTIN.concat(customLib); }
var items = loadItems().filter(function(id){ return library().some(function(l){ return l.id===id; }); });

var gridWrap = document.getElementById("gridWrap");
var overlays = document.getElementById("overlays");
var countLabel = document.getElementById("countLabel");
var openMenuEl = null;
var openMenuAnchor = null;
var openMenuBackdrop = null;
var activeFrame = null; // the iframe currently open in the viewer, if any

function libItem(id){
  return library().filter(function(l){ return l.id===id; })[0];
}

function closeMenu(){
  if(openMenuEl){ openMenuEl.remove(); openMenuEl = null; }
  if(openMenuBackdrop){ openMenuBackdrop.remove(); openMenuBackdrop = null; }
  openMenuAnchor = null;
  document.removeEventListener("click", onDocClick, true);
}
function onDocClick(e){
  if(openMenuEl &&
     !openMenuEl.contains(e.target) &&
     !(openMenuAnchor && openMenuAnchor.contains(e.target))){
    closeMenu();
  }
}
function addMenuBackdrop(){
  var backdrop = document.createElement("div");
  backdrop.className = "menu-backdrop";
  document.body.appendChild(backdrop);
  openMenuBackdrop = backdrop;
}

// Places an already-built .menu popover near anchorEl, fully inside the
// viewport. Measures the menu's real size (rather than guessing a fixed
// width) so it never gets clipped by a screen edge or hidden behind the
// docked nav bar.
function placeMenu(menu, anchorEl){
  var r = anchorEl.getBoundingClientRect();
  var vw = window.innerWidth, vh = window.innerHeight;
  var mw = menu.offsetWidth, mh = menu.offsetHeight;
  var sidebarNav = window.matchMedia("(min-width:900px)").matches;
  var left, top;
  if(sidebarNav && anchorEl.closest("#hubNav")){
    // nav bar is docked to the left edge: open the menu to its right
    left = r.right + 8;
    top = r.top;
  } else if(!sidebarNav && anchorEl.closest("#hubNav")){
    // nav bar floats at the bottom: open the menu above the button
    left = r.left + r.width/2 - mw/2;
    top = r.top - mh - 8;
  } else {
    // card options menu: open just under/left of the button, as before
    left = r.right - mw;
    top = r.bottom + 6;
  }
  left = Math.max(12, Math.min(left, vw - mw - 12));
  top = Math.max(12, Math.min(top, vh - mh - 12));
  menu.style.left = left + "px";
  menu.style.top = top + "px";
  menu.style.visibility = "visible";
}

function toast(msg){
  document.querySelectorAll(".toast").forEach(function(existing){ existing.remove(); });
  var host = document.getElementById("toastHost");
  var t = document.createElement("div");
  t.className = "toast";
  t.setAttribute("role","status");
  t.setAttribute("aria-live","polite");
  t.setAttribute("aria-atomic","true");
  t.textContent = msg;
  (host || document.body).appendChild(t);
  setTimeout(function(){
    t.remove();
  }, 2600);
}

/* ---------------- theme ---------------- */
function currentTheme(){
  var attr = document.documentElement.getAttribute("data-theme");
  if(attr === "dark" || attr === "light") return attr;
  // The hub is intentionally dark by default to match its mobile layout.
  return "dark";
}
function applyThemeToFrame(frame){
  if(!frame) return;
  try{
    var doc = frame.contentDocument;
    if(!doc || !doc.documentElement) return;
    doc.documentElement.setAttribute("data-theme", currentTheme());
    // the embedded module has its own theme toggle; hide it so there is
    // a single source of truth (the hub's toggle) instead of two controls
    // that can disagree with each other.
    var tb = doc.getElementById("themeBtn");
    if(tb) tb.style.visibility = "hidden";
  }catch(e){}
}

/* ---------------- render ---------------- */
function render(){
  countLabel.textContent = items.length
    ? (items.length + (items.length===1 ? " item" : " items"))
    : "";
  gridWrap.innerHTML = "";

  if(items.length === 0){
    var empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML =
      '<div class="glyph"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5V6a2 2 0 0 1 2-2h8l6 6v9.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v5h5"/></svg></div>'+
      "<h3>No classwork yet</h3>"+
      "<p>Add a practice module to get started.</p>";
    var btn = document.createElement("button");
    btn.className = "btn primary";
    btn.textContent = "Add classwork";
    btn.onclick = openAddDialog;
    empty.appendChild(btn);
    gridWrap.appendChild(empty);
    return;
  }

  var grid = document.createElement("div");
  grid.className = "grid";

  items.forEach(function(id){
    var lib = libItem(id);
    if(!lib) return;
    var card = document.createElement("div");
    card.className = "card";
    card.tabIndex = 0;
    card.setAttribute("aria-label", "Open " + lib.name);
    card.onclick = function(){ openViewer(lib); };
    card.onkeydown = function(e){
      if(e.target !== card) return; // let the menu button handle its own keys
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); openViewer(lib); }
    };

    var top = document.createElement("div");
    top.className = "top";
    top.innerHTML =
      '<p class="kicker">'+(lib.builtin ? "Practice" : "Posted by teacher")+'</p>'+
      "<h2>"+lib.label+"</h2>"+
      '<div class="avatar">'+lib.avatar+"</div>";

    var menuBtn = document.createElement("button");
    menuBtn.className = "menubtn";
    menuBtn.setAttribute("aria-label","Options for "+lib.name);

/* ---------------- shared dialog scaffolding ---------------- */
function openDialog(build){
  var veil = document.createElement("div");
  veil.className = "veil";
  veil.onclick = function(e){ if(e.target===veil) close(); };

  var dialog = document.createElement("div");
  dialog.className = "dialog";
  dialog.setAttribute("role","dialog");
  dialog.setAttribute("aria-modal","true");
  veil.appendChild(dialog);

  setNavVisible(false);
  function close(){
    veil.remove();
    document.removeEventListener("keydown", onEsc);
    setNavVisible(true);
  }
  function onEsc(e){ if(e.key==="Escape") close(); }
  document.addEventListener("keydown", onEsc);

  overlays.appendChild(veil);
  build(dialog, close);
  return close;
}

/* ---------------- create a course (teacher side) ---------------- */
function slugify(s){
  return "c-" + s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"").slice(0,40)
    + "-" + Date.now().toString(36).slice(-4);
}
function initialsOf(s){
  var parts = s.trim().split(/\s+/).filter(Boolean);
  if(parts.length === 0) return "C";
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

      // was only added to the catalog, which meant it could appear to vanish
      // until the user opened Add and selected it manually. It also meant a
      // teacher could share a save containing a course that was not selected.
      if(items.indexOf(entry.id) === -1) items.push(entry.id);

/* ---------------- share / import save ---------------- */
function buildSavePayload(){
  // items: ids of everything currently on this hub (built-in + custom).
  // courses: full content for any custom courses, so a recipient who
  // doesn't have them yet can render them without the original file.
  return {
    type: "classwork-hub-save",
    version: 1,
    exportedAt: new Date().toISOString(),
    items: items.slice(),
    courses: customLib.slice()
  };
}

function shareSavePack(){
  var json = JSON.stringify(buildSavePayload(), null, 2);
  var filename = "classwork-hub-save.json";
  var file;
  var canShareFile = false;

  try{
    file = new File([json], filename, {type:"application/json"});
    canShareFile = !!(navigator.share && navigator.canShare &&
      navigator.canShare({files:[file]}));
  }catch(e){}

  if(canShareFile){
    navigator.share({
      title: "Classwork Hub save",
      text: "Classwork Hub course content and teacher-created courses.",
      files: [file]
    }).then(function(){
      toast("Shared " + filename + ".");
    }).catch(function(err){
      if(!err || err.name !== "AbortError"){
        toast("Sharing was not available on this device.");
      }
    });
    return;
  }

  // Some browsers (and a few in-app iOS web views) do not expose file
  // sharing. Download the same portable save instead of leaving the user
  // with a dead-end toast.
  try{
    var blob = new Blob([json], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = filename;
    link.style.display = "none";
    document.body.appendChild(link);
    link.click();
    setTimeout(function(){
      link.remove();
      URL.revokeObjectURL(url);
    }, 1000);
    toast("Downloaded " + filename + ".");
  }catch(e){
    toast("This browser cannot share or download save files.");
  }
}

function applySave(data){
  var newCourses = 0, updatedCourses = 0, newItems = 0;
  var legacyCourseArray = Array.isArray(data);
  var courses = legacyCourseArray ? data : (Array.isArray(data.courses) ? data.courses : []);
  courses.forEach(function(c){
    if(!c || !c.id || !c.html) return;
    var idx = -1;
    for(var i=0;i<customLib.length;i++){ if(customLib[i].id === c.id){ idx = i; break; } }
    // Copy each field into a new plain object. The imported state never keeps
    // a reference to the selected File or anything on the phone filesystem.
    var entry = {
      id: c.id,
      label: c.label || c.name || "Course",
      name: c.name || c.label || "Course",
      meta: c.meta || "Posted by teacher",
      avatar: c.avatar || initialsOf(c.label || c.name || "Course"),
      html: c.html
    };
    if(idx === -1){ customLib.push(entry); newCourses++; }
    else { customLib[idx] = entry; updatedCourses++; } // content refresh only
  });
  // Bring over anything new the teacher added \u2014 additive only. This
  // never removes or alters an item this student already has, and it
  // never touches any module's own saved progress.
  var incomingItems = Array.isArray(data.items) ? data.items.slice() : [];
  // A save pack is meant to make its courses visible on the receiving hub.
  // Older exports were just an array of courses, while newer exports keep
  // courses separate from selected items. Include both formats.
  courses.forEach(function(c){
    if(c && c.id && incomingItems.indexOf(c.id) === -1) incomingItems.push(c.id);
  });
  incomingItems.forEach(function(id){
    if(items.indexOf(id) === -1 && library().some(function(l){ return l.id === id; })){
      items.push(id);
      newItems++;
    }
  });
  // Write one complete snapshot after the import, so the durable store cannot
  // briefly receive a course-only or item-only version of the save.
  if(courses.length || newItems) persistState();

  return { newCourses:newCourses, updatedCourses:updatedCourses, newItems:newItems };
}

function triggerImport(){
  var input = document.createElement("input");
  input.type = "file";
  input.accept = ".json,application/json";
  input.style.display = "none";
  document.body.appendChild(input);
  input.addEventListener("change", function(){
    var f = input.files && input.files[0];
    input.remove();
    if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(String(reader.result || ""));
        var r = applySave(data);
        render();
        if(r.newCourses === 0 && r.updatedCourses === 0 && r.newItems === 0){
          toast("Nothing new in that file \u2014 you already have everything in it.");
        } else {
          toast("Added " + r.newItems + " item(s) and " + r.newCourses + " course(s) to your hub. Your existing items and progress are unchanged.");
        }
      }catch(e){
        toast("That file doesn\u2019t look like a save.");
      }
    };
    reader.readAsText(f);
  });
  input.click();
}

/* ---------------- viewer ---------------- */
var closeActiveViewer = null; // set while a module viewer is open, so the
                               // Home nav button can back out of it
function updateNavHome(){
  var homeBtn = document.getElementById("homeBtn");
  if(homeBtn) homeBtn.classList.toggle("active", !closeActiveViewer);
}
function activateNavButton(button){
  if(!button) return;
  document.querySelectorAll("#hubNav .navbtn").forEach(function(navButton){
    navButton.classList.remove("active");
    navButton.classList.remove("nav-pulse");
  });
  button.classList.add("active");
  // Restart the animation even when the same button is clicked twice.
  void button.offsetWidth;
  button.classList.add("nav-pulse");
}
function setNavVisible(visible){
  var nav = document.getElementById("hubNav");
  if(nav) nav.style.display = visible ? "" : "none";
}
function openViewer(lib){
  var v = document.createElement("div");
  v.className = "viewer";
  var bar = document.createElement("div");
  bar.className = "vbar";
  var back = document.createElement("button");
  back.className = "back";
  back.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg> Back';
  back.onclick = function(){ closeViewer(); };
  var h4 = document.createElement("h4");
  h4.textContent = lib.name;
  bar.appendChild(back);
  bar.appendChild(h4);
  var frame = document.createElement("iframe");
  frame.title = lib.name;
  frame.addEventListener("load", function(){ applyThemeToFrame(frame); });
  v.appendChild(bar);
  v.appendChild(frame);
  overlays.appendChild(v);
  frame.srcdoc = rawOf(lib);
  activeFrame = frame;
  closeActiveViewer = closeViewer;
  updateNavHome();
  setNavVisible(false);

  function closeViewer(){
    v.remove();
    if(activeFrame === frame) activeFrame = null;
    if(closeActiveViewer === closeViewer) closeActiveViewer = null;
    updateNavHome();
    setNavVisible(true);
    document.removeEventListener("keydown", onEsc);
  }
  function onEsc(e){ if(e.key==="Escape") closeViewer(); }
  document.addEventListener("keydown", onEsc);
}

/* ---------------- screen wake lock ---------------- */
var screenWakeLock = null;
var wakeLockRequest = null;
function requestScreenWakeLock(){
  if(!("wakeLock" in navigator) || document.visibilityState !== "visible") return;
  if(screenWakeLock || wakeLockRequest) return;
  wakeLockRequest = navigator.wakeLock.request("screen").then(function(lock){
    screenWakeLock = lock;
    lock.addEventListener("release", function(){
      if(screenWakeLock === lock) screenWakeLock = null;
    });
  }).catch(function(){
    // Wake Lock is optional and can be denied by the browser or device.
  }).then(function(){
    wakeLockRequest = null;
  });
}
function releaseScreenWakeLock(){
  if(wakeLockRequest) wakeLockRequest = null;
  if(!screenWakeLock) return;
  var lock = screenWakeLock;
  screenWakeLock = null;
  lock.release().catch(function(){});
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible") requestScreenWakeLock();
  else releaseScreenWakeLock();
});
["pointerdown","touchstart","keydown"].forEach(function(eventName){
  document.addEventListener(eventName, requestScreenWakeLock, {passive:true});
});
requestScreenWakeLock();

/* ---------------- boot ---------------- */
document.getElementById("homeBtn").onclick = function(){
  if(closeActiveViewer){ closeActiveViewer(); }
  else { window.scrollTo({top:0, behavior:"smooth"}); }
};
document.querySelectorAll("#hubNav .navbtn").forEach(function(button){
  button.addEventListener("click", function(){ activateNavButton(button); });
});
document.getElementById("addBtn").onclick = openAddDialog;
document.getElementById("courseMenuBtn").onclick = function(e){
  e.stopPropagation();
  openCourseMenu();
};
var themeBtn = document.getElementById("themeBtn");
var themeHoldTimer = null;
var themeHoldMs = 650;
function switchTheme(){
  var r = document.documentElement;
  var dark = currentTheme() === "dark";
  var next = dark ? "light" : "dark";
  r.setAttribute("data-theme", next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  applyThemeToFrame(activeFrame);
  toast(next === "dark" ? "Dark theme" : "Light theme");
}
function clearThemeHold(){
  if(themeHoldTimer){
    clearTimeout(themeHoldTimer);
    themeHoldTimer = null;
  }
}
themeBtn.addEventListener("pointerdown", function(e){
  if(e.pointerType === "mouse" && e.button !== 0) return;
  clearThemeHold();
  themeHoldTimer = setTimeout(function(){
    themeHoldTimer = null;
    switchTheme();
  }, themeHoldMs);
});
["pointerup","pointercancel","pointerleave"].forEach(function(eventName){
  themeBtn.addEventListener(eventName, clearThemeHold);
});
// Theme changes are intentionally hold-only so a normal tap cannot switch
// modes accidentally while the dock is being used.
themeBtn.addEventListener("click", function(e){ e.preventDefault(); });
try{
  var th = localStorage.getItem(THEME_KEY);
  if(th === "dark" || th === "light") document.documentElement.setAttribute("data-theme", th);
}catch(e){}

render();
// Rehydrate the app-owned copy asynchronously. If the original imported
// JSON has been deleted from the phone, this copy is still enough to restore
// the courses and selected items.
restoreStateFromAppStorage();
})();
</script>
