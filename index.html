<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/ping" href="favicon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Classwork Hub</title>
<style>
:root{
  --paper:#17171B;
  --ground:#050506;
  --ink:#F7F7F8;
  --ink-2:#B1B1B8;
  --ink-3:#77777F;
  --line:#2B2B31;
  --line-2:#414148;
  --blue:#F4F4F5;
  --blue-ink:#101014;
  --blue-soft:#28282E;
  --blue-soft-line:#4A4A52;
  --danger:#C0392B;
  --danger-soft:#FBEAE8;
  --green:#1B7A4B;
  --green-soft:#E7F5EE;
  --radius:20px;
  --shadow:0 16px 32px -22px rgba(0,0,0,.9);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#16181B; --ground:#0E0F11; --ink:#F1F2F4; --ink-2:#B7BBC1; --ink-3:#8B929B;
  --line:#2A2D31; --line-2:#3D4147;
  --blue:#6E93FF; --blue-ink:#0A1020; --blue-soft:#182136; --blue-soft-line:#31406B;
  --danger:#E8837A; --danger-soft:#331916;
  --green:#5FC395; --green-soft:#122A20;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 26px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#16181B; --ground:#0E0F11; --ink:#F1F2F4; --ink-2:#B7BBC1; --ink-3:#8B929B;
  --line:#2A2D31; --line-2:#3D4147;
  --blue:#6E93FF; --blue-ink:#0A1020; --blue-soft:#182136; --blue-soft-line:#31406B;
  --danger:#E8837A; --danger-soft:#331916;
  --green:#5FC395; --green-soft:#122A20;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 26px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --paper:#FFFFFF; --ground:#F5F6F8; --ink:#111315; --ink-2:#4B5158;
  --ink-3:#8A9099; --line:#E3E5E9; --line-2:#CCD0D6;
  --blue:#1E4FE8; --blue-ink:#FFFFFF; --blue-soft:#EAF0FF;
  --blue-soft-line:#C7D6FF; --shadow:0 1px 2px rgba(17,19,21,.05),0 8px 24px -18px rgba(17,19,21,.35);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--ground);touch-action:manipulation;
  scrollbar-width:none;-ms-overflow-style:none} /* keep scrolling, hide the scrollbar */
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
body{margin:0;color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
[hidden]{display:none!important}

/* ---------- header ---------- */
header.top{position:relative;z-index:20;background:transparent;
  padding:24px 20px 8px;padding-top:calc(24px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:10px;max-width:920px;margin:0 auto}
.mark{display:none}
.title{font-weight:750;font-size:36px;line-height:1;letter-spacing:-.055em}
.spacer{flex:1}

/* ---------- floating hub nav bar ---------- */
/* Keep the original hub's proven dock behavior: roomy circular controls,
   one active state, and a left-side dock on wider screens. */
.navbar{position:fixed;z-index:22;background:#111315;
  display:flex;flex-direction:row;align-items:center;gap:3px;padding:6px;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.45),0 2px 10px rgba(0,0,0,.25);
  border:1px solid rgba(255,255,255,.06);
  left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);border-radius:999px}
.navbtn{width:50px;height:50px;flex:none;border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  color:#F4F5F7;opacity:.78;position:relative;
  transition:opacity .18s,background .18s,color .18s,transform .18s,box-shadow .18s}
.navbtn:hover{opacity:1}
.navbtn:active{transform:scale(.93)}
.navbtn.active{
  background:var(--blue);color:var(--blue-ink);opacity:1;
  box-shadow:0 0 0 1px var(--blue-soft-line),0 5px 16px rgba(30,79,232,.35)}
.navbtn.nav-pulse{animation:navPulse .36s cubic-bezier(.22,.8,.3,1)}
@keyframes navPulse{
  0%{transform:scale(.86);box-shadow:0 0 0 0 rgba(30,79,232,0),0 2px 8px rgba(30,79,232,.12)}
  58%{transform:scale(1.06);box-shadow:0 0 0 5px rgba(30,79,232,.12),0 7px 20px rgba(30,79,232,.4)}
  100%{transform:scale(1);box-shadow:0 0 0 1px var(--blue-soft-line),0 5px 16px rgba(30,79,232,.35)}
}
.navbtn.nav-pulse{animation:navPulse .36s cubic-bezier(.22,.8,.3,1)}
@keyframes navPulse{
  0%{transform:scale(.86);box-shadow:0 0 0 0 rgba(30,79,232,0),0 2px 8px rgba(30,79,232,.12)}
  58%{transform:scale(1.06);box-shadow:0 0 0 5px rgba(30,79,232,.12),0 7px 20px rgba(30,79,232,.4)}
  100%{transform:scale(1);box-shadow:0 0 0 1px var(--blue-soft-line),0 5px 16px rgba(30,79,232,.35)}
}
.navbtn .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:99px;
  background:var(--blue);border:1.5px solid var(--ink);display:none}
.navbtn.has-badge .dot{display:block}
#homeBtn{display:flex}

@media (min-width:900px){
  header.top{padding-left:86px;padding-right:20px}
  main{padding-left:86px;padding-right:20px}
  .navbar{left:0;bottom:auto;top:50%;transform:translateY(-50%);
    flex-direction:column;border-radius:0 999px 999px 0;
    padding:10px 6px;gap:8px;border-left:none}
  .navbtn{width:46px;height:46px}
}

/* ---------- main ---------- */
main{max-width:920px;margin:0 auto;padding:22px 20px calc(108px + env(safe-area-inset-bottom,0px))}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;
  margin:8px 0 18px}
.pagehead h1{font-size:19px;margin:0 0 3px;letter-spacing:-.02em}
.pagehead p{margin:0;color:var(--ink-3);font-size:13.5px}
.count{font-size:12.5px;color:var(--ink-3);white-space:nowrap}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

.card{background:linear-gradient(145deg,#232328 0%,#18181C 75%);
  border:1px solid #36363D;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);
  display:flex;flex-direction:column;min-height:202px;
  cursor:pointer;text-align:left;width:100%;
  transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:var(--line-2);transform:translateY(-2px);
  box-shadow:0 18px 34px -22px rgba(0,0,0,.95)}
.card:active{transform:translateY(0)}
.card:focus-visible{outline:2px solid #F4F4F5;outline-offset:3px}
.card .top{background:transparent;color:var(--ink);padding:25px 16px 16px;position:relative;
  min-height:143px;display:flex;align-items:flex-end}
.card .top:before{content:"";position:absolute;left:17px;top:-1px;width:56px;height:18px;
  border:1px solid #414148;border-top:none;border-radius:0 0 10px 10px;
  background:#232328}
.card .top h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.03em;line-height:1.16;
  max-width:calc(100% - 4px)}
.card .top .kicker{position:absolute;left:18px;top:26px;font-size:0;margin:0;color:#7F7F87}
.card .top .kicker:before{content:"☷";font-size:18px;line-height:1}
.card .menubtn{position:absolute;top:19px;right:10px;width:29px;height:29px;border-radius:9px;
  color:#8D8D95;opacity:.85;display:flex;align-items:center;justify-content:center;z-index:2}
.card .menubtn:hover{background:rgba(255,255,255,.08);opacity:1}
.card .avatar{display:none}
.card .body{padding:0 16px 7px;flex:1}
.card .body .meta{font-size:12px;color:#96969E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .foot{display:flex;border-top:1px solid rgba(255,255,255,.07);transition:background .15s}
.card .foot span{flex:1;padding:10px 14px;font-size:12px;font-weight:600;color:#A4A4AC;
  display:flex;align-items:center;justify-content:center;gap:6px;transition:color .15s,gap .15s}
.card:hover .foot{background:rgba(255,255,255,.04)}
.card:hover .foot span{color:#F4F4F5;gap:9px}

@media (min-width:700px){
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* menu popover */
.menu-backdrop{position:fixed;inset:0;z-index:39;
  background:rgba(10,12,15,.46);pointer-events:none;
  animation:menuBackdropIn .18s ease-out}
@keyframes menuBackdropIn{
  from{opacity:0}
  to{opacity:1}
}
.menu{position:fixed;z-index:40;background:var(--paper);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);min-width:220px;max-width:calc(100vw - 24px);
  padding:8px;overflow:hidden;visibility:hidden}
.menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 11px;
  min-height:46px;font-size:14px;border-radius:8px;color:var(--ink-2)}
.menu button:hover{background:var(--ground);color:var(--ink)}
.menu button.danger{color:var(--danger)}
.menu button.danger:hover{background:var(--danger-soft)}
.menu .msep{height:1px;background:var(--line);margin:8px 4px}
.teacher-menu{
  left:50%!important;top:50%!important;
  width:min(360px,calc(100vw - 32px));min-width:0;
  padding:12px;transform:translate(-50%,-50%);
  border-radius:16px;
  box-shadow:0 20px 55px -22px rgba(0,0,0,.58),0 4px 18px rgba(0,0,0,.2);
  animation:teacherMenuIn .2s cubic-bezier(.22,.8,.3,1)}
.teacher-menu .menu-heading{padding:5px 9px 12px;margin:0 2px 4px;border-bottom:1px solid var(--line)}
.teacher-menu .menu-heading strong{display:block;font-size:16px;color:var(--ink);letter-spacing:-.01em}
.teacher-menu .menu-heading span{display:block;margin-top:3px;font-size:12.5px;color:var(--ink-3)}
@keyframes teacherMenuIn{
  from{opacity:0;transform:translate(-50%,-47%) scale(.96)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}
}

/* empty state */
.empty{border:1px dashed var(--line-2);border-radius:var(--radius);padding:48px 20px;
  text-align:center;color:var(--ink-3)}
.empty .glyph{width:46px;height:46px;border-radius:11px;background:var(--blue-soft);
  border:1px solid var(--blue-soft-line);color:var(--blue);display:flex;align-items:center;
  justify-content:center;margin:0 auto 14px}
.empty h3{color:var(--ink);font-size:15.5px;margin:0 0 5px}
.empty p{margin:0 0 16px;font-size:13.5px}

/* ---------- overlays ---------- */
.veil{position:fixed;inset:0;background:rgba(10,12,15,.5);z-index:50;
  display:flex;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.dialog{background:var(--paper);border-radius:12px;max-width:440px;width:100%;
  box-shadow:0 24px 60px -20px rgba(0,0,0,.5);border:1px solid var(--line);margin:auto}
.dialog .dh{padding:18px 20px 4px}
.dialog .dh h3{margin:0 0 3px;font-size:16px}
.dialog .dh p{margin:0;font-size:13px;color:var(--ink-3)}
.dialog .db{padding:14px 20px}
.dialog .df{padding:14px 20px 18px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

.optrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:9px;
  padding:11px 12px;margin-bottom:9px;text-align:left;width:100%}
.optrow:hover{border-color:var(--blue);background:var(--blue-soft)}
.optrow .sw{width:32px;height:32px;border-radius:7px;background:var(--blue);color:var(--blue-ink);
  flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px}
.optrow .ot{font-size:13.5px;font-weight:600}
.optrow .os{font-size:12px;color:var(--ink-3)}
.noneleft{font-size:13px;color:var(--ink-3);padding:6px 2px}

.btn{font-size:13.5px;font-weight:600;border-radius:8px;padding:9px 15px;
  border:1px solid var(--line);color:var(--ink-2)}
.btn:hover{border-color:var(--line-2);color:var(--ink)}
.btn.primary{background:var(--blue);color:var(--blue-ink);border-color:var(--blue)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.primary[disabled]{background:var(--line-2);border-color:var(--line-2);color:var(--ink-3);
  cursor:default;filter:none}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.danger:hover{filter:brightness(1.06)}
.btn.danger[disabled]{background:var(--line-2);border-color:var(--line-2);color:var(--ink-3);
  cursor:default;filter:none}

.confirm-copy{font-size:13px;color:var(--ink-2);margin:0 0 10px;line-height:1.5}
.confirm-copy b{color:var(--ink)}
.confirm-input{width:100%;font:inherit;font-size:16px;padding:9px 11px;border-radius:8px;
  border:1px solid var(--line-2);background:var(--ground);color:var(--ink)}
.confirm-word{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--danger-soft);
  color:var(--danger);padding:1px 6px;border-radius:4px;font-size:12.5px}

.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.5}
.field input[type="text"]{width:100%;font:inherit;font-size:16px;padding:9px 11px;border-radius:8px;
  border:1px solid var(--line-2);background:var(--ground);color:var(--ink)}
.filepick{display:flex;align-items:center;gap:10px;border:1px dashed var(--line-2);border-radius:8px;
  padding:10px 11px;font-size:12.5px;color:var(--ink-3);cursor:pointer}
.filepick:hover{border-color:var(--blue);color:var(--ink-2)}
.filepick input{display:none}
.filepick .fname{color:var(--ink);font-weight:600}

.notice{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;
  color:var(--ink-2);background:var(--ground);margin-bottom:12px;line-height:1.5}
.notice.ok{border-color:var(--green);background:var(--green-soft);color:var(--green)}

.courselist{margin-top:2px}
.courserow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.courserow:last-child{border-bottom:none}
.courserow .ct{flex:1;font-size:13px}
.courserow .ct b{display:block;font-size:13px}
.courserow .ct span{display:block;font-size:11.5px;color:var(--ink-3)}
.courserow button{font-size:12px;font-weight:600;color:var(--danger);padding:5px 8px;border-radius:6px}
.courserow button:hover{background:var(--danger-soft)}

/* toast */
.toast-host{position:relative;z-index:80;max-width:920px;margin:0 auto;
  padding:0 20px}
.toast{position:relative;left:auto;top:auto;transform:none;
  width:min(420px,calc(100vw - 24px));max-height:min(18vh,140px);
  margin:8px auto 0;overflow:auto;overflow-wrap:anywhere;pointer-events:none;
  background:var(--ink);color:var(--paper);font-size:13px;font-weight:600;
  line-height:1.4;padding:11px 16px;border-radius:12px;
  border:1px solid var(--line);box-shadow:0 14px 34px -16px rgba(0,0,0,.9);
  text-align:center;animation:toastIn .2s cubic-bezier(.22,.8,.3,1)}
@keyframes toastIn{
  from{opacity:0;transform:translateY(-8px) scale(.96)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
:root[data-theme="dark"] .toast{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .toast{background:var(--paper);color:var(--ink);border:1px solid var(--line)}}
@media (max-width:380px){
  .toast{width:calc(100vw - 20px);font-size:12px;padding:10px 12px}
}

/* full viewer */
.viewer{position:fixed;inset:0;background:var(--ground);z-index:60;display:flex;flex-direction:column}
.viewer .vbar{background:var(--paper);border-bottom:1px solid var(--line);
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:12px}
.viewer .vbar h4{margin:0;font-size:14px;font-weight:700}
.viewer .vbar .back{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
  color:var(--ink-2);border:1px solid var(--line);border-radius:7px;padding:6px 11px}
.viewer .vbar .back:hover{border-color:var(--line-2);color:var(--ink)}
.viewer iframe{flex:1;width:100%;border:none;background:var(--paper);color-scheme:normal}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body>

<header class="top">
  <div class="mark">C</div>
  <div>
    <div class="title">Classwork</div>
  </div>
  <div class="spacer"></div>
</header>

<div id="toastHost" class="toast-host" aria-live="polite"></div>

<nav class="navbar" id="hubNav" aria-label="Hub navigation">
  <button class="navbtn active" id="homeBtn" aria-label="Home" title="Home">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3l8.5 7.5"/><path d="M5.5 9v10a1 1 0 0 0 1 1H10v-6h4v6h3.5a1 1 0 0 0 1-1V9"/></svg>
  </button>
  <button class="navbtn" id="courseMenuBtn" aria-label="Teacher tools" title="Teacher tools">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4Z"/><path d="M7 9.5V15c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5V9.5"/><path d="M21 7v6"/></svg>
  </button>
  <button class="navbtn" id="themeBtn" aria-label="Hold to switch theme" title="Hold to switch theme">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v1.5M12 19.5V21M4.9 4.9l1.1 1.1M18 18l1.1 1.1M3 12h1.5M19.5 12H21M4.9 19.1 6 18M18 6l1.1-1.1"/><circle cx="12" cy="12" r="4.3"/></svg>
  </button>
  <button class="navbtn" id="addBtn" aria-label="Add classwork" title="Add classwork">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</nav>

<main>
  <div class="pagehead">
    <div>
      <h1>Your classwork</h1>
      <p>Open a module to practice, or add one from the class files.</p>
    </div>
    <div class="count" id="countLabel"></div>
  </div>

  <div id="gridWrap"></div>
</main>

<div id="overlays"></div>

<textarea id="src-m2" style="display:none" aria-hidden="true"><!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Module Two Practice</title>
<style>
:root{
  --ground:#EFF2F3; --panel:#FFFFFF; --panel-2:#E4EAEC; --panel-3:#D8E0E3;
  --ink:#111A1F; --ink-2:#3A4950; --ink-3:#4E5D64; --ink-4:#5C6E76;
  --rule:#CFD8DB; --rule-2:#A7B6BC;
  --primary:#0B6767; --primary-ink:#FFFFFF; --primary-soft:#D3E7E5;
  --amber:#95560A; --amber-soft:#F7E7CF;
  --green:#186540; --green-soft:#D3E8DC;
  --red:#9A2C24; --red-soft:#F6DCD9;
  --shadow:0 1px 2px rgba(17,26,31,.07),0 10px 28px -20px rgba(17,26,31,.45);
  --r:7px;
  --sans:Archivo,"Helvetica Neue",Arial,sans-serif;
  --serif:"Source Serif 4",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0C1216; --panel:#141D22; --panel-2:#1B262C; --panel-3:#243138;
  --ink:#E8EEF0; --ink-2:#B2C0C6; --ink-3:#7E9199; --ink-4:#81959D;
  --rule:#26333A; --rule-2:#3A4B54;
  --primary:#4CC3BB; --primary-ink:#06231F; --primary-soft:#10302E;
  --amber:#E2A45C; --amber-soft:#31220F;
  --green:#5CC08C; --green-soft:#102B1E;
  --red:#E8837A; --red-soft:#331916;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px -20px rgba(0,0,0,.9);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0C1216; --panel:#141D22; --panel-2:#1B262C; --panel-3:#243138;
  --ink:#E8EEF0; --ink-2:#B2C0C6; --ink-3:#7E9199; --ink-4:#81959D;
  --rule:#26333A; --rule-2:#3A4B54;
  --primary:#4CC3BB; --primary-ink:#06231F; --primary-soft:#10302E;
  --amber:#E2A45C; --amber-soft:#31220F;
  --green:#5CC08C; --green-soft:#102B1E;
  --red:#E8837A; --red-soft:#331916;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 28px -20px rgba(0,0,0,.9);
  color-scheme:dark;
}
:root[data-theme="light"]{ color-scheme:light; }
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--serif);
  font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
img{max-width:100%}
[hidden]{display:none!important}

header.top{position:sticky;top:0;z-index:30;background:var(--panel);
  border-bottom:1px solid var(--rule);
  padding:10px 16px calc(10px);padding-top:calc(10px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--sans);font-weight:700;font-size:15px;letter-spacing:-.01em;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand em{font-style:normal;color:var(--primary)}
.sub{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
@media(max-width:700px){.sub{display:none}}
.spacer{flex:1}
.iconbtn{background:transparent;border:1px solid var(--rule);border-radius:var(--r);
  height:32px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;
  font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.iconbtn:hover{border-color:var(--rule-2);color:var(--ink)}

main{max-width:800px;margin:0 auto;padding:24px 16px 72px}
h1{font-family:var(--sans);font-size:clamp(24px,5vw,32px);line-height:1.15;margin:.2em 0 .3em;
  letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--sans);font-size:19px;margin:0 0 6px;letter-spacing:-.01em}
p{margin:0 0 14px}
.lede{color:var(--ink-2);font-size:18px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--amber);margin:0 0 4px}

.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);
  padding:18px;box-shadow:var(--shadow);margin:0 0 14px}
.sectionlist{display:grid;gap:12px;margin:22px 0}
.srow{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);
  padding:14px 16px;box-shadow:var(--shadow)}
.srow:hover{border-color:var(--primary)}
.snum{font-family:var(--mono);font-size:12px;color:var(--primary);
  background:var(--primary-soft);border-radius:5px;padding:3px 7px;flex:none;margin-top:2px}
.smeta{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:3px}
.scode{font-family:var(--mono);font-size:11.5px;color:var(--ink-4)}
.pill{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:99px;
  border:1px solid var(--rule);color:var(--ink-3);white-space:nowrap}
.pill.done{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.pill.part{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}

.bar{height:5px;background:var(--panel-3);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px;
  transition:width .3s ease}

.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-bottom:8px;flex-wrap:wrap}
.tagpc{color:var(--amber)}
.stem{font-size:18px;margin:0 0 14px}
.stem em{font-style:italic}
.howto{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);margin:-6px 0 12px}

.opts{display:grid;gap:8px;margin:0 0 14px}
.opt{display:flex;gap:11px;align-items:flex-start;background:var(--panel-2);
  border:1px solid var(--rule);border-radius:var(--r);padding:11px 13px;text-align:left;
  width:100%;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--rule-2)}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--ink-4);flex:none;margin-top:2px;
  width:18px}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt[disabled]{cursor:default}

.slotline{font-size:18px;line-height:2.1}
select.slot,.dropslot{font:inherit;font-size:16px;font-family:var(--sans);
  background:var(--panel-2);color:var(--ink);border:1px solid var(--rule-2);
  border-radius:5px;padding:3px 8px;margin:0 2px;max-width:100%}
.dropslot{display:inline-block;min-width:110px;min-height:32px;cursor:pointer;
  border-style:dashed;color:var(--ink-4);vertical-align:middle}
.dropslot.filled{border-style:solid;color:var(--ink);background:var(--primary-soft);
  border-color:var(--primary)}
.dropslot.right{border-style:solid;border-color:var(--green);background:var(--green-soft);color:var(--ink)}
.dropslot.wrong{border-style:solid;border-color:var(--red);background:var(--red-soft);color:var(--ink)}
.dropslot.active{border-color:var(--amber);border-style:solid}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.tok{font-family:var(--sans);font-size:14px;background:var(--panel-2);
  border:1px solid var(--rule-2);border-radius:99px;padding:6px 13px}
.tok[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.tok.used{opacity:.32;cursor:default}
input.sa{font:inherit;font-size:16px;font-family:var(--sans);background:var(--panel-2);
  color:var(--ink);border:1px solid var(--rule-2);border-radius:5px;padding:3px 8px;
  width:12em;max-width:100%}
input.sa.right{border-color:var(--green);background:var(--green-soft)}
input.sa.wrong{border-color:var(--red);background:var(--red-soft)}

.matchgrid{display:grid;gap:8px;margin:0 0 14px}
.mrow{display:grid;grid-template-columns:1fr 210px;gap:10px;align-items:center;
  background:var(--panel-2);border:1px solid var(--rule);border-radius:var(--r);padding:10px 12px}
@media(max-width:560px){.mrow{grid-template-columns:1fr}}
.mrow.right{border-color:var(--green);background:var(--green-soft)}
.mrow.wrong{border-color:var(--red);background:var(--red-soft)}
.mrow select{font:inherit;font-size:16px;font-family:var(--sans);width:100%;
  background:var(--panel);color:var(--ink);border:1px solid var(--rule-2);
  border-radius:5px;padding:6px 8px}

.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
.btn{font-family:var(--sans);font-size:14px;font-weight:600;border-radius:var(--r);
  padding:9px 16px;border:1px solid var(--primary);background:var(--primary);
  color:var(--primary-ink)}
.btn.ghost{background:transparent;color:var(--ink-2);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--rule-2);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}

.note{border-left:3px solid var(--rule-2);padding:2px 0 2px 14px;margin:14px 0 0;
  color:var(--ink-2);font-size:16px}
.note.ok{border-color:var(--green)}
.note.no{border-color:var(--red)}
.note.hint{border-color:var(--amber);color:var(--amber)}
.note b{font-family:var(--sans);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  display:block;color:var(--ink-3);margin-bottom:2px}
.note.hint b{color:var(--amber)}

.scorewrap{display:grid;gap:10px;margin:18px 0}
.scorerow{display:flex;justify-content:space-between;gap:12px;font-family:var(--sans);
  font-size:14px;border-bottom:1px solid var(--rule);padding-bottom:8px}
.big{font-family:var(--sans);font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.big.ok{color:var(--green)} .big.no{color:var(--amber)}
table{border-collapse:collapse;width:100%;font-size:14px;font-family:var(--sans)}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule)}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{overflow-x:auto}
footer{max-width:800px;margin:0 auto;padding:0 16px 40px;color:var(--ink-4);
  font-family:var(--mono);font-size:11.5px}
</style>
