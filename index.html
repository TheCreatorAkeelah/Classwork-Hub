al plan drifting away from what the business is trying to do.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "4b5643b2e9", "unit": "BSBFLM0053B", "element": 1, "pc": "1.1", "topic": "Resources", "stem": "", "feedback": "Criteria 1.1 to 1.5 in order. Notice that none of the verbs is \"decide\".", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "Element 1 in sequence: resource requirements are "}, {"gap": 0}, {"t": " and recorded, support of the plan "}, {"gap": 1}, {"t": " to the business plan, "}, {"gap": 2}, {"t": " are used to measure performance, "}, {"gap": 3}, {"t": " planning is undertaken as required, and proposals for resources are "}, {"gap": 4}, {"t": "."}], "pool": ["collected", "contributes", "key performance indicators", "contingency", "supported", "approved", "audited", "outsourced"], "answer": [0, 1, 2, 3, 4]}, {"id": "1c1d0ca6fa", "unit": "BSBFLM0053B", "element": 1, "pc": "1.3", "topic": "KPIs", "stem": "", "feedback": "Efficiency or effectiveness of a system; accountability and improvement; own and team performance.", "hints": ["Each gap is marked separately — a wrong one does not cost you the others."], "kind": "cloze", "parts": [{"t": "A KPI is a measure of the "}, {"gap": {"type": "mc", "options": ["efficiency or effectiveness of a system", "workload of an individual", "cost of a department", "satisfaction of a customer"], "answers": [0], "accept": ["efficiency or effectiveness of a system"], "wild": false}}, {"t": ". The range statement says KPIs may be used to demonstrate "}, {"gap": {"type": "sa", "options": ["accountability"], "answers": [0], "accept": ["accountability"], "wild": false}}, {"t": " and to identify areas for "}, {"gap": {"type": "sa", "options": ["improvement", "improvements", "improvement*"], "answers": [0, 1, 2], "accept": ["improvement", "improvements", "improvement"], "wild": true}}, {"t": ". Criterion 1.3 requires them to measure "}, {"gap": {"type": "mc", "options": ["your own and your work team's performance", "senior management performance", "supplier performance", "customer performance"], "answers": [0], "accept": ["your own and your work team's performance"], "wild": false}}, {"t": "."}]}, {"id": "6fd53acfc1", "unit": "BSBFLM0053B", "element": 2, "pc": "2.1", "topic": "Recruitment", "stem": "Criterion 2.1 requires assistance with employee recruitment and induction to be provided:", "feedback": "The boundary is the organisation's own policies and practices. That is what keeps recruitment consistent and defensible.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.1 of this unit."], "kind": "mc", "options": ["Within the organisation's policies and practices, as required", "By the human resources department only", "Only once the operational plan for the period has been approved", "In consultation with the union"], "answer": 0}, {"id": "51cb55c894", "unit": "BSBFLM0053B", "element": 2, "pc": "2.1", "topic": "Induction", "stem": "A new technician starts Monday. Which action best meets criterion 2.1?", "feedback": "Induction is a defined process in the organisation's policies, and OHS information at induction is named in the range statement. Goodwill is not a substitute for it.", "hints": ["\"Within the organisation's policies and practices\" — which option is working from an actual policy?", "Re-read performance criterion 2.1 of this unit."], "kind": "mc", "options": ["Prepare the induction against the organisation's induction policy, including OHS information and access requests", "Assign an experienced technician to keep an eye on them for a week", "Give them the equipment and let them learn the systems in their own time, which is how most of the current team learned them", "Send the policy manual by email on their first morning"], "answer": 0}, {"id": "31e7a63c8a", "unit": "BSBFLM0053B", "element": 2, "pc": "2.2", "topic": "Acquisition", "stem": "Criterion 2.2 requires physical resources and services to be acquired according to the organisation's policies, practices and procedures and:", "feedback": "The criterion adds consultation to compliance. Buying correctly but without consulting the people who will use or support the thing is a common and expensive failure.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.2 of this unit."], "kind": "mc", "options": ["In consultation with relevant personnel", "Within the approved budget", "After a comparison of at least three suppliers", "With the approval of the operational plan owner"], "answer": 0}, {"id": "2fedf60f7f", "unit": "BSBFLM0053B", "element": 2, "pc": "2.2", "topic": "Acquisition", "stem": "A purchase that follows the organisation's purchasing procedure exactly satisfies criterion 2.2 on its own.", "feedback": "The criterion requires the acquisition to be made in consultation with relevant personnel as well as according to policies and procedures.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "0d6818ed04", "unit": "BSBFLM0053B", "element": 2, "pc": "2.2", "topic": "Policies", "stem": "Which TWO does the range statement include under the organisation's policies and practices?", "feedback": "The range statement explicitly includes organisational culture and undocumented practices alongside written guidelines and standard operating procedures. Codes of practice and awards sit under legislation and codes, which is a separate list.", "hints": ["One of these lists includes things that are not written down anywhere.", "Re-read performance criterion 2.2 of this unit."], "kind": "ms", "options": ["Standard operating procedures", "Undocumented practices in line with organisational operations", "Industry codes of practice", "Award and enterprise agreements"], "answers": [0, 1]}, {"id": "59276b0778", "unit": "BSBFLM0053B", "element": 2, "pc": "2.2", "topic": "Policies", "stem": "Why does the range statement include \"undocumented practices in line with organisational operations\" as part of the organisation's policies and practices?", "feedback": "It is a realistic acknowledgement, not a licence. A new supervisor who follows only the written manual will still get things wrong, and the unit expects you to learn the unwritten part too.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.2 of this unit."], "kind": "mc", "options": ["Because how the organisation actually works includes conventions that were never written down but are still binding in practice", "Because undocumented practices take precedence over written policy", "Because it allows managers the discretion to bypass the written procedure whenever following it would be inconvenient or slow", "Because written policies are usually out of date"], "answer": 0}, {"id": "b7e1801df5", "unit": "BSBFLM0053B", "element": 2, "pc": "2.1", "topic": "Legislation", "stem": "Which of these does the range statement list under legislation, codes and national standards relevant to the workplace?", "feedback": "That list covers awards and enterprise agreements, relevant legislation affecting business operation — especially OHS, environmental issues, equal opportunity, industrial relations and anti-discrimination — and relevant industry codes of practice.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.1 of this unit."], "kind": "mc", "options": ["Award and enterprise agreements and relevant industrial instruments", "The organisation's standard operating procedures", "The operational plan and its contingency arrangements", "Supplier contracts and service level agreements"], "answer": 0}, {"id": "81e8c4d79f", "unit": "BSBFLM0053B", "element": 2, "pc": "2.2", "topic": "Acquisition", "stem": "", "feedback": "Procedures, consultation, relevant personnel. Note \"relevant\", not \"designated\" — that term belongs to a different unit in this cluster.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Physical resources and services are acquired according to the organisation's policies, practices and "}, {"gap": 0}, {"t": ", and in "}, {"gap": 1}, {"t": " with "}, {"gap": 2}, {"t": " personnel."}], "pool": ["procedures", "consultation", "relevant", "budgets", "agreement", "designated", "accordance"], "answer": [0, 1, 2]}, {"id": "ed6def4fad", "unit": "BSBFLM0053B", "element": 2, "pc": "2.2", "topic": "Relevant personnel", "stem": "A new switch stack is being acquired. Match each person to what you would consult them about.", "feedback": "Criterion 2.2 requires acquisition in consultation with relevant personnel — and the range statement makes clear that means more people than whoever signs the order.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 2.2."], "kind": "match", "left": ["Specialist resource manager", "Other employees", "OHS committee", "Supervisor"], "right": ["Whether the purchase fits the procurement framework", "Whether the proposed maintenance window is workable", "Whether the installation introduces new hazards", "Whether the requirement matches the operational plan"], "answer": [0, 1, 2, 3]}, {"id": "f56f8ad2e0", "unit": "BSBFLM0053B", "element": 2, "pc": "2.1", "topic": "Recruitment", "stem": "Element 2 covers both people and physical resources.", "feedback": "The element is \"Assist in recruiting employees and acquiring resources\" — criterion 2.1 covers recruitment and induction, criterion 2.2 covers physical resources and services.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "c90241fd91", "unit": "BSBFLM0053B", "element": 3, "pc": "3.1", "topic": "Performance systems", "stem": "Criterion 3.1 requires performance systems and processes to be identified and used to:", "feedback": "Progress against team plans and objectives. The unit measures the team against its plan, not its members against each other.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.1 of this unit."], "kind": "mc", "options": ["Assess progress in achieving team plans and objectives", "Rank individual team members against each other", "Justify variations to the operational plan", "Report to management on resource usage"], "answer": 0}, {"id": "320cdab3f1", "unit": "BSBFLM0053B", "element": 3, "pc": "3.1", "topic": "Performance systems", "stem": "Which THREE does the range statement list as performance systems and processes?", "feedback": "Performance systems and processes may be formal or informal, and include KPIs, specified work outcomes, individual and team work plans and feedback arrangements — plus informal systems used in place of existing organisation-wide systems.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.1 of this unit."], "kind": "ms", "options": ["Key performance indicators", "Individual and team work plans", "Feedback arrangements", "Disciplinary procedures", "Payroll systems"], "answers": [0, 1, 2]}, {"id": "f6bbe11feb", "unit": "BSBFLM0053B", "element": 3, "pc": "3.2", "topic": "Targets", "stem": "Criterion 3.2 requires targets and performance results to be identified and:", "feedback": "The criterion is a comparison: what was planned against what happened. Everything else in Element 3 follows from the gap between them.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.2 of this unit."], "kind": "mc", "options": ["Compared to actual productivity and performance", "Reported to relevant personnel each month", "Adjusted where they prove unrealistic", "Published to the work team"], "answer": 0}, {"id": "41d1cdfe87", "unit": "BSBFLM0053B", "element": 3, "pc": "3.3", "topic": "Unsatisfactory", "stem": "Criterion 3.3 requires unsatisfactory performance to be identified and reported to relevant personnel:", "feedback": "The criterion states its own purpose — rectification. Reporting that leads to a file note and nothing else does not meet it.", "hints": ["The criterion tells you why the report is made. Read the last clause.", "Re-read performance criterion 3.3 of this unit."], "kind": "mc", "options": ["To enable action to be taken to rectify the situation", "So that it can be recorded in the individual's file", "So that the operational plan can be revised", "So that disciplinary procedures can begin"], "answer": 0}, {"id": "c84bb9a5e0", "unit": "BSBFLM0053B", "element": 3, "pc": "3.4", "topic": "Coaching", "stem": "Criterion 3.4 requires coaching to be provided to support individuals and teams to use resources:", "feedback": "Effectively, economically and safely — three tests. A practice that is fast and cheap but unsafe fails the criterion just as clearly as a slow one.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.4 of this unit."], "kind": "mc", "options": ["Effectively, economically and safely", "Efficiently, consistently and safely", "Effectively, efficiently and economically", "Economically, safely and sustainably"], "answer": 0}, {"id": "43deed0d1c", "unit": "BSBFLM0053B", "element": 3, "pc": "3.4", "topic": "Coaching", "stem": "A technician consistently rebuilds machines from scratch where a stored image would do. What does criterion 3.4 point to?", "feedback": "The work gets done, so this is not unsatisfactory performance; it is an uneconomical use of time. Criterion 3.4 answers it with coaching.", "hints": ["The job is being completed. What is being wasted?", "Re-read performance criterion 3.4 of this unit."], "kind": "mc", "options": ["Coaching to support more effective and economical use of resources", "Reporting unsatisfactory performance under criterion 3.3", "A variation to the operational plan under criterion 3.6", "A contingency planning issue under criterion 1.4"], "answer": 0}, {"id": "2caca7472f", "unit": "BSBFLM0053B", "element": 3, "pc": "3.5", "topic": "Consultation", "stem": "Criterion 3.5 requires consultation processes for the development or variation of the operational plan to be:", "feedback": "Supported, again. This unit sits alongside the planning process rather than running it.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.5 of this unit."], "kind": "mc", "options": ["Supported as required", "Led by the work team's supervisor", "Documented and retained for audit", "Completed before any variation is presented"], "answer": 0}, {"id": "7e4227bd21", "unit": "BSBFLM0053B", "element": 3, "pc": "3.5", "topic": "Consultation", "stem": "Which THREE does the range statement list as consultation processes?", "feedback": "Consultation processes may refer to meetings, interviews, brainstorming sessions, email/intranet communications, newsletters or other processes that ensure all employees have the opportunity to contribute to team and individual operational plans.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.5 of this unit."], "kind": "ms", "options": ["Brainstorming sessions", "Email/intranet communications", "Newsletters", "Performance appraisals", "Annual salary reviews"], "answers": [0, 1, 2]}, {"id": "50e30142c7", "unit": "BSBFLM0053B", "element": 3, "pc": "3.6", "topic": "Variation", "stem": "Criterion 3.6 requires recommendations for variation to operational plans to be:", "feedback": "Presented. The decision belongs elsewhere; your job is to make sure the case reaches the people who decide.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.6 of this unit."], "kind": "mc", "options": ["Presented to relevant personnel", "Implemented once the team agrees", "Recorded in the performance system", "Approved by the OHS committee where safety is affected"], "answer": 0}, {"id": "09955ddaea", "unit": "BSBFLM0053B", "element": 3, "pc": "3.7", "topic": "Records", "stem": "Criterion 3.7 requires systems, procedures and records associated with performance to be:", "feedback": "Followed. Criterion 3.7 is the unglamorous one that makes the rest auditable.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.7 of this unit."], "kind": "mc", "options": ["Followed in accordance with the organisation's requirements", "Reviewed annually for effectiveness", "Maintained in a central database", "Made available to every member of the work team whenever requested"], "answer": 0}, {"id": "04c9ac3e3a", "unit": "BSBFLM0053B", "element": 3, "pc": "3.7", "topic": "Records", "stem": "Which TWO does the range statement list as performance systems, procedures and records?", "feedback": "The range statement lists individual and team performance plans, organisational policies and procedures relative to performance, and databases and other recording mechanisms.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.7 of this unit."], "kind": "ms", "options": ["Individual and team performance plans", "Databases and other recording mechanisms", "Job advertisements", "Supplier invoices"], "answers": [0, 1]}, {"id": "1ab64cc16c", "unit": "BSBFLM0053B", "element": 3, "pc": "3.2", "topic": "Targets", "stem": "Criterion 3.2 is satisfied by reporting actual productivity figures each month.", "feedback": "The criterion requires targets and results to be identified AND compared to actual productivity and performance. Figures with nothing to measure them against are not a comparison.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "5449af1ac8", "unit": "BSBFLM0053B", "element": 3, "pc": "3.3", "topic": "Unsatisfactory", "stem": "Under criterion 3.3 you are expected to take disciplinary action yourself when performance is unsatisfactory.", "feedback": "The criterion requires unsatisfactory performance to be identified and reported to relevant personnel so that action can be taken. Deciding and taking that action is not part of this unit.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "443763e119", "unit": "BSBFLM0053B", "element": 3, "pc": "3.4", "topic": "Coaching", "stem": "", "feedback": "Effectively, economically, safely — and \"safely\" is the one candidates most often leave out.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Coaching is provided to support individuals and teams to use resources "}, {"gap": 0}, {"t": ", "}, {"gap": 1}, {"t": " and "}, {"gap": 2}, {"t": "."}], "pool": ["effectively", "economically", "safely", "efficiently", "consistently", "independently", "sustainably"], "answer": [0, 1, 2]}, {"id": "d9a92629d3", "unit": "BSBFLM0053B", "element": 3, "pc": "3.2", "topic": "Targets", "stem": "", "feedback": "Use, compare, report, coach, present — criteria 3.1 to 3.6. The loop ends by feeding the plan, not by filing a result.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "The monitoring loop in Element 3: "}, {"gap": 0}, {"t": " the performance system, "}, {"gap": 1}, {"t": " targets against actual results, "}, {"gap": 2}, {"t": " unsatisfactory performance to relevant personnel, "}, {"gap": 3}, {"t": " individuals to use resources better, and "}, {"gap": 4}, {"t": " recommendations for variation."}], "pool": ["use", "compare", "report", "coach", "present", "approve", "discipline", "archive"], "answer": [0, 1, 2, 3, 4]}, {"id": "30f007eb28", "unit": "BSBFLM0053B", "element": 3, "pc": "3.3", "topic": "Performance", "stem": "Match each situation to the criterion in Element 3 that governs it.", "feedback": "Element 3 has a different response for each kind of gap. Treating all four as performance problems is the usual mistake.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 3.3."], "kind": "match", "left": ["Monthly figures show the team missed its resolution target", "One technician's error rate is well outside the team norm", "The team wastes licence spend through poor allocation", "The support hours in the plan no longer match demand"], "right": ["Criterion 3.2 — compare targets to actual performance", "Criterion 3.3 — report unsatisfactory performance", "Criterion 3.4 — coach on effective and economical resource use", "Criterion 3.6 — recommend a variation to the plan"], "answer": [0, 1, 2, 3]}, {"id": "0e88e642b3", "unit": "BSBFLM0053B", "element": 3, "pc": "3.7", "topic": "Records", "stem": "", "feedback": "Following the organisation's own systems is what makes performance monitoring evidence rather than opinion.", "hints": ["Each gap is marked separately — a wrong one does not cost you the others."], "kind": "cloze", "parts": [{"t": "Element 3 closes with criterion 3.7, which requires systems, procedures and records associated with performance to be "}, {"gap": {"type": "mc", "options": ["followed in accordance with the organisation's requirements", "reviewed for effectiveness", "held centrally by management", "audited annually"], "answers": [0], "accept": ["followed in accordance with the organisation's requirements"], "wild": false}}, {"t": ". The range statement names "}, {"gap": {"type": "mc", "options": ["databases and other recording mechanisms", "customer records", "purchase orders", "training certificates"], "answers": [0], "accept": ["databases and other recording mechanisms"], "wild": false}}, {"t": " among them."}]}, {"id": "06035c7feb", "unit": "BSBFLM0053B", "element": 3, "pc": "3.1", "topic": "Critical aspects", "stem": "The evidence guide requires you to demonstrate three things. Which is one of them?", "feedback": "The three critical aspects are sharing information with the team about implementing and monitoring the plan; assisting in planning resource acquisition and usage including human resources, risk management and contingency planning; and monitoring, analysing and reporting performance against targets.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.1 of this unit."], "kind": "mc", "options": ["Monitor, analyse and report individual and team performance against identified targets", "Write the operational plan for your department", "Approve resource acquisitions within a delegated budget", "Conduct disciplinary interviews with team members wherever performance targets have been missed"], "answer": 0}, {"id": "2682b7fd53", "unit": "BSBFLM0053B", "element": 3, "pc": "3.5", "topic": "Consultation", "stem": "What does the range statement say consultation processes must ensure?", "feedback": "Opportunity to contribute, not obligation to attend and not agreement. That is why the list includes newsletters and intranet communications alongside meetings.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.5 of this unit."], "kind": "mc", "options": ["That all employees have the opportunity to contribute to team and individual operational plans", "That decisions are reached by majority agreement", "That the operational plan is developed and formally approved before the start of the period it covers", "That every employee attends at least one planning meeting"], "answer": 0}, {"id": "516e5e2052", "unit": "BSBFLM0053B", "element": 1, "pc": "1.3", "topic": "KPIs", "stem": "Match each key performance indicator to the part of a network support operation it actually measures.", "feedback": "The range statement defines a KPI as a measure of the efficiency or effectiveness of a system. Each of these points at one system, not at a person — which is what keeps it usable under criterion 1.3.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 1.3."], "kind": "match", "left": ["Percentage of changes completed without rollback", "Mean time to restore service after a priority-one incident", "Percentage of assets with a current, verified configuration record", "Proportion of tickets resolved at first contact"], "right": ["Reliability of the change process", "Effectiveness of the incident response", "Quality of the documentation", "Capability at the front line"], "answer": [0, 1, 2, 3]}, {"id": "75cce68b55", "unit": "BSBFLM0053B", "element": 2, "pc": "2.2", "topic": "Acquisition", "stem": "", "feedback": "Criteria 1.1, 2.2 and 1.5 working together — consultation sits in the middle of the purchase, not after it.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "Acquiring a physical resource under Element 2: the requirement is "}, {"gap": 0}, {"t": " and recorded, relevant personnel are "}, {"gap": 1}, {"t": ", the acquisition follows the organisation's "}, {"gap": 2}, {"t": ", and the proposal for the resource is "}, {"gap": 3}, {"t": " as required."}], "pool": ["collected", "consulted", "procedures", "supported", "approved", "audited", "invoiced"], "answer": [0, 1, 2, 3]}, {"id": "f18a303340", "unit": "BSBFLM0053B", "element": 3, "pc": "3.3", "topic": "Unsatisfactory", "stem": "", "feedback": "Report so that the situation can be rectified — and pick the right criterion for the right kind of gap. Criterion 3.4 covers coaching on effective, economical and safe use of resources.", "hints": ["Each gap is marked separately — a wrong one does not cost you the others."], "kind": "cloze", "parts": [{"t": "A team member has missed the resolution target for three months running. Criterion 3.3 requires this to be identified and "}, {"gap": {"type": "mc", "options": ["reported to relevant personnel", "recorded in their personal file", "raised at the next team meeting", "addressed through the disciplinary procedure"], "answers": [0], "accept": ["reported to relevant personnel"], "wild": false}}, {"t": ", so that action can be taken to "}, {"gap": {"type": "sa", "options": ["rectify", "rectify*"], "answers": [0, 1], "accept": ["rectify", "rectify"], "wild": true}}, {"t": " the situation. If the cause turns out to be wasteful use of time rather than capability, criterion "}, {"gap": {"type": "mc", "options": ["3.4", "3.2", "3.6", "3.7"], "answers": [0], "accept": ["3.4"], "wild": false}}, {"t": " applies instead and the response is coaching."}]}]}, {"code": "BSBFLM0093B", "title": "Support continuous improvement systems and processes", "questions": [{"id": "5851f81854", "unit": "BSBFLM0093B", "element": 1, "pc": "1.1", "topic": "Participation", "stem": "Criterion 1.1 requires team members to be encouraged and supported to do three things. Which is one of them?", "feedback": "The three are: participate in decision making processes, assume responsibility, and exercise initiative. All three are about the team member acting, not reporting.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.1 of this unit."], "kind": "mc", "options": ["Exercise initiative", "Meet individual performance targets", "Document their own work procedures", "Report improvement opportunities to management"], "answer": 0}, {"id": "a0d6a618d7", "unit": "BSBFLM0093B", "element": 1, "pc": "1.1", "topic": "Participation", "stem": "A technician suggests a change to the imaging process. Which response best meets criterion 1.1?", "feedback": "Criterion 1.1 asks you to support people to participate in decision making and assume responsibility. Taking the idea off them, however politely, does the opposite.", "hints": ["Which option leaves the idea with the person who had it?", "Re-read performance criterion 1.1 of this unit."], "kind": "mc", "options": ["Ask them to work the idea up and bring it to the next team meeting", "Thank them and pass the idea to the manager", "Explain why the current process was chosen", "Tell them to trial it quietly and report back if it works"], "answer": 0}, {"id": "79a21d4d83", "unit": "BSBFLM0093B", "element": 1, "pc": "1.1", "topic": "Participation", "stem": "Continuous improvement under this unit is primarily the responsibility of management, with teams implementing what is decided.", "feedback": "Criterion 1.1 requires team members to be encouraged and supported to participate in decision making, assume responsibility and exercise initiative. The whole unit is built on the opposite assumption.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "3137b25419", "unit": "BSBFLM0093B", "element": 1, "pc": "1.2", "topic": "Communication", "stem": "Criterion 1.2 requires the organisation's continuous improvement processes to be:", "feedback": "Communicated — and the range statement is broad about how: verbal, written or electronic communications, and on-the-job mentoring and coaching.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.2 of this unit."], "kind": "mc", "options": ["Communicated to individuals and teams", "Documented in the quality manual", "Reviewed with individuals at appraisal", "Approved by the management team"], "answer": 0}, {"id": "7839c4f213", "unit": "BSBFLM0093B", "element": 1, "pc": "1.2", "topic": "Communication", "stem": "Which THREE does the range statement list under \"systems\" for communicating in this unit?", "feedback": "Systems may refer to organisation policies and procedures, web based communication devices, attendance at forums and meetings, and newsletters and reports.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.2 of this unit."], "kind": "ms", "options": ["Organisation policies and procedures", "Web based communication devices", "Newsletters and reports", "Personnel files", "Payroll systems"], "answers": [0, 1, 2]}, {"id": "8083a9d1d1", "unit": "BSBFLM0093B", "element": 1, "pc": "1.3", "topic": "Mentoring", "stem": "The range statement defines mentoring and coaching as including teaching another team member, providing feedback and encouragement, and:", "feedback": "Teaching a specific task or skill, providing feedback, support and encouragement on a range of matters, and assisting with problem solving. Note that assessment is not on the list.", "hints": ["Coaching and assessing are different relationships. Which one is this unit describing?", "Re-read performance criterion 1.3 of this unit."], "kind": "mc", "options": ["Providing assistance with problem solving", "Assessing their competence against the standard", "Setting their performance targets", "Recording their development needs"], "answer": 0}, {"id": "c3385d4161", "unit": "BSBFLM0093B", "element": 1, "pc": "1.3", "topic": "Mentoring", "stem": "Criterion 1.3 says effective mentoring and coaching ensures that individuals and teams are able to:", "feedback": "The criterion ties coaching directly to the purpose of the unit. Coaching here is not general development; it is what makes people capable of improving the work.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.3 of this unit."], "kind": "mc", "options": ["Support the organisation's continuous improvement processes", "Work without supervision", "Meet the requirements of their job description", "Progress to more senior roles"], "answer": 0}, {"id": "980c3766d7", "unit": "BSBFLM0093B", "element": 1, "pc": "1.3", "topic": "Mentoring", "stem": "Which is coaching, as the range statement uses the term?", "feedback": "Coaching in this unit focuses on a specific work task or skill, with feedback and support as the person does it. A course, a procedure and a correction are all useful — none of them is coaching.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.3 of this unit."], "kind": "mc", "options": ["Sitting with a technician while they work through a fault and prompting them at the points where they hesitate", "Sending the technician on a vendor training course", "Writing a procedure for the technician to follow next time", "Reviewing the technician's ticket notes after the job and sending back a list of the errors they should avoid next time"], "answer": 0}, {"id": "3012c22ef5", "unit": "BSBFLM0093B", "element": 1, "pc": "1.1", "topic": "Barriers", "stem": "The underpinning knowledge for this unit includes the barriers to continuous improvement. Which of these is the most common barrier in a small IT team?", "feedback": "The unit requires knowledge of the barriers to continuous improvement. The one that closes a system down fastest is suggestions that go nowhere — which is why criterion 3.1 requires agreed recommendations to be communicated back to the team.", "hints": ["Which barrier is created by the organisation's own response to ideas?", "Re-read performance criterion 1.1 of this unit."], "kind": "mc", "options": ["Improvement suggestions are made but nothing visibly changes, so people stop making them", "Team members lack formal quality management qualifications", "The organisation has no dedicated budget line set aside for continuous improvement activity", "Improvement requires technology the organisation does not own"], "answer": 0}, {"id": "dd20cd0c86", "unit": "BSBFLM0093B", "element": 1, "pc": "1.2", "topic": "CI processes", "stem": "Which of these does the range statement list as a continuous improvement process?", "feedback": "Continuous improvement processes may include policies and procedures for systematic review, cyclical audits and reviews, seeking and considering stakeholder feedback, modifications and improvements to systems, processes, services and products, and evaluations and monitoring of effectiveness.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.2 of this unit."], "kind": "mc", "options": ["Cyclical audits and reviews of workplace, team and individual performance", "Annual budget setting", "Recruitment, selection and induction of new members joining the work team each year", "Disciplinary procedures for repeated errors"], "answer": 0}, {"id": "ffbaa26a49", "unit": "BSBFLM0093B", "element": 1, "pc": "1.2", "topic": "CI processes", "stem": "Seeking and considering feedback from a range of stakeholders is listed as a continuous improvement process.", "feedback": "It appears in the range statement under continuous improvement processes, alongside cyclical audits and modifications to systems and services.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "9c527542f5", "unit": "BSBFLM0093B", "element": 1, "pc": "1.1", "topic": "Participation", "stem": "", "feedback": "Decision making, responsibility, initiative — the three things a team needs before continuous improvement is anything more than a suggestion box.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Criterion 1.1 requires team members to be encouraged and supported to participate in "}, {"gap": 0}, {"t": " processes, assume "}, {"gap": 1}, {"t": " and exercise "}, {"gap": 2}, {"t": "."}], "pool": ["decision making", "responsibility", "initiative", "improvement", "authority", "judgement", "consultation"], "answer": [0, 1, 2]}, {"id": "f2d50cad90", "unit": "BSBFLM0093B", "element": 1, "pc": "1.3", "topic": "Mentoring", "stem": "Match each support activity to what the range statement calls it.", "feedback": "The first three are the range statement's definition of mentoring and coaching; the fourth is criterion 1.2.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 1.3."], "kind": "match", "left": ["Showing a technician how to read the switch log", "Telling a technician their fault-finding has improved", "Working through a stubborn fault alongside a technician", "Explaining how the team's review cycle works"], "right": ["Teaching, focused on a specific work task or skill", "Providing feedback, support and encouragement", "Providing assistance with problem solving", "Communicating the organisation's continuous improvement processes"], "answer": [0, 1, 2, 3]}, {"id": "5e6a388c91", "unit": "BSBFLM0093B", "element": 1, "pc": "1.2", "topic": "Benefits", "stem": "The underpinning knowledge asks for understanding of the benefits of continuous improvement. Which is the clearest benefit to a network support team?", "feedback": "That is continuous improvement doing its job: the same ticket stops coming back. The benefit is capacity, not headcount reduction.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.2 of this unit."], "kind": "mc", "options": ["Recurring faults are removed at their cause instead of being fixed repeatedly", "Fewer staff are needed to run the service once the improvements have been made, so the department can reduce its headcount", "The team spends less time in meetings", "Documentation becomes unnecessary"], "answer": 0}, {"id": "8b423e43d6", "unit": "BSBFLM0093B", "element": 1, "pc": "1.3", "topic": "Mentoring", "stem": "Under the range statement, on-the-job mentoring and coaching counts as one of the ways the improvement processes may be communicated.", "feedback": "\"Communicated may refer to: verbal, written or electronic communications; on-the-job mentoring and coaching.\" The range statement also defines mentoring and coaching separately as a support activity, so it appears twice and does both jobs.", "hints": ["The range statement mentions coaching in two different entries."], "kind": "tf", "answer": true}, {"id": "a2cb62897d", "unit": "BSBFLM0093B", "element": 1, "pc": "1.2", "topic": "Technology", "stem": "Which of these does the range statement list under \"technology\" for this unit?", "feedback": "Technology may include computerised systems and software such as databases, project management and word-processing, telecommunications devices, and any other technology used to carry out work roles and responsibilities.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.2 of this unit."], "kind": "mc", "options": ["Computerised systems and software such as databases, project management and word-processing", "Network monitoring appliances only", "Any system approved by the IT department", "Manufacturing and process control equipment, together with the instrumentation used to monitor it"], "answer": 0}, {"id": "ae88afff5e", "unit": "BSBFLM0093B", "element": 1, "pc": "1.1", "topic": "Participation", "stem": "", "feedback": "Encouraged, communicated, mentoring, support — criteria 1.1 to 1.3.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "Element 1 in order: team members are "}, {"gap": 0}, {"t": " to participate and exercise initiative, the organisation's improvement processes are "}, {"gap": 1}, {"t": " to individuals and teams, and effective "}, {"gap": 2}, {"t": " and coaching ensures they are able to "}, {"gap": 3}, {"t": " those processes."}], "pool": ["encouraged", "communicated", "mentoring", "support", "assessed", "documented", "audited"], "answer": [0, 1, 2, 3]}, {"id": "b738db93d9", "unit": "BSBFLM0093B", "element": 1, "pc": "1.1", "topic": "Participation", "stem": "Team meetings are held monthly, but only the supervisor and one senior technician ever speak. Under criterion 1.1 this shows:", "feedback": "Criterion 1.1 is about encouragement and support, not about whether a forum exists. A meeting two people speak at is a briefing.", "hints": ["The forum is there. Is the criterion about the forum?", "Re-read performance criterion 1.1 of this unit."], "kind": "mc", "options": ["The participative arrangement exists but team members are not being supported to participate", "The meeting frequency should be increased", "The team is satisfied with current arrangements", "Improvement suggestions should be collected in writing instead, so that the quieter members of the team can contribute"], "answer": 0}, {"id": "2d5decde57", "unit": "BSBFLM0093B", "element": 1, "pc": "1.3", "topic": "Mentoring", "stem": "", "feedback": "Teaching a specific task or skill, feedback and encouragement, and help with problem solving.", "hints": ["Each gap is marked separately — a wrong one does not cost you the others."], "kind": "cloze", "parts": [{"t": "The range statement defines mentoring and coaching as teaching another member of the team, usually focusing on a specific work "}, {"gap": {"type": "sa", "options": ["task", "task or skill", "skill", "task*"], "answers": [0, 1, 2, 3], "accept": ["task", "task or skill", "skill", "task"], "wild": true}}, {"t": "; providing feedback, support and "}, {"gap": {"type": "mc", "options": ["encouragement", "assessment", "direction", "appraisal"], "answers": [0], "accept": ["encouragement"], "wild": false}}, {"t": " on a range of matters; and providing assistance with "}, {"gap": {"type": "mc", "options": ["problem solving", "record keeping", "performance review", "resource planning"], "answers": [0], "accept": ["problem solving"], "wild": false}}, {"t": "."}]}, {"id": "f00f4d23aa", "unit": "BSBFLM0093B", "element": 1, "pc": "1.2", "topic": "CI processes", "stem": "Which best describes what the range statement means by policies and procedures that allow an organisation to systematically review and improve quality?", "feedback": "The word is \"systematically\". Improvement that happens only when a conscientious person notices something is not a system.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 1.2 of this unit."], "kind": "mc", "options": ["A defined, repeating cycle that everyone knows, rather than improvement that depends on who happens to notice something", "A quality management standard certified by an external body", "A register of improvement suggestions maintained by management and reviewed whenever somebody has time to go through the entries", "An annual review of the business plan"], "answer": 0}, {"id": "bdf87c87b9", "unit": "BSBFLM0093B", "element": 2, "pc": "2.1", "topic": "Monitoring", "stem": "Criterion 2.1 requires the organisation's systems and technology to be used for two purposes. Which is one of them?", "feedback": "The two purposes are monitoring team progress and identifying ways planning and operations could be improved. The other options belong to Element 3.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.1 of this unit."], "kind": "mc", "options": ["To identify ways in which planning and operations could be improved", "To record the outcome of coaching sessions", "To communicate agreed recommendations to the team", "To maintain the organisation's records of improvement recommendations"], "answer": 0}, {"id": "481b5984e4", "unit": "BSBFLM0093B", "element": 2, "pc": "2.1", "topic": "Monitoring", "stem": "Your ticket system can report reopen rates by category. Under criterion 2.1, what makes this continuous improvement rather than just reporting?", "feedback": "Criterion 2.1 requires systems and technology to be used to monitor progress AND to identify ways operations could be improved. A report nobody acts on is monitoring without the improvement.", "hints": ["Three of these are things you do to a report. One is something you do because of it.", "Re-read performance criterion 2.1 of this unit."], "kind": "mc", "options": ["The reopen data is used to find where the process is going wrong and change it", "The report is produced on a regular schedule", "The report is circulated to the whole team", "The report is retained as evidence for the next external quality audit of the service desk"], "answer": 0}, {"id": "0edf8e8327", "unit": "BSBFLM0093B", "element": 2, "pc": "2.2", "topic": "Customer service", "stem": "Criterion 2.2 requires customer service to be improved through:", "feedback": "The criterion names the method: continuous improvement techniques and processes. That distinguishes it from customer service units, which improve service by other means.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.2 of this unit."], "kind": "mc", "options": ["Continuous improvement techniques and processes", "Customer satisfaction surveys and feedback", "Service level agreements and performance targets", "Training and coaching of the service team"], "answer": 0}, {"id": "36c47b8942", "unit": "BSBFLM0093B", "element": 2, "pc": "2.2", "topic": "Customer service", "stem": "The range statement for this unit says customer service may be:", "feedback": "Internal or external, existing or new. For a network administrator most customers are internal — which does not make them any less customers.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.2 of this unit."], "kind": "mc", "options": ["Internal or external, to existing or new clients", "External only, since internal users are colleagues", "Limited to clients with a current service agreement", "Determined by the organisation's customer service charter"], "answer": 0}, {"id": "30a3ee20bf", "unit": "BSBFLM0093B", "element": 2, "pc": "2.2", "topic": "Customer service", "stem": "The range statement links customer service in this unit to understanding different levels of customer satisfaction.", "feedback": "It lists identifying needs and priorities in delivering a service to customers, and understanding of different levels of customer satisfaction — the same ground as BSBCOR0103D in this cluster.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": true}, {"id": "ab244d689a", "unit": "BSBFLM0093B", "element": 2, "pc": "2.1", "topic": "Benchmarking", "stem": "The underpinning knowledge names benchmarking. What is it?", "feedback": "In quality management, benchmarking is comparison against a reference point to see where you stand. Be careful: the same word means something else entirely in systems administration.", "hints": ["This is the quality management sense of the word, not the server testing sense.", "Re-read performance criterion 2.1 of this unit."], "kind": "mc", "options": ["Comparing your performance against a reference point — another organisation, an industry standard, or your own earlier results", "Setting the performance targets a team will be measured against for the coming period, using what it managed last period as the basis", "Testing system performance under load", "Recording baseline configurations before a change"], "answer": 0}, {"id": "ec01e06453", "unit": "BSBFLM0093B", "element": 2, "pc": "2.1", "topic": "Best practice", "stem": "The underpinning knowledge also names best practice. In a continuous improvement context this means:", "feedback": "Best practice is provisional by design. Treating it as permanent is how a continuous improvement system stops being continuous.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.1 of this unit."], "kind": "mc", "options": ["The method currently known to produce the best result, adopted as the standard until something better is found", "The method set out in the organisation's own written procedures, which stays the standard until those procedures are formally revised", "The method the most experienced team member uses", "The method recommended by the equipment vendor"], "answer": 0}, {"id": "6ded5e81db", "unit": "BSBFLM0093B", "element": 2, "pc": "2.1", "topic": "Monitoring", "stem": "Which TWO does the range statement list under technology?", "feedback": "Technology may include computerised systems and software such as databases, project management and word-processing; telecommunications devices; and any other technology used to carry out work roles and responsibilities.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 2.1 of this unit."], "kind": "ms", "options": ["Telecommunications devices", "Databases, project management and word-processing software", "Printed procedure manuals held in the office", "The organisation's written quality policy"], "answers": [0, 1]}, {"id": "63e2566153", "unit": "BSBFLM0093B", "element": 2, "pc": "2.1", "topic": "Monitoring", "stem": "", "feedback": "Progress, planning, operations. The criterion looks forward at how the work is organised, not only backward at what was produced.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Criterion 2.1 requires the organisation's systems and technology to be used to monitor team "}, {"gap": 0}, {"t": " and to identify ways in which "}, {"gap": 1}, {"t": " and "}, {"gap": 2}, {"t": " could be improved."}], "pool": ["progress", "planning", "operations", "performance", "training", "reporting", "productivity"], "answer": [0, 1, 2]}, {"id": "130a279fd4", "unit": "BSBFLM0093B", "element": 2, "pc": "2.2", "topic": "Techniques", "stem": "Match each continuous improvement idea to what it does.", "feedback": "All four appear in the unit's range statement or underpinning knowledge. Together they answer: how do we know, what do we do, how often, and who tells us.", "hints": ["Start with the pair you are surest of and work outwards — that removes options from the rest.", "Two of these look alike. The difference is in criterion 2.2."], "kind": "match", "left": ["Benchmarking", "Best practice", "Cyclical review", "Stakeholder feedback"], "right": ["Compares your result against a reference point", "Adopts the currently best-known method as the standard", "Re-examines performance on a repeating schedule", "Brings in views from outside the team doing the work"], "answer": [0, 1, 2, 3]}, {"id": "b312abadd7", "unit": "BSBFLM0093B", "element": 2, "pc": "2.1", "topic": "Monitoring", "stem": "Criterion 2.1 requires improvements to planning and operations to be implemented as soon as they are identified.", "feedback": "Criterion 2.1 requires them to be identified. Element 3 then requires agreed recommendations to be communicated and recorded — the organisation's own processes decide what gets implemented.", "hints": ["Read the statement one clause at a time — a single wrong word makes the whole statement false."], "kind": "tf", "answer": false}, {"id": "977e91ab71", "unit": "BSBFLM0093B", "element": 2, "pc": "2.2", "topic": "Customer service", "stem": "", "feedback": "Technology, progress, customer, techniques — criteria 2.1 and 2.2 in full.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "Element 2 has two moves. The organisation's systems and "}, {"gap": 0}, {"t": " are used to monitor team "}, {"gap": 1}, {"t": " and identify improvements, and "}, {"gap": 2}, {"t": " service is improved through continuous improvement "}, {"gap": 3}, {"t": " and processes."}], "pool": ["technology", "progress", "customer", "techniques", "records", "satisfaction", "training"], "answer": [0, 1, 2, 3]}, {"id": "c11e6efa18", "unit": "BSBFLM0093B", "element": 2, "pc": "2.1", "topic": "Benchmarking", "stem": "", "feedback": "Benchmarking tells you where you stand; best practice is what you do ns", "stem": "Criterion 3.1 requires agreed recommendations for improvements in achieving the business plan to be:", "feedback": "Communicated to the team. Element 1 asked the team to contribute ideas; criterion 3.1 closes that loop by telling them what came of it.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.1 of this unit."], "kind": "mc", "options": ["Communicated to the team", "Implemented by the team", "Approved by senior management", "Recorded in the improvement register"], "answer": 0}, {"id": "e4bca42b9e", "unit": "BSBFLM0093B", "element": 3, "pc": "3.1", "topic": "Recommendations", "stem": "The range statement says agreed recommendations may be identified improvements arising from the continuous improvement process, and:", "feedback": "Both halves matter. The idea comes from the improvement process; the decision follows the organisation's own rules.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.1 of this unit."], "kind": "mc", "options": ["Determined in accordance with organisational policies and procedures", "Approved by the team by consensus", "Supported by a documented business case", "Scheduled for implementation within the current operational planning period"], "answer": 0}, {"id": "4caf86fa5e", "unit": "BSBFLM0093B", "element": 3, "pc": "3.2", "topic": "Documentation", "stem": "Criterion 3.2 requires work performance to be documented and used to:", "feedback": "Documented AND used. The purpose named in the criterion is finding the next improvement, not appraising people.", "hints": ["What does the criterion say the documentation is FOR?", "Re-read performance criterion 3.2 of this unit."], "kind": "mc", "options": ["Identify opportunities for further improvement", "Assess individual team members", "Report to management on team progress", "Support recommendations for resource  by each technician in the period", "A list of completed jobs with dates", "A file of customer thank-you emails"], "answer": 0}, {"id": "04e657f332", "unit": "BSBFLM0093B", "element": 3, "pc": "3.3", "topic": "Records", "stem": "Which THREE does the underpinning knowledge for this unit name?", "feedback": "The underpinning knowledge covers relevant legislation, the principles and techniques of continuous improvement systems and processes, benchmarking, best practice, the benefits of continuous improvement, the quality approaches the organisation may implement, the methods used, the barriers, and the recording, reporting and recommendation processes.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.3 of this unit."], "kind": "ms", "options": ["The barriers to continuous improvement", "The quality approaches the organisation may implement", "The organisation's recording, reporting and recommendation processes", "The legal requirements for retaining financial records", "The organisation's disciplinary procedures"], "answers": [0, 1, 2]}, {"id": "88317437b3", "unit": "BSBFLM0093B", "element": 3, "pc": "3.2", "topic": "Critical aspects", "stem": "The evidence guide requires you to show three abilities. Which is one of them?", "feedback": "The three are: monitor and report on specified outcomes, processes and procedures to improve performance; support others to implement the system/processes; and identify and support opportunities for further improvement.", "hints": ["Think about what the criterion actually asks you to do, not what sounds most thorough.", "Re-read performance criterion 3.2 of this unit."], "kind": "mc", "options": ["Support others to implement the continuous improvement system/processes", "Design the organisation's continuous improvement system", "Audit the continuous improvement system for compliance", "Report on continuous improvement to the board"], "answer": 0}, {"id": "e5b9b6ef30", "unit": "BSBFLM0093B", "element": 3, "pc": "3.3", "topic": "Records", "stem": "", "feedback": "Recommendations, performance, systems — criteria 3.1, 3.2 and 3.3.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "gap", "parts": [{"t": "Element 3 requires agreed "}, {"gap": 0}, {"t": " to be communicated to the team, work "}, {"gap": 1}, {"t": " to be documented and used to identify opportunities for further improvement, and records, reports and recommendations to be maintained within the organisation's "}, {"gap": 2}, {"t": " and processes."}], "pool": ["recommendations", "performance", "systems", "outcomes", "results", "files", "procedures"], "answer": [0, 1, 2]}, {"id": "8643e2826c", "unit": "BSBFLM0093B", "element": 3, "pc": "3.2", "topic": "Improvement cycle", "stem": "", "feedback": "Criteria 1.1, 1.2, 2.1, 3.1 and 3.3. The loop only closes when the outcome reaches the people who raised the idea.", "hints": ["Fill the gap you are certain of first; it narrows what can go in the others.", "There are more options than gaps — some are there to be left over."], "kind": "drag", "parts": [{"t": "The full cycle across this unit: the team is "}, {"gap": 0}, {"t": " to contribute, the improvement process is "}, {"gap": 1}, {"t": " to them, systems are used to "}, {"gap": 2}, {"t": " progress and spot improvements, agreed recommendations are "}, {"gap": 3}, {"t": " to the team, and everything is "}, {"gap": 4}, {"t": " within the organisation's systems."}], "pool": ["encouraged", "communicated", "monitor", "reported back", "maintained", "audited", "delegated", "approved"], "answer": [0, 1, 2, 3, 4]}, {"id": "5ed599419f", "unit": "BSBFLM0093B", "element": 3, "pc": "3.1", "topic": "Element map", "stem": "Match each activity to the criterion in this unit that governs it.", "feedback": "Element 1 builds the capability, Element 2 finds the e
